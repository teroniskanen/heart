function generateMonthCoachNotes(monthSignals, baseline, allSignals, allMonthReports, currentMonthKey) {
  const valid = monthSignals.filter(d => !d.incomplete);
  if (valid.length < 5) return { summary: "Not enough data this month for a meaningful assessment.", notes: [], guidance: [], callouts: [] };

  const rangeSummary = summarizeRange(valid, baseline);
  const avgRecovery = rangeSummary.avgRecovery;
  const avgStress = rangeSummary.avgStress;
  const avgLoad = rangeSummary.avgLoad;
  const avgEfficiency = rangeSummary.avgEfficiency;
  const avgDebt = rangeSummary.avgDebt;
  const monthRestingHR = rangeSummary.monthRestingHR;
  const rangeRecommendations = generateRangeRecommendations(valid, baseline);
  const primaryRecommendation = pickPrimaryRecommendation(rangeRecommendations);
  const dataQualitySummary = rangeSummary.dataQuality;

  const notes = [];
  const guidance = [];
  const callouts = [];

  // ── Week-by-week rollup (calendar weeks) ──
  const weekBuckets = {};
  for (const d of valid) {
    const dt = new Date(d.date);
    const tmp = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
    const dayNum = tmp.getUTCDay() || 7;
    tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
    const wk = `${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2, "0")}`;
    if (!weekBuckets[wk]) weekBuckets[wk] = [];
    weekBuckets[wk].push(d);
  }
  const weekSummaries = Object.entries(weekBuckets)
    .map(([wk, ds]) => ({
      wk,
      days: ds.length,
      rec: meanArr(ds.map(x => x.recoveryQuality)),
      stress: meanArr(ds.map(x => x.stressSignature)),
    }))
    .sort((a, b) => a.wk.localeCompare(b.wk));
  if (weekSummaries.length >= 2) {
    const best = [...weekSummaries].sort((a, b) => (b.rec - b.stress * 0.4) - (a.rec - a.stress * 0.4))[0];
    const worst = [...weekSummaries].sort((a, b) => (a.rec - a.stress * 0.4) - (b.rec - b.stress * 0.4))[0];
    if (best && worst && (best.rec - best.stress * 0.4) - (worst.rec - worst.stress * 0.4) > 6) {
      notes.push({ icon: "▦", text: `Week-by-week: best week (${best.wk}) recovery ${Math.round(best.rec)}, stress ${Math.round(best.stress)}. Toughest week (${worst.wk}) recovery ${Math.round(worst.rec)}, stress ${Math.round(worst.stress)}.` });
    }
  }


  // ── Activity summary ──
  const workoutDays = valid.filter(d => d.activityLevel === "workout");
  const moderateDays = valid.filter(d => d.activityLevel === "moderate");
  const lightDays = valid.filter(d => d.activityLevel === "light");
  const restDays = valid.filter(d => d.activityLevel === "rest");
  const totalActive = workoutDays.length + moderateDays.length + lightDays.length;
  const avgActiveMinutes = meanArr(valid.map(d => d.activeMinutes || 0));

  // ── Recovery observation ──
  if (avgRecovery >= 65) {
    notes.push({ icon: "✦", text: "Strong recovery this month. Your body consistently returned to low overnight HR — good sleep quality and manageable load." });
  } else if (avgRecovery >= 50) {
    notes.push({ icon: "—", text: `Adequate recovery (avg ${Math.round(avgRecovery)}). You're recovering, but not optimally — there's room to improve.` });
    guidance.push("To push recovery higher: aim for a consistent bedtime within a 30-minute window, keep your bedroom cool (18-20°C), and avoid screens in the last 30 minutes before sleep.");
  } else {
    notes.push({ icon: "▽", text: `Recovery under pressure (avg ${Math.round(avgRecovery)}). Overnight HR stayed elevated more often than it should — your body wasn't fully resetting.` });
    guidance.push("Priority: sleep. Start with the simplest intervention — go to bed 30 minutes earlier for one week and see if your overnight HR responds. If it doesn't, the issue may be stress-related rather than sleep-quantity.");
  }

  // ── Stress observation (cross-referenced with activity) ──
  const activeHighStressDays = valid.filter(d => d.stressSignature > 55 && (d.activityLevel === "workout" || d.activityLevel === "moderate"));
  const restHighStressDays = valid.filter(d => d.stressSignature > 55 && d.activityLevel === "rest");

  if (avgStress > 60) {
    if (activeHighStressDays.length > restHighStressDays.length) {
      notes.push({ icon: "△", text: `Elevated stress signature (avg ${Math.round(avgStress)}), partly explained by ${activeHighStressDays.length} active days where post-exercise HR was still elevated in the evening. On rest days the stress signal was lower.` });
      guidance.push("Some evening elevation after exercise is normal. But if it persists past 9pm, your workout timing may be too late. Try finishing intense activity at least 3 hours before bed.");
    } else {
      notes.push({ icon: "△", text: `Elevated stress signature (avg ${Math.round(avgStress)}) even on rest days. Evening HR stayed persistently above baseline — this points to mental or life stress rather than training load.` });
      guidance.push("Your evenings aren't calming down. Try a structured wind-down: dim lights after 8pm, avoid intense conversations or work email, and consider a 10-minute walk after dinner.");
    }
  } else if (avgStress < 35) {
    notes.push({ icon: "✦", text: "Low stress markers. Your evenings were genuinely calm — heart rate settled well." });
  }

  // ── Daytime quiescence (aware of activity days) ──
  if (avgEfficiency > 60) {
    notes.push({ icon: "✦", text: "Good daytime quiescence — a healthy proportion of your day at low heart rates." });
  } else if (avgEfficiency < 35) {
    if (totalActive > valid.length * 0.4) {
      notes.push({ icon: "—", text: `Daytime quiescence is low (${Math.round(avgEfficiency)}%), but you were active on ${totalActive} of ${valid.length} days — activity naturally pushes daytime HR up. This isn't necessarily a concern.` });
    } else {
      notes.push({ icon: "▽", text: `Low daytime quiescence (${Math.round(avgEfficiency)}%). Your heart rate ran high during the day without much recorded activity to explain it.` });
      guidance.push("A high resting daytime HR can reflect caffeine, dehydration, stress, or deconditioning. If you drink coffee past noon, try cutting it. Even a 15-minute walk at lunchtime can measurably lower average daytime HR over 2-3 weeks.");
    }
  }

  // ── Recovery debt ──
  if (avgDebt > 45) {
    notes.push({ icon: "△", text: `Recovery debt accumulated (avg ${Math.round(avgDebt)}). Your rolling resting HR sat above baseline — not enough recovery between efforts.` });
    guidance.push("Debt means you're spending more than you're replenishing. Make sure your two lowest-stress days of the week are genuinely low-load: no intense training, lighter meals, earlier bedtime.");
  }

  // ── Autonomic load (corrected thresholds for rescaled signal) ──
  if (avgLoad > 40) {
    notes.push({ icon: "△", text: `Elevated autonomic load (avg ${Math.round(avgLoad)}). Overnight HR ran higher and less stable than your norm — often tracks with illness, accumulated fatigue, or significant stress.` });
  } else if (avgLoad < 15) {
    notes.push({ icon: "✦", text: "Low autonomic load — your nervous system was calm and stable overnight. A sign of good recovery." });
  }

  // ── Activity observations ──
  const activityParts = [];
  if (workoutDays.length > 0) activityParts.push(`${workoutDays.length} workout${workoutDays.length > 1 ? "s" : ""}`);
  if (moderateDays.length > 0) activityParts.push(`${moderateDays.length} moderate`);
  if (lightDays.length > 0) activityParts.push(`${lightDays.length} light`);

  if (activityParts.length > 0) {
    notes.push({ icon: "◇", text: `Activity: ${activityParts.join(", ")} (${restDays.length} rest day${restDays.length !== 1 ? "s" : ""}). Average ${Math.round(avgActiveMinutes)} active minutes per day.` });
  } else {
    notes.push({ icon: "◇", text: `No significant activity detected this month. Average elevated HR was ${Math.round(avgActiveMinutes)} minutes per day.` });
  }

  // Activity-specific guidance
  if (restDays.length < 2 && valid.length >= 14) {
    guidance.push("You had very few genuine rest days this month. Even one full rest day per week gives your cardiovascular system time to adapt. Without it, gains from activity get blunted.");
  }
  if (totalActive < valid.length * 0.15 && avgEfficiency < 50) {
    guidance.push("Low activity paired with low daytime quiescence suggests your system would benefit from more movement. Start small: 20-minute walks 3 times per week. Your daytime HR should start dropping within 2-3 weeks.");
  }
  if (workoutDays.length > 0 && moderateDays.length === 0 && lightDays.length < 2) {
    guidance.push("Your activity pattern is all-or-nothing — hard workouts with no lighter activity in between. Adding 1-2 light days (walking, easy cycling) between workouts improves recovery and long-term cardiovascular fitness more than rest alone.");
  }

  // ── Phase 4: HR Nadir Timing ──
  const nadirDays = valid.filter(d => d.nadirHour !== null);
  if (nadirDays.length >= 5) {
    const avgNadir = meanArr(nadirDays.map(d => d.nadirHour));
    const lateNadirDays = nadirDays.filter(d => d.nadirHour > 5).length;
    const nadirH = Math.floor(avgNadir);
    const nadirM = Math.round((avgNadir - nadirH) * 60);
    const nadirStr = `${nadirH}:${String(nadirM).padStart(2, "0")}am`;
    if (avgNadir >= 2 && avgNadir <= 3.5) {
      notes.push({ icon: "✦", text: `Good sleep architecture. Your overnight HR typically bottomed out around ${nadirStr} — right in the optimal 2–3:30am window. Your body was in deep recovery early in the night.` });
    } else if (avgNadir > 4.5 || lateNadirDays > nadirDays.length * 0.4) {
      notes.push({ icon: "△", text: `Late HR nadir (avg ${nadirStr}, with ${lateNadirDays} nights past 5am). Your body was still fighting to calm down deep into the night — a common sign of late eating, alcohol, or elevated stress at bedtime.` });
      guidance.push("A late HR nadir means your nervous system stayed active when it should be winding down. Try cutting food intake 2–3 hours before bed, and avoid alcohol in the 4 hours before sleep — even one drink shifts the nadir later and suppresses deep recovery.");
    } else {
      notes.push({ icon: "—", text: `Overnight HR nadir typically around ${nadirStr}. Slightly later than optimal (2–3:30am), suggesting occasional evening load. Consistent bedtime and lighter evenings will pull this earlier.` });
    }
  }

  // ── Phase 3: Evening Restitution Rate ──
  const decayDays = valid.filter(d => d.eveningDecay !== null);
  if (decayDays.length >= 5) {
    const avgDecay = meanArr(decayDays.map(d => d.eveningDecay));
    const flatDays = decayDays.filter(d => d.eveningDecay > -0.05).length;
    if (avgDecay < -0.1) {
      notes.push({ icon: "✦", text: `Good evening recovery. Your HR dropped an average of ${Math.abs(Math.round(avgDecay * 60 * 10) / 10)} bpm/hour from 8pm to 11pm — your parasympathetic system was actively winding you down.` });
    } else if (avgDecay > -0.02 || flatDays > decayDays.length * 0.4) {
      notes.push({ icon: "△", text: `Slow evening restitution rate (avg ${Math.round(avgDecay * 60 * 10) / 10} bpm/hr). On ${flatDays} nights, HR barely dropped between 8–11pm — your nervous system stayed in an activated state when it should be decelerating.` });
      guidance.push("A flat evening HR curve means your body isn't shifting into recovery mode. The most effective interventions: dim indoor lighting after 8pm (it signals the suprachiasmatic nucleus directly), avoid screens or intense conversation, and try a slow 10-minute walk after dinner — the mild activity paradoxically accelerates the HR drop.");
    }
  }

  // ── Phase 6: ACWR monthly summary ──
  const acwrValid = valid.filter(d => d.acwr !== null);
  if (acwrValid.length >= 7) {
    const avgAcwr = meanArr(acwrValid.map(d => d.acwr));
    const dangerDays = acwrValid.filter(d => d.acwr > 1.5).length;
    const sweetDays  = acwrValid.filter(d => d.acwr >= 0.8 && d.acwr <= 1.3).length;
    const detDays    = acwrValid.filter(d => d.acwr < 0.8).length;
    if (dangerDays >= 3) {
      notes.push({ icon: "△", text: `Training load spiked this month — ACWR exceeded 1.5 on ${dangerDays} days (avg ${avgAcwr.toFixed(2)}). Your acute load was growing faster than your body's established capacity.` });
      guidance.push(`After a high-load month, give your body a deliberate deload week: cut volume by 40%, keep frequency if you can, focus on sleep. ACWR should settle back below 1.3 before ramping up again.`);
    } else if (sweetDays >= acwrValid.length * 0.6) {
      notes.push({ icon: "✦", text: `Training load was well-calibrated. ${sweetDays} of ${acwrValid.length} days with ACWR in the 0.8–1.3 sweet spot (avg ${avgAcwr.toFixed(2)}) — you built fitness without accumulating excessive strain.` });
    } else if (detDays >= acwrValid.length * 0.5) {
      notes.push({ icon: "—", text: `Low training load this month — ACWR below 0.8 on ${detDays} days (avg ${avgAcwr.toFixed(2)}). You were doing less than your body is conditioned to handle.` });
    }
  }

  // ── Pulse Stability (overnight rhythm coherence) ──
  const pulseDays = valid.filter(d => d.pulseStability !== null);
  if (pulseDays.length >= 5) {
    const avgPulse = meanArr(pulseDays.map(d => d.pulseStability));
    const avgCv  = meanArr(pulseDays.map(d => d.nightVolatilityPercent));
    const chaoticNights = pulseDays.filter(d => d.nightVolatilityPercent > 8).length;
    if (avgPulse >= 70) {
      notes.push({ icon: "✦", text: `Strong overnight pulse stability (avg ${Math.round(avgPulse)}, variation ${avgCv.toFixed(1)}%). Your sleeping HR ran in a tight, stable rhythm — a positive sign for recovery consistency.` });
    } else if (chaoticNights >= pulseDays.length * 0.3) {
      notes.push({ icon: "△", text: `Disrupted overnight pulse rhythm on ${chaoticNights} nights this month (variation >8%). Even when average overnight HR looked normal, the pattern was more erratic than usual.` });
      guidance.push("Pulse stability is based on variation in HR readings, not inter-beat HRV. Use it as a trend indicator only: alcohol, heavy late meals, illness, and stress commonly make this pattern more chaotic.");
    } else if (avgPulse < 50) {
      notes.push({ icon: "—", text: `Moderate overnight pulse stability this month (avg ${Math.round(avgPulse)}, variation ${avgCv.toFixed(1)}%). Your sleeping HR showed more oscillation than ideal.` });
    }
  }

  // ── Wake Spike ──
  const spikeDays = valid.filter(d => d.wakeSpike !== null);
  if (spikeDays.length >= 5) {
    const avgSpike = meanArr(spikeDays.map(d => d.wakeSpike));
    const highSpikeDays = spikeDays.filter(d => d.wakeSpike > 35).length;
    if (avgSpike <= 25 && highSpikeDays === 0) {
      notes.push({ icon: "✦", text: `Healthy wake-up response (avg +${Math.round(avgSpike)} bpm above sleep HR). Your cardiovascular system transitions from sleep to waking smoothly — a sign of good autonomic flexibility.` });
    } else if (avgSpike > 30 || highSpikeDays >= 3) {
      notes.push({ icon: "△", text: `Exaggerated wake-up HR spike this month (avg +${Math.round(avgSpike)} bpm, ${highSpikeDays} mornings above +35 bpm). A large spike means your nervous system is working hard to regulate blood pressure at waking — often seen with accumulated fatigue, dehydration, or high autonomic load.` });
      guidance.push("A high wake-up HR spike is one of the earlier signs of systemic fatigue. Drink 250–500ml of water immediately on waking, and consider whether your sleep is genuinely restorative — look at the nights before your highest-spike mornings for patterns (late evening, alcohol, poor recovery score).");
    }
  }

  // ── Daytime Sympathetic Load ──
  const idleDays = valid.filter(d => d.idleStressMinutes !== null && d.idleStressMinutes > 0);
  if (idleDays.length >= 5) {
    const avgIdle = meanArr(idleDays.map(d => d.idleStressMinutes));
    const highIdleDays = idleDays.filter(d => d.idleStressMinutes > 60).length;
    if (avgIdle > 45 || highIdleDays >= 4) {
      notes.push({ icon: "△", text: `Significant invisible load this month: ${Math.round(avgIdle)} sustained minutes per day of elevated HR while at rest (${highIdleDays} days with 60+ minutes). This isn't exercise — it's your nervous system running hot for unexplained reasons.` });
      guidance.push("Sustained daytime HR elevation without movement is invisible stress — it taxes your cardiovascular system just as much as light exercise, without the fitness benefit. Common causes: caffeine past noon, chronic work anxiety, dehydration, or subclinical illness. The most actionable test: eliminate caffeine after 12pm for one week and see if these minutes drop.");
    } else if (avgIdle > 15) {
      notes.push({ icon: "—", text: `Moderate daytime sympathetic load on ${idleDays.length} rest days (avg ${Math.round(avgIdle)} min/day of unexplained HR elevation). Worth watching — if this grows, it usually precedes a stress or recovery dip.` });
    }
  }

    // ── Month themes: drivers + wins + change vs last month ──
  const driverCounts = {};
  for (const d of valid) {
    if (!d.drivers) continue;
    for (const k of d.drivers) driverCounts[k] = (driverCounts[k] || 0) + 1;
  }

  const disruptorKeys = ["elevated_night_hr", "late_nadir", "flat_evening", "high_night_volatility", "high_wake_spike", "high_idle_stress", "low_pulse_stability", "rising_baseline", "incomplete_workout_recovery"];
  const winKeys = ["good_nadir", "good_evening_drop", "stable_pulse", "smooth_wake", "calm_day", "good_recovery_morning"];

  const labelMap = {
    elevated_night_hr: "elevated overnight HR",
    late_nadir: "late HR nadir",
    flat_evening: "flat evening wind-down",
    high_night_volatility: "chaotic overnight rhythm",
    low_pulse_stability: "low pulse stability",
    high_wake_spike: "high wake-up spike",
    high_idle_stress: "high daytime idle stress",
    rising_baseline: "rising resting HR trend",
    incomplete_workout_recovery: "incomplete post-workout recovery",
    good_nadir: "optimal nadir timing",
    good_evening_drop: "strong evening wind-down",
    stable_pulse: "stable overnight rhythm",
    smooth_wake: "smooth wake response",
    calm_day: "calm daytime HR",
    good_recovery_morning: "restorative night",
  };

  const topDisruptors = disruptorKeys
    .map(k => [k, driverCounts[k] || 0])
    .filter(x => x[1] > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);
  if (topDisruptors.length > 0) {
    const parts = topDisruptors.map(([k, v]) => `${labelMap[k] || k} (${v} day${v !== 1 ? "s" : ""})`);
    notes.push({ icon: "◎", text: `Most common disruptors this month: ${parts.join(", ")}.` });
  }

  const topWins = winKeys
    .map(k => [k, driverCounts[k] || 0])
    .filter(x => x[1] > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);
  if (topWins.length > 0) {
    const parts = topWins.map(([k, v]) => `${labelMap[k] || k} (${v} day${v !== 1 ? "s" : ""})`);
    notes.push({ icon: "✦", text: `What went well: ${parts.join(", ")}.` });
  }

  // Change vs previous month (if available)
  if (allSignals && allMonthReports) {
    const sortedKeys = Object.keys(allMonthReports).sort();
    const idx = sortedKeys.indexOf(currentMonthKey);
    if (idx > 0) {
      const prevKey = sortedKeys[idx - 1];
      const prevValid = allSignals.filter(d => getMonthKey(d.date) === prevKey && !d.incomplete && d.confidence !== "low");
      const prevCounts = {};
      for (const d of prevValid) {
        if (!d.drivers) continue;
        for (const k of d.drivers) prevCounts[k] = (prevCounts[k] || 0) + 1;
      }
      const diffs = disruptorKeys
        .map(k => ({ k, delta: (driverCounts[k] || 0) - (prevCounts[k] || 0) }))
        .filter(x => Math.abs(x.delta) >= 3)
        .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))
        .slice(0, 3);
      if (diffs.length > 0) {
        const parts = diffs.map(d => `${labelMap[d.k] || d.k} ${d.delta > 0 ? "↑" : "↓"} ${Math.abs(d.delta)}`);
        notes.push({ icon: "⇄", text: `Compared with last month: ${parts.join(", ")}.` });
      }
    }
  }

// ── Intra-month trend ──
  if (valid.length >= 14) {
    const firstHalf = valid.slice(0, Math.floor(valid.length / 2));
    const secondHalf = valid.slice(Math.floor(valid.length / 2));
    const firstRec = meanArr(firstHalf.map(d => d.recoveryQuality));
    const secondRec = meanArr(secondHalf.map(d => d.recoveryQuality));
    const firstStress = meanArr(firstHalf.map(d => d.stressSignature));
    const secondStress = meanArr(secondHalf.map(d => d.stressSignature));

    if (secondRec - firstRec > 6) {
      notes.push({ icon: "↗", text: `The month got better. Recovery improved from ~${Math.round(firstRec)} in the first half to ~${Math.round(secondRec)} in the second.` });
    } else if (firstRec - secondRec > 6) {
      notes.push({ icon: "↘", text: `The month declined. Recovery dropped from ~${Math.round(firstRec)} early to ~${Math.round(secondRec)} later.` });
      guidance.push("When signals deteriorate through a month, it usually means load accumulated faster than recovery. Consider front-loading your harder activities earlier in the month and tapering intensity in the final week.");
    }
    if (secondStress - firstStress > 6) {
      notes.push({ icon: "↗", text: `Stress rose through the month (${Math.round(firstStress)} → ${Math.round(secondStress)}).` });
    }
  }

  // ── Day callouts — best and worst ──
  if (valid.length >= 7) {
    const eligible = valid.filter(d => d.confidence !== "low" && d.recoveryQuality !== null);
    const sorted = [...(eligible.length ? eligible : valid.filter(d => d.recoveryQuality !== null))].sort((a, b) => b.recoveryQuality - a.recoveryQuality);
    const best = sorted[0];
    const worst = sorted[sorted.length - 1];
    if (best.recoveryQuality - worst.recoveryQuality > 15) {
      const bestDay = new Date(best.date).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
      const worstDay = new Date(worst.date).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
      callouts.push({ best: { date: bestDay, recovery: best.recoveryQuality, stress: best.stressSignature }, worst: { date: worstDay, recovery: worst.recoveryQuality, stress: worst.stressSignature } });
    }
  }

  // ── Month-over-month comparison (full card data) ──
  let monthComparison = null;
  if (allMonthReports && allSignals) {
    const sortedKeys = Object.keys(allMonthReports).sort();
    const currentIdx = sortedKeys.indexOf(currentMonthKey);
    if (currentIdx > 0) {
      const prevKey = sortedKeys[currentIdx - 1];
      const prevValid = allSignals.filter(d => getMonthKey(d.date) === prevKey && !d.incomplete);
      const prevReport = allMonthReports[prevKey];
      if (prevReport && prevReport.avgRecovery !== undefined && prevValid.length >= 5) {
        const prevAvgDebt = meanArr(prevValid.map(d => d.recoveryDebt));
        const prevAvgLoad = prevReport.avgLoad !== undefined ? prevReport.avgLoad : null;
        const prevAvgEff  = prevReport.avgEfficiency !== undefined ? prevReport.avgEfficiency : null;
        const recDiff     = avgRecovery - prevReport.avgRecovery;
        const stressDiff  = avgStress   - prevReport.avgStress;
        const debtDiff    = avgDebt     - prevAvgDebt;
        const loadDiff    = prevAvgLoad !== null ? avgLoad - prevAvgLoad : null;
        // Driver deltas
        const prevCounts = {};
        for (const d of prevValid) { if (d.drivers) for (const k of d.drivers) prevCounts[k] = (prevCounts[k] || 0) + 1; }
        const allDriverKeys = ["elevated_night_hr","late_nadir","flat_evening","high_night_volatility","high_wake_spike","high_idle_stress","low_pulse_stability","rising_baseline","incomplete_workout_recovery","good_nadir","good_evening_drop","stable_pulse","smooth_wake","calm_day","good_recovery_morning"];
        const driverDeltas = allDriverKeys
          .map(k => ({ k, curr: driverCounts[k] || 0, prev: prevCounts[k] || 0, delta: (driverCounts[k] || 0) - (prevCounts[k] || 0) }))
          .filter(x => Math.abs(x.delta) >= 2)
          .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))
          .slice(0, 4);
        monthComparison = {
          prevMonth: fmtMonth(prevKey),
          improving: recDiff > 0 || stressDiff < 0,
          changes: `Recovery ${recDiff > 0 ? "+" : ""}${Math.round(recDiff * 10) / 10}, stress ${stressDiff > 0 ? "+" : ""}${Math.round(stressDiff * 10) / 10}`,
          recDiff: Math.round(recDiff * 10) / 10,
          stressDiff: Math.round(stressDiff * 10) / 10,
          debtDiff: Math.round(debtDiff * 10) / 10,
          loadDiff: loadDiff !== null ? Math.round(loadDiff) : null,
          driverDeltas,
        };
      }
    }
  }

  // ── Weekly summaries + forward focus ──
  const weeklySummaries = [];
  if (valid.length >= 7) {
    // Group by Mon-Sun calendar weeks
    const weekMap = {};
    for (const d of valid) {
      const dt = new Date(d.date);
      const day = dt.getDay(); // 0=Sun
      const mondayOffset = (day === 0 ? -6 : 1 - day);
      const monday = new Date(dt);
      monday.setDate(dt.getDate() + mondayOffset);
      const wk = monday.toISOString().slice(0, 10);
      if (!weekMap[wk]) weekMap[wk] = [];
      weekMap[wk].push(d);
    }
    for (const [wk, days] of Object.entries(weekMap).sort()) {
      if (days.length < 3) continue;
      const avgRec  = meanArr(days.map(d => d.recoveryQuality));
      const avgStr  = meanArr(days.map(d => d.stressSignature));
      const avgDebt = meanArr(days.map(d => d.recoveryDebt));
      const workouts = days.filter(d => d.activityLevel === "workout" || d.activityLevel === "moderate").length;
      const topDrivers = {};
      for (const d of days) { if (d.drivers) for (const k of d.drivers) topDrivers[k] = (topDrivers[k] || 0) + 1; }
      const label = new Date(wk).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      weeklySummaries.push({ wk, label, avgRec: Math.round(avgRec), avgStr: Math.round(avgStr), avgDebt: Math.round(avgDebt), workouts, topDrivers, days: days.length });
    }
  }

  let weeklyFocus = null;
  if (weeklySummaries.length >= 2) {
    const scored = weeklySummaries.map(w => ({ ...w, score: w.avgRec - w.avgStr * 0.5 - w.avgDebt * 0.3 }));
    const best  = scored.reduce((a, b) => b.score > a.score ? b : a);
    const tough = scored.reduce((a, b) => b.score < a.score ? b : a);
    // Pick forward focus from dominant monthly disruptors
    const focusMap = [
      { key: "late_nadir",                    rec: "Earlier evenings and lighter meals after 8 pm" },
      { key: "high_idle_stress",              rec: "Reduce stimulants after noon and add brief midday movement" },
      { key: "high_wake_spike",              rec: "Hydrate immediately on waking and review pre-sleep habits" },
      { key: "elevated_night_hr",            rec: "Prioritise sleep regularity over duration this week" },
      { key: "flat_evening",                 rec: "Wind down earlier — dimmer light and no screens after 9 pm" },
      { key: "high_night_volatility",        rec: "Eliminate alcohol and heavy meals in the 3 hours before bed" },
      { key: "low_pulse_stability",          rec: "Space intensity and add one genuine rest day" },
      { key: "rising_baseline",              rec: "Take stock of cumulative load — add recovery days before adding more training" },
      { key: "incomplete_workout_recovery",  rec: "Allow an extra easy day before your next hard session" },
    ];
    let focusRec = null;
    let focusReason = null;
    for (const { key, rec } of focusMap) {
      if ((driverCounts[key] || 0) >= 4) { focusRec = rec; focusReason = labelMap[key] || key; break; }
    }
    if (!focusRec && topDisruptors.length > 0) {
      const top = topDisruptors[0];
      focusRec = "Reduce the most common disruptor from this month";
      focusReason = labelMap[top[0]] || top[0];
    }
    weeklyFocus = { best, tough, focusReason, focusRec };
  }

  // ── Summary ──
  let summary = "";
  if (monthRestingHR !== null) {
    const diff = monthRestingHR - baseline.restingHR;
    if (Math.abs(diff) < 2) summary = `Resting HR: ~${monthRestingHR} bpm — right at your baseline.`;
    else if (diff > 0) summary = `Resting HR: ~${monthRestingHR} bpm — ${Math.round(diff)} bpm above your baseline of ${baseline.restingHR}.`;
    else summary = `Resting HR: ~${monthRestingHR} bpm — ${Math.round(Math.abs(diff))} bpm below baseline (${baseline.restingHR}). Positive sign.`;
  }

  // ── Top priority ──
  const copyMode = dataQualitySummary.copyMode || "direct";
  let priority = null;
  if (primaryRecommendation && primaryRecommendation.confidence !== "low") {
    priority = { label: primaryRecommendation.title, text: primaryRecommendation.why, confidence: primaryRecommendation.confidence };
  } else {
    priority = buildFallbackPriority(avgRecovery, avgStress, avgDebt, avgEfficiency, copyMode);
  }

  return {
    summary,
    notes,
    guidance,
    callouts,
    monthComparison,
    weeklyFocus,
    weeklySummaries,
    priority,
    recommendations: rangeRecommendations,
    primaryRecommendation,
    avgRecovery,
    avgStress,
    avgLoad,
    avgEfficiency,
    avgDebt,
    workoutCount: workoutDays.length,
    dataQualitySummary,
  };
}


// ─── UI Components ───────────────────────────────────────────────────────

function pearson(xs, ys) {
  const n = xs.length;
  if (n < 5) return null;
  let sx = 0, sy = 0;
  for (let i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; }
  const mx = sx / n, my = sy / n;
  let num = 0, dx2 = 0, dy2 = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - mx, dy = ys[i] - my;
    num += dx * dy;
    dx2 += dx * dx;
    dy2 += dy * dy;
  }
  const den = Math.sqrt(dx2 * dy2);
  return den > 0 ? num / den : null;
}

function computeSignalCorrelations(valid, signals) {
  const results = [];
  for (let i = 0; i < signals.length; i++) {
    for (let j = i + 1; j < signals.length; j++) {
      const xs = [], ys = [];
      for (const d of valid) {
        const a = d[signals[i].field], b = d[signals[j].field];
        if (a !== null && a !== undefined && b !== null && b !== undefined) {
          xs.push(a); ys.push(b);
        }
      }
      const r = pearson(xs, ys);
      if (r !== null) results.push({ a: signals[i], b: signals[j], r, n: xs.length });
    }
  }
  results.sort((p, q) => Math.abs(q.r) - Math.abs(p.r));
  return results;
}

function CorrelationChips({ valid, signals }) {
  const T = useContext(ThemeContext);
  const corrs = computeSignalCorrelations(valid, signals);
  const significant = corrs.filter(c => Math.abs(c.r) >= 0.4 && c.n >= 8).slice(0, 4);
  if (significant.length === 0) {
    return (
      <div style={{ fontSize: 12, color: T.faint, fontStyle: "italic", marginBottom: 18 }}>
        No strong correlations between signals this month — they're moving independently.
      </div>
    );
  }
  return (
    <div style={{ marginBottom: 22 }}>
      <div style={{ fontSize: 10, color: T.faint, letterSpacing: "0.2em", textTransform: "uppercase", fontWeight: 700, marginBottom: 10 }}>How signals moved together</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        {significant.map((c, i) => {
          const absR = Math.abs(c.r);
          const strength = absR >= 0.7 ? "strong" : absR >= 0.55 ? "moderate" : "modest";
          const isInverse = c.r < 0;
          const accent = isInverse ? T.warm : T.calm;
          const accentInk = isInverse ? T.warmInk : T.calmInk;
          const accentTint = isInverse ? T.warmTint : T.calmTint;
          return (
            <div key={i} style={{
              display: "inline-flex", alignItems: "center", gap: 9,
              padding: "8px 13px", borderRadius: 3,
              backgroundColor: accentTint, borderLeft: `2px solid ${accent}`,
              fontSize: 12, color: accentInk, fontFamily: "'DM Sans', sans-serif",
            }}>
              <span style={{ fontWeight: 600 }}>{c.a.short}</span>
              <span style={{ color: accent, fontSize: 13, lineHeight: 1, fontWeight: 700 }}>{isInverse ? "⇅" : "≈"}</span>
              <span style={{ fontWeight: 600 }}>{c.b.short}</span>
              <span style={{ opacity: 0.78, fontSize: 11, letterSpacing: "0.04em", marginLeft: 2 }}>
                {strength} {isInverse ? "inverse" : "match"}
              </span>
              <span style={{ color: T.faint, fontSize: 11, fontVariantNumeric: "tabular-nums", marginLeft: 2 }}>
                r {c.r > 0 ? "+" : ""}{c.r.toFixed(2)}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RibbonCalendar({ valid, signals, expandedField, onExpand }) {
  const T = useContext(ThemeContext);
  if (valid.length === 0) return null;

  // Per-signal percentile thresholds (computed across this month's valid days)
  const thresholds = signals.map(s => {
    const values = valid.map(d => d[s.field]).filter(v => v !== null && v !== undefined);
    const sorted = [...values].sort((a, b) => a - b);
    let lo = sorted[Math.floor(sorted.length * 0.25)];
    let hi = sorted[Math.floor(sorted.length * 0.75)];
    if (hi - lo < 5) { const m = (lo + hi) / 2; lo = m - 3; hi = m + 3; }
    return { lo, hi };
  });

  const firstDate = new Date(valid[0].date);
  const year = firstDate.getFullYear();
  const month = firstDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;

  const dayMap = {};
  valid.forEach(d => { dayMap[d.date] = d; });

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) {
    const dk = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    cells.push({ day, dateKey: dk, record: dayMap[dk] });
  }
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));

  const dayNumH = 16;
  const bandH = 6;
  const bandGap = 2;
  const cellH = dayNumH + signals.length * (bandH + bandGap) + 4;
  const dowLabels = ["M", "T", "W", "T", "F", "S", "S"];
  const qColors = [T.warm, T.gold, T.calm];

  const qualityFor = (record, i) => {
    if (!record || record.incomplete) return null;
    const v = record[signals[i].field];
    if (v === null || v === undefined) return null;
    const { lo, hi } = thresholds[i];
    if (signals[i].isInverse) return v < lo ? 2 : v > hi ? 0 : 1;
    return v > hi ? 2 : v < lo ? 0 : 1;
  };

  const expandedIdx = expandedField ? signals.findIndex(s => s.field === expandedField) : -1;
  const expandedThresholds = expandedIdx >= 0 ? thresholds[expandedIdx] : null;

  return (
    <div>
      {/* Band legend / toggle */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 18, alignItems: "center" }}>
        <span style={{ fontSize: 10, color: T.faint, letterSpacing: "0.2em", textTransform: "uppercase", fontWeight: 700, marginRight: 6 }}>Bands ↓</span>
        {signals.map((s, i) => {
          const active = expandedField === s.field;
          return (
            <button
              key={s.field}
              onClick={() => onExpand(active ? null : s.field)}
              title={active ? "Collapse" : `Expand ${s.label}`}
              style={{
                display: "inline-flex", alignItems: "center", gap: 7,
                padding: "5px 11px 5px 7px", fontSize: 11, fontWeight: 500,
                fontFamily: "'DM Sans', sans-serif",
                border: `1px solid ${active ? T.ink : T.hair}`,
                backgroundColor: active ? T.ink : "transparent",
                color: active ? T.paper : T.ink,
                borderRadius: 999, cursor: "pointer",
                transition: "all .12s ease", letterSpacing: "0.02em",
              }}>
              <span style={{
                fontFamily: "'Newsreader', serif", fontSize: 13,
                color: active ? T.paper : T.faint,
                fontVariantNumeric: "tabular-nums", lineHeight: 1, minWidth: 8, textAlign: "center",
              }}>{i + 1}</span>
              <span>{s.short}</span>
            </button>
          );
        })}
      </div>

      {/* Quality legend */}
      <div style={{ display: "flex", gap: 14, marginBottom: 14, fontSize: 11, color: T.faint, alignItems: "center" }}>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 14, height: 4, borderRadius: 1, backgroundColor: T.calm }} /> better this month</span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 14, height: 4, borderRadius: 1, backgroundColor: T.gold }} /> mid-range</span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 14, height: 4, borderRadius: 1, backgroundColor: T.warm }} /> lower this month</span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 14, height: 4, borderRadius: 1, backgroundColor: "#b0b0b0" }} /> no data</span>
        <span style={{ marginLeft: "auto", letterSpacing: "0.1em" }}>{valid.length} days · ranked within month</span>
      </div>

      {/* Ribbon calendar */}
      <div style={{ maxWidth: 520 }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 4, marginBottom: 6 }}>
          {dowLabels.map((l, i) => (
            <div key={i} style={{ fontSize: 9.5, color: T.faint, textAlign: "center", letterSpacing: "0.18em", fontWeight: 700 }}>{l}</div>
          ))}
        </div>
        {weeks.map((week, wi) => (

function GridHeatmap({ signals, field, label, isInverse }) {
  const T = useContext(ThemeContext);
  const valid = signals.filter(d => !d.incomplete);
  if (valid.length === 0) return null;
  const values = valid.map(d => d[field]);
  const nonNullValues = values.filter(v => v !== null && v !== undefined);
  const sorted = [...nonNullValues].sort((a, b) => a - b);
  let lo = sorted[Math.floor(sorted.length * 0.25)];
  let hi = sorted[Math.floor(sorted.length * 0.75)];
  if (hi - lo < 5) {
    const mid = (lo + hi) / 2;
    lo = mid - 3;
    hi = mid + 3;
  }

  // Build a calendar-aligned grid for the month
  const lookup = {};
  valid.forEach((d, i) => { lookup[d.date] = values[i]; });

  const firstDate = new Date(valid[0].date);
  const year = firstDate.getFullYear();
  const month = firstDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Mon=0

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) {
    const dk = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    if (lookup[dk] !== undefined) {
      const v = lookup[dk];
      if (v === null || v === undefined) {
        cells.push({ noData: true, day });
      } else {
        let quality;
        if (isInverse) quality = v < lo ? 2 : v > hi ? 0 : 1;
        else quality = v > hi ? 2 : v < lo ? 0 : 1;
        cells.push({ quality, value: v, date: dk, day });
      }
    } else {
      cells.push({ empty: true, day });
    }
  }

  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) {
    weeks.push(cells.slice(i, i + 7));
  }
  const colors = [T.warm, T.gold, T.calm];
  const dowLabels = ["M", "T", "W", "T", "F", "S", "S"];
  const cellSize = 26;

  return (
    <div style={{ marginBottom: 22 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10, gap: 12 }}>
        <div style={{ fontSize: 12, color: T.ink, fontFamily: "'DM Sans', sans-serif", letterSpacing: "0.04em", fontWeight: 500 }}>{label}</div>
        <div style={{ fontSize: 10, color: T.faint, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 600 }}>p25 {Math.round(lo)} · p75 {Math.round(hi)}</div>
      </div>
      <div>
        <div style={{ display: "grid", gridTemplateColumns: `repeat(7, ${cellSize}px)`, gap: 3, marginBottom: 4 }}>
          {dowLabels.map((l, i) => (
            <div key={i} style={{ fontSize: 9, color: T.faint, textAlign: "center", letterSpacing: "0.1em", fontWeight: 600 }}>{l}</div>
          ))}
        </div>
        {weeks.map((week, wi) => (
          <div key={wi} style={{ display: "grid", gridTemplateColumns: `repeat(7, ${cellSize}px)`, gap: 3, marginBottom: 3 }}>
            {Array.from({ length: 7 }, (_, di) => {
              const cell = week[di];
              if (!cell) return <div key={di} style={{ width: cellSize, height: 22, borderRadius: 2 }} />;
              if (cell.empty) return <div key={di} style={{ width: cellSize, height: 22, borderRadius: 2, backgroundColor: T.paperAlt, border: `1px dashed ${T.hair}`, boxSizing: "border-box" }} />;
              if (cell.noData) return <div key={di} title={`${cell.day}: no data`} style={{ width: cellSize, height: 22, borderRadius: 2, backgroundColor: "#b0b0b0", display: "flex", alignItems: "center", justifyContent: "center", color: "rgba(255,255,255,0.7)", fontSize: 9, fontWeight: 600, letterSpacing: "0.02em", fontFamily: "'DM Sans', sans-serif" }}>{cell.day}</div>;
              return (
                <div key={di} title={`${cell.day}: ${cell.value}`}
                  style={{ width: cellSize, height: 22, borderRadius: 2, backgroundColor: colors[cell.quality], display: "flex", alignItems: "center", justifyContent: "center", color: "rgba(255,255,255,0.92)", fontSize: 9, fontWeight: 600, letterSpacing: "0.02em", fontFamily: "'DM Sans', sans-serif" }}>
                  {cell.day}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function SparkLine({ data, baseline }) {
  const T = useContext(ThemeContext);
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = 160 * 2;
    canvas.style.height = "160px";
    ctx.scale(2, 2);
    const w = W / 2, h = H / 2;
    const values = data.map(d => d.hr);
    const min = Math.min(...values, baseline) - 3;
    const max = Math.max(...values, baseline) + 3;
    const range = max - min || 1;
    ctx.clearRect(0, 0, w, h);

    // Subtle grid — quarter lines
    ctx.strokeStyle = T.hair;
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const gy = 20 + (i / 4) * (h - 40);
      ctx.beginPath();
      ctx.moveTo(36, gy);
      ctx.lineTo(w - 10, gy);
      ctx.stroke();
    }

    // Baseline dashed
    const by = h - 20 - ((baseline - min) / range) * (h - 40);
    ctx.strokeStyle = T.rule;
    ctx.setLineDash([3, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(36, by);
    ctx.lineTo(w - 10, by);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = T.faint;
    ctx.font = "10px 'DM Sans', sans-serif";
    ctx.fillText(`${baseline}`, 4, by + 3);

    // Area fill under line
    const points = values.map((v, i) => ({
      x: 36 + (i / Math.max(1, values.length - 1)) * (w - 46),
      y: h - 20 - ((v - min) / range) * (h - 40),
    }));
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, T.calm + "40");
    grad.addColorStop(1, T.calm + "08");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(points[0].x, h - 20);
    points.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(points[points.length - 1].x, h - 20);
    ctx.closePath();
    ctx.fill();

    // Line
    ctx.strokeStyle = T.calm;
    ctx.lineWidth = 1.75;
    ctx.lineJoin = "round";
    ctx.beginPath();
    points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();

    // Dots
    for (let i = 0; i < values.length; i++) {
      const p = points[i];
      const elevated = values[i] > baseline + 2;
      ctx.fillStyle = elevated ? T.warm : T.calm;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = T.card;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1, 0, Math.PI * 2);
      ctx.fill();
    }
  }, [data, baseline, T]);
  return <canvas ref={canvasRef} style={{ width: "100%", height: 160, display: "block" }} />;
}

function buildHourlySeries(readings) {
  const buckets = {};
  for (const r of readings || []) {
    const key = `${String(r.hour).padStart(2, "0")}:00`;
    if (!buckets[key]) buckets[key] = [];
    buckets[key].push(r.bpm);
  }
  return Object.entries(buckets)
    .map(([hour, values]) => ({ hour, bpm: Math.round(meanArr(values)) }))
    .sort((a, b) => a.hour.localeCompare(b.hour));
}
