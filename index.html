  const [themeName, setThemeName] = useState(() => readStorage(STORAGE_KEYS.theme, "cream"));
  const [accentWarm, setAccentWarm] = useState(() => readStorage(STORAGE_KEYS.accentWarm, THEMES.cream.warm));
  const [selectedDay, setSelectedDay] = useState(null);
  const [expandedSignal, setExpandedSignal] = useState(null);

  const MONTH_SIGNAL_METRICS = [
    { field: "recoveryQuality",   label: "Recovery Quality",        short: "Recovery",   isInverse: false },
    { field: "stressSignature",   label: "Stress Signature",        short: "Stress",     isInverse: true  },
    { field: "recoveryDebt",      label: "Recovery Debt",           short: "Debt",       isInverse: true  },
    { field: "cardioEfficiency",  label: "Daytime Quiescence", short: "Quiet", isInverse: false },
    { field: "autonomicLoad",     label: "Autonomic Load",          short: "Load",       isInverse: true  },
    { field: "pulseStability",    label: "Pulse Stability",         short: "Pulse",      isInverse: false },
  ];

  const activeTheme = { ...(THEMES[themeName] || THEMES.cream), warm: accentWarm || (THEMES[themeName] || THEMES.cream).warm };
  const S = getStyles(activeTheme);

  useEffect(() => { document.body.style.background = activeTheme.appBg; }, [activeTheme]);
  useEffect(() => { writeStorage(STORAGE_KEYS.theme, themeName); }, [themeName]);
  useEffect(() => { writeStorage(STORAGE_KEYS.accentWarm, accentWarm); }, [accentWarm]);
  useEffect(() => { writeStorage(STORAGE_KEYS.view, currentView); }, [currentView]);
  useEffect(() => { writeStorage(STORAGE_KEYS.month, selectedMonth); }, [selectedMonth]);
  useEffect(() => { writeStorage(STORAGE_KEYS.age, age); }, [age]);
  useEffect(() => { if (result) writeStorage(STORAGE_KEYS.analysis, JSON.stringify(result)); }, [result]);
  useEffect(() => { writeStorage(STORAGE_KEYS.fileName, fileName); }, [fileName]);
  useEffect(() => {
    if (result && !selectedMonth && result.monthKeys && result.monthKeys.length > 0) {
      setSelectedMonth(result.monthKeys[result.monthKeys.length - 1]);
    }
  }, [result, selectedMonth]);
  useEffect(() => {
    if (!result && currentView !== "import") setCurrentView("import");
  }, [result, currentView]);

  const doPreview = useCallback((text, name = "") => {
    setImportError("");
    setRawInput(text);
    setPendingText(text);
    setFileName(name);
    setImportPreview(previewZeppData(text));
  }, []);

  const resetAnalysis = useCallback(() => {
    setResult(null);
    setSelectedMonth(null);
    setCurrentView("import");
    setImportPreview(null);
    setPendingText("");
    setRawInput("");
    setFileName("");
    setPersistWarning("");
    removeStorageKeys([STORAGE_KEYS.analysis, STORAGE_KEYS.raw, STORAGE_KEYS.month, STORAGE_KEYS.view, STORAGE_KEYS.fileName]);
  }, []);

  const runAnalysis = useCallback((text) => {
    try {
      const raw = parseZeppData(text);
      if (raw.length < 100) {
        alert(`Parsed ${raw.length} valid readings from ${text.length} bytes. Need at least 100.\n\nLine 1: ${text.split("\n")[0].substring(0, 80)}\nLine 2: ${(text.split("\n")[1]||"").substring(0, 80)}\n\nExpected: DD/MM/YYYY, HH:MM, BPM (comma or tab separated).`);
        setLoading(false);
        return;
      }
      const cleaned = cleanData(raw);
      const days = groupByDate(cleaned);
      const baseline = computeBaseline(days);
      const dataQuality = computeDataQuality(days);

      const allBpms = cleaned.map(r => r.bpm).sort((a, b) => a - b);
      const p99 = allBpms[Math.floor(allBpms.length * 0.99)] || 175;
      const ageNum = parseInt(age, 10);
      const maxHR = (!isNaN(ageNum) && ageNum > 10 && ageNum < 110)
        ? Math.round(208 - 0.7 * ageNum)
        : p99;

      const { dailySignals, userThresholds } = computeDailySignals(days, baseline, maxHR);
      const patterns = findPatterns(dailySignals, baseline);
      const recovery = detectWorkoutRecovery(dailySignals, baseline);

      const months = {};
      for (const d of dailySignals) {
        const mk = getMonthKey(d.date);
        if (!months[mk]) months[mk] = [];
        months[mk].push(d);
      }
      const monthKeys = Object.keys(months).sort();
      const monthReports = {};
      for (const mk of monthKeys) {
        const summary = summarizeRange(months[mk], baseline);
        monthReports[mk] = { avgRecovery: summary.avgRecovery, avgStress: summary.avgStress, avgLoad: summary.avgLoad, avgEfficiency: summary.avgEfficiency };
      }
      for (const mk of monthKeys) {
        monthReports[mk] = generateMonthCoachNotes(months[mk], baseline, dailySignals, monthReports, mk);
      }

      const exportText = generateExportSummary(baseline, dailySignals, patterns, recovery, dataQuality);
      const analysis = { baseline, dataQuality, dailySignals, userThresholds, patterns, recovery, months, monthKeys, monthReports, exportText, maxHR, rawReadingsByDate: days };

      setResult(analysis);
      if (text.length <= RAW_PERSIST_LIMIT) {
        writeStorage(STORAGE_KEYS.raw, text);
        setPersistWarning("");
      } else {
        writeStorage(STORAGE_KEYS.raw, "");
        setPersistWarning("Dataset is larger than 5 MB, so the raw file was not saved for refresh recovery. The analysis summary was saved.");
      }
      setSelectedMonth(monthKeys[monthKeys.length - 1] || null);
      setCurrentView("overview");
      setLoading(false);
    } catch(e) {
      console.error("runAnalysis error:", e);
      alert("Analysis error: " + e.message + "\n\nStack: " + e.stack);
      setLoading(false);
    }
  }, [age]);

  const handleFile = useCallback((file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      doPreview(ev.target.result, file.name);
    };
    reader.readAsText(file);
  }, [doPreview]);

  const handleCopySummary = useCallback(() => {
    if (!result) return;
    navigator.clipboard.writeText(result.exportText).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }).catch(() => {});
  }, [result]);


  // ─── IMPORT SCREEN ──────────────────────────────────────────────────────

  if (currentView === "import") {
    return (
      <ThemeContext.Provider value={activeTheme}>
      <div style={S.shell}>
        <div style={S.importWrap}>
          <div style={S.importInner}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
              <div style={{ ...S.eyebrow, marginBottom: 0 }}>Heart Rate Coach</div>
              <ThemeToggle themeName={themeName} setThemeName={setThemeName} />
            </div>
            <h1 style={S.importTitle}>What your heart rate<br />has been telling you</h1>
            <p style={S.importSub}>
              Everything runs in-browser — nothing leaves your device.
            </p>

            {loading && (
              <div style={{ padding: 32, textAlign: "center", color: activeTheme.calm, fontSize: 14, fontWeight: 500, letterSpacing: "0.08em", textTransform: "uppercase" }}>
                Analysing your data…
              </div>
            )}

            {!loading && (
              <>
                {importError && (
                  <div style={{ padding: "12px 14px", borderRadius: 3, backgroundColor: activeTheme.warmTint, borderLeft: `2px solid ${activeTheme.warm}`, color: activeTheme.warmInk, fontSize: 13, lineHeight: 1.55, marginBottom: 16 }}>
                    {importError}
                  </div>
                )}

                {importPreview && (
                  <div style={{ padding: "18px 18px", borderRadius: 3, backgroundColor: activeTheme.calmTint, borderLeft: `2px solid ${activeTheme.calm}`, marginBottom: 20 }}>
                    <div style={{ fontSize: 10, color: activeTheme.calmInk, letterSpacing: "0.2em", textTransform: "uppercase", fontWeight: 700, marginBottom: 10 }}>Import summary</div>
                    <div style={{ fontSize: 13, color: activeTheme.calmInk, lineHeight: 1.7 }}>
                      <div>{importPreview.parsed.toLocaleString("en-GB")} readings parsed · {importPreview.skipped.toLocaleString("en-GB")} skipped</div>
                      {importPreview.start && importPreview.end && (
                        <div>{importPreview.start.toLocaleDateString("en-CA")} → {importPreview.end.toLocaleDateString("en-CA")}</div>
                      )}
                      <div>Delimiter: {getSepLabel(importPreview.sep)}{importPreview.dateFormat ? ` · Date: ${importPreview.dateFormat}` : ""}{importPreview.medianInterval ? ` · Median interval: ${importPreview.medianInterval} min` : ""}</div>
                      <div>Average night coverage: {importPreview.avgNightCoverage}%</div>
                    </div>
                    <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
                      <button style={{ ...S.btnPrimary, padding: "10px 18px" }} onClick={() => { setImportError(""); setLoading(true); setTimeout(() => runAnalysis(pendingText || rawInput), 50); }}>Run analysis</button>
                      <button style={S.btnGhost} onClick={() => { setImportPreview(null); setPendingText(""); }}>Clear</button>
                    </div>
                    <div style={{ marginTop: 12, fontSize: 11.5, color: activeTheme.calmInk, opacity: 0.78, fontStyle: "italic" }}>Nothing is uploaded. Analysis runs only on this device.</div>
                  </div>
                )}
                <label
                  onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
                  onDragLeave={() => setDragActive(false)}
                  onDrop={(e) => {
                    e.preventDefault();
                    setDragActive(false);
                    handleFile(e.dataTransfer.files[0]);
                  }}
                  style={{
                    display: "block",
                    border: `1px ${dragActive ? "solid" : "dashed"} ${dragActive ? activeTheme.ink : activeTheme.rule}`,
                    borderRadius: 3,
                    padding: "32px 20px",
                    textAlign: "center",
                    cursor: "pointer",
                    backgroundColor: dragActive ? activeTheme.paperAlt : activeTheme.card,
                    marginBottom: 12,
                    transition: "all .15s ease",
                  }}
                >
                  <input
                    type="file"
                    accept=".txt,.csv,.tsv,text/plain,text/csv,text/tab-separated-values"
                    onChange={(e) => handleFile(e.target.files[0])}
                    style={{ display: "none" }}
                  />
                  <div style={{ fontSize: 32, marginBottom: 10, fontFamily: "'Newsreader', serif", color: activeTheme.faint, lineHeight: 1 }}>↧</div>
                  <div style={{ fontSize: 15, fontWeight: 500, color: activeTheme.ink, marginBottom: 6 }}>{fileName ? "Replace file" : "Drop your export, or click to browse"}</div>
                  <div style={{ fontSize: 12, color: activeTheme.faint, letterSpacing: "0.04em" }}>{fileName ? `Loaded · ${fileName}` : ".txt, .csv, or .tsv"}</div>
                </label>

                {/* Fallback: Paste */}
                <details style={{ marginBottom: 16 }}>
                  <summary style={{ fontSize: 12, color: activeTheme.soft, cursor: "pointer", marginBottom: 8, letterSpacing: "0.04em" }}>Or paste data manually</summary>
                  <textarea
                    value={rawInput}
                    onChange={(e) => setRawInput(e.target.value)}
                    placeholder="Paste tab-separated data here…"
                    style={{ ...S.textarea, minHeight: 120, marginTop: 8 }}
                    spellCheck={false}
                  />
                  {rawInput.length > 0 && (
                    <button style={{ ...S.btnPrimary, marginTop: 10, width: "100%" }} onClick={() => doPreview(rawInput, fileName)}>
                      Analyse ({(rawInput.length / 1024).toFixed(0)} KB)
                    </button>
                  )}
                </details>

                <div style={S.fmtNote}>Expected format: <code style={S.code}>DD/MM/YYYY	HH:MM	BPM</code> — one reading per line.</div>
                {persistWarning && <div style={{ marginTop: 10, fontSize: 12, color: activeTheme.warm }}>{persistWarning}</div>}

                <div style={{ marginTop: 24, paddingTop: 20, borderTop: `1px solid ${activeTheme.hair}`, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                  <label style={{ fontSize: 13, color: activeTheme.soft, flexShrink: 0 }}>Your age <span style={{ color: activeTheme.faint }}>(for activity zones)</span></label>
                  <input
                    type="number" min="10" max="100" value={age}
                    onChange={e => setAge(e.target.value)}
                    placeholder="e.g. 35"
                    style={{ width: 80, padding: "7px 10px", fontSize: 14, border: `1px solid ${activeTheme.rule}`, borderRadius: 3, backgroundColor: activeTheme.card, color: activeTheme.ink, fontFamily: "'DM Sans', sans-serif", outline: "none" }}
                  />
                  {age && !isNaN(parseInt(age)) && (
                    <span style={{ fontSize: 12, color: activeTheme.faint }}>
                      Max HR: ~{Math.round(208 - 0.7 * parseInt(age))} bpm (Tanaka)
                    </span>
                  )}
                </div>
                <div style={{ marginTop: 18, fontSize: 12, color: activeTheme.faint, lineHeight: 1.5 }}>
                  Heart Rate Coach is for personal wellness trend tracking only — not a medical device.
                  Your data stays in your browser and is never uploaded.
                </div>
              </>
            )}
          </div>
        </div>
      </div>
      </ThemeContext.Provider>
    );
  }

  if (!result) return null;
  const { baseline, dailySignals, userThresholds, patterns, recovery, monthKeys, monthReports, months, dataQuality, maxHR, rawReadingsByDate = {} } = result;
  const validDays = dailySignals.filter(d => !d.incomplete);
  const dateRange = `${fmtDate(dailySignals[0].date)} – ${fmtDate(dailySignals[dailySignals.length - 1].date)}`;
  const lastValid = validDays[validDays.length - 1];

  // ─── OVERVIEW SCREEN ────────────────────────────────────────────────────

  if (currentView === "overview") {
    const overallSummary = summarizeRange(validDays, baseline);
    const overallRecovery = overallSummary.avgRecovery;
    const overallStress = overallSummary.avgStress;
    const overallRecommendations = generateRangeRecommendations(validDays, baseline);
    const overallPrimary = pickPrimaryRecommendation(overallRecommendations);

    return (
      <ThemeContext.Provider value={activeTheme}>
      <div style={S.shell}>
        <div style={S.report}>
          <div style={S.header}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
              <div>
                <div style={S.eyebrow}>Heart Rate Coach</div>
                <h1 style={S.title}>Your health profile</h1>
                <div style={S.meta}>{dataQuality.totalDays} days · {dateRange} · {dataQuality.validDays} with good coverage</div>
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                <ThemeToggle themeName={themeName} setThemeName={setThemeName} />
                <button style={S.btnGhost} onClick={handleCopySummary}>{copied ? "✓ Copied" : "Copy summary"}</button>
                <button style={S.btnGhost} onClick={resetAnalysis}>← New data</button>
              </div>
            </div>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Data quality</div>
            <p style={S.cardSub}>
              Average daily coverage: {dataQuality.avgCoverage}%.
              {dataQuality.incompleteDays > 0
                ? ` ${dataQuality.incompleteDays} day${dataQuality.incompleteDays > 1 ? "s" : ""} had less than 80% coverage and ${dataQuality.incompleteDays > 1 ? "are" : "is"} excluded from signal analysis.`
                : " All days had sufficient coverage for analysis."
              }
            </p>
            <p style={{ ...S.cardSub, marginTop: 6 }}>
              {userThresholds
                ? `Signal thresholds personalised to your history (${userThresholds.daysUsed} nights).`
                : `Signal thresholds using population defaults — ${Math.max(0, CALIB_MIN_DAYS - (dataQuality.validDays || 0))} more qualifying nights needed for personalised thresholds.`
              }
            </p>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Your personal baseline</div>
            <div style={S.baseGrid}>
              <div style={S.baseStat}>
                <div style={S.bigNum}>{baseline.restingHR}</div>
                <div style={S.statLabel}>Initial resting HR</div>
              </div>
              {lastValid && lastValid.dynamicBaseline !== undefined && (
                <div style={S.baseStat}>
                  <div style={{ ...S.bigNum, color: lastValid.dynamicBaseline < baseline.restingHR ? activeTheme.calm : lastValid.dynamicBaseline > baseline.restingHR + 2 ? activeTheme.warm : activeTheme.ink }}>
                    {lastValid.dynamicBaseline}
                  </div>
                  <div style={S.statLabel}>Current (adaptive)</div>
                </div>
              )}
              <div style={S.baseStat}>
                <div style={S.bigNum}>±{baseline.std}</div>
                <div style={S.statLabel}>Overnight variability</div>
              </div>
              <div style={S.baseStat}>
                <div style={S.bigNum}>{maxHR}</div>
                <div style={S.statLabel}>Max HR {age ? "(Tanaka)" : "(observed)"}</div>
              </div>
              {recovery && (
                <div style={S.baseStat}>
                  <div style={S.bigNum}>{recovery.avg.toFixed(1)}</div>
                  <div style={S.statLabel}>Days to recover (avg)</div>
                </div>
              )}
            </div>
            <p style={S.baseNote}>Initial baseline from first 2 weeks. Adaptive baseline uses 21-day EWMA so fitness changes are tracked over time.</p>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Signal overview · full period</div>
            <p style={S.cardSub}>Weeks as columns, days as rows. Thresholds from your own data (25th / 75th percentile).</p>
            <div style={{ display: "flex", gap: 14, marginBottom: 14, fontSize: 11, color: activeTheme.faint, alignItems: "center" }}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: activeTheme.calm, display: "inline-block" }} /> good for you</span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: activeTheme.gold, display: "inline-block" }} /> typical</span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: activeTheme.warm, display: "inline-block" }} /> attention</span>
            </div>
            <FullGridHeatmap signals={validDays} field="recoveryQuality" label="Recovery Quality" isInverse={false} />
            <FullGridHeatmap signals={validDays} field="autonomicLoad" label="Autonomic Load" isInverse={true} />
            <FullGridHeatmap signals={validDays} field="pulseStability" label="Pulse Stability (overnight rhythm)" isInverse={false} />
            <div style={{ fontSize: 12, color: activeTheme.faint, marginTop: -4, marginBottom: 10 }}>
              Based on HR reading variation, not inter-beat HRV. Use as a trend indicator only.
            </div>
            <FullGridHeatmap signals={validDays} field="cardioEfficiency" label="Daytime Quiescence" isInverse={false} />
            <FullGridHeatmap signals={validDays} field="stressSignature" label="Stress Signature" isInverse={true} />
            <FullGridHeatmap signals={validDays} field="recoveryDebt" label="Recovery Debt" isInverse={true} />
            {validDays.some(d => d.acwr !== null) && (
              <FullGridHeatmap signals={validDays.map(d => ({ ...d, acwrDisplay: d.acwr !== null ? Math.round(d.acwr * 100) : null }))} field="acwrDisplay" label="Workload Ratio (ACWR ×100, sweet spot 80–130)" isInverse={false} />
            )}
          </div>

          {patterns.length > 0 && (
            <div style={S.card}>
              <div style={S.cardLabel}>What the data tells me</div>
              <p style={S.cardSub}>Patterns found across your full recording period.</p>
              {patterns.map((p, i) => (
                <div key={i} style={{ ...S.insight, borderLeftColor: p.severity === "positive" ? activeTheme.calm : p.severity === "warning" ? activeTheme.warm : activeTheme.rule }}>
                  <div style={S.insightTitle}>{p.title}</div>
                  <div style={S.insightBody}>{p.detail}</div>
                  {p.guidance && <div style={{ fontSize: 13.5, color: activeTheme.calmInk, lineHeight: 1.7, marginTop: 12, padding: "12px 14px", backgroundColor: activeTheme.calmTint, borderLeft: `2px solid ${activeTheme.calm}`, borderRadius: 2, fontStyle: "italic" }}>{p.guidance}</div>}
                </div>
              ))}
            </div>
          )}

          <div style={S.card}>
            <div style={S.cardLabel}>Month-by-month review</div>
            <p style={S.cardSub}>Tap a month for detailed coach notes.</p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
              {monthKeys.map(mk => {
                const r = monthReports[mk];
                const health = (r.avgRecovery || 50) - (r.avgStress || 50) * 0.4;
                const dot = health > 30 ? activeTheme.calm : health > 10 ? activeTheme.gold : activeTheme.warm;
                return (
                  <button key={mk} onClick={() => { setSelectedMonth(mk); setCurrentView("month"); }}
                    style={{ ...S.monthBtn, display: "inline-flex", alignItems: "center", gap: 8 }}>
                    <span style={{ width: 7, height: 7, borderRadius: "50%", backgroundColor: dot, flexShrink: 0 }} />
                    {fmtMonth(mk)}
                  </button>
                );
              })}
            </div>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Coach's overall impression</div>
            <p style={S.coachText}>
              {(() => {
                const avgDebt = meanArr(validDays.map(d => d.recoveryDebt));
                const avgLoad = meanArr(validDays.map(d => d.autonomicLoad));
                const avgEff = meanArr(validDays.map(d => d.cardioEfficiency));
                const workouts = validDays.filter(d => d.activityLevel === "workout").length;
                const moderates = validDays.filter(d => d.activityLevel === "moderate").length;
                const lights = validDays.filter(d => d.activityLevel === "light").length;
                const totalActiveDays = workouts + moderates + lights;
                const restRatio = (validDays.length - totalActiveDays) / validDays.length;
                const parts = [];

                // Recovery assessment
                if (overallRecovery > 60) parts.push("Your overnight recovery has been solid — your body resets well most nights.");
                else if (overallRecovery > 45) parts.push("Recovery is adequate but not exceptional. You're getting by, but there's room to improve how well your body resets overnight.");
                else parts.push("Recovery has been under sustained pressure. Your overnight HR isn't dropping as low as your body is capable of, which limits everything else.");

                // Stress assessment
                if (overallStress > 55) parts.push(`Your stress signature has been elevated (avg ${Math.round(overallStress)}), meaning your evenings aren't calming down enough. This is often the easiest signal to improve — even small wind-down routine changes can shift it within days.`);
                else if (overallStress < 35) parts.push("Your stress markers are consistently low, which is a strong foundation.");

                // Activity picture
                if (totalActiveDays > 0) {
                  const actParts = [];
                  if (workouts > 0) actParts.push(`${workouts} workout${workouts > 1 ? 's' : ''}`);
                  if (moderates > 0) actParts.push(`${moderates} moderate`);
                  if (lights > 0) actParts.push(`${lights} light`);
                  parts.push(`Across the period: ${actParts.join(', ')} active day${totalActiveDays > 1 ? 's' : ''} detected, with ${Math.round(restRatio * 100)}% of days at rest.`);
                }

                // Efficiency
                if (avgEff < 40) parts.push(`Daytime quiescence is on the low side (${Math.round(avgEff)}%). Your heart is working harder than it needs to during the day — hydration, caffeine timing, and regular low-intensity movement are the first things to check.`);

                // Top recommendation
                const overallFallback = buildFallbackPriority(overallRecovery, overallStress, avgDebt, avgEff, overallSummary.dataQuality?.copyMode || "direct");
                if (overallPrimary && overallPrimary.confidence !== "low") {
                  parts.push(`Top priority: ${overallPrimary.why}`);
                } else if (overallFallback) {
                  parts.push(`Top priority: ${overallFallback.text}`);
                } else {
                  parts.push("Your data looks healthy. The main opportunity is consistency — protect the habits that are working and look for small optimisations rather than big changes.");
                }

                return parts.join(" ");
              })()}
            </p>
          </div>
        </div>
      </div>
      </ThemeContext.Provider>
    );
  }

  // ─── MONTH DETAIL SCREEN ────────────────────────────────────────────────

  if (currentView === "month" && selectedMonth) {
    const monthData = months[selectedMonth] || [];
    const report = monthReports[selectedMonth];
    const valid = monthData.filter(d => !d.incomplete);
    const nightTrend = valid.filter(d => d.nightMeanHR !== null).map(d => ({ date: d.date, hr: d.nightMeanHR }));
    const lowConfidenceDays = valid.filter(d => d.confidence === "low").length;
    const selectedDayRecord = selectedDay ? valid.find(d => d.date === selectedDay) : null;

    return (
      <ThemeContext.Provider value={activeTheme}>
      <div style={S.shell}>
        <div style={S.report}>
          <div style={S.header}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 4 }}>
              <button style={S.btnGhost} onClick={() => setCurrentView("overview")}>← Overview</button>
              <ThemeToggle themeName={themeName} setThemeName={setThemeName} />
            </div>
            <h1 style={S.title}>{fmtMonth(selectedMonth)}</h1>
            <div style={S.meta}>{valid.length} days of data · Data quality: {report.dataQualitySummary?.label || "n/a"} ({report.dataQualitySummary?.sufficientNightPct ?? 0}% sufficient nights)</div>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Monthly resting HR</div>
            <p style={S.coachText}>{report.summary}</p>
            {report.monthComparison && (
              <p style={{ fontSize: 13, color: report.monthComparison.improving ? activeTheme.calm : activeTheme.warm, marginTop: 8, fontStyle: "italic" }}>
                vs {report.monthComparison.prevMonth}: {report.monthComparison.changes}
              </p>
            )}
          </div>

          {/* Monthly comparison card */}
          {report.monthComparison && (() => {
            const mc = report.monthComparison;
            const dl = labelMap => ({
              elevated_night_hr: "Elevated overnight HR",
              late_nadir: "Late HR nadir",
              flat_evening: "Flat evening wind-down",
              high_night_volatility: "Chaotic overnight rhythm",
              low_pulse_stability: "Low pulse stability",
              high_wake_spike: "High wake-up spike",
              high_idle_stress: "High idle stress",
              good_nadir: "Optimal nadir timing",
              good_evening_drop: "Strong evening wind-down",
              stable_pulse: "Stable overnight rhythm",
              smooth_wake: "Smooth wake response",
              calm_day: "Calm daytime HR",
            })[labelMap] || labelMap;
            const fmt = (v, inverse) => {
              if (v === null || v === undefined) return null;
              const sign = v > 0 ? "+" : "";
              const good = inverse ? v < 0 : v > 0;
              return { text: `${sign}${Math.round(v)}`, color: Math.abs(v) < 2 ? activeTheme.faint : good ? activeTheme.calm : activeTheme.warm };
            };
            const metrics = [
              { label: "Recovery", val: fmt(mc.recDiff, false) },
              { label: "Stress", val: fmt(mc.stressDiff, true) },
              { label: "Debt", val: fmt(mc.debtDiff, true) },
              { label: "TRIMP", val: mc.loadDiff !== null ? fmt(mc.loadDiff, false) : null },
            ].filter(m => m.val !== null);
            return (
              <div style={S.card}>
                <div style={S.cardLabel}>vs {mc.prevMonth}</div>
                <div style={{ display: "grid", gridTemplateColumns: `repeat(${metrics.length}, 1fr)`, gap: 12, marginBottom: mc.driverDeltas.length > 0 ? 16 : 0 }}>
                  {metrics.map((m, i) => (
                    <div key={i} style={{ textAlign: "center" }}>
                      <div style={{ fontFamily: "'Newsreader', serif", fontSize: 24, color: m.val.color, lineHeight: 1 }}>{m.val.text}</div>
                      <div style={{ fontSize: 11, color: activeTheme.faint, marginTop: 6, textTransform: "uppercase", letterSpacing: "0.16em", fontWeight: 600 }}>{m.label}</div>
                    </div>
                  ))}
                </div>
                {mc.driverDeltas.length > 0 && (
                  <div style={{ borderTop: "1px solid #f0ece4", paddingTop: 12 }}>
                    {mc.driverDeltas.map((d, i) => (
                      <div key={i} style={{ fontSize: 13, color: activeTheme.ink, display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: i < mc.driverDeltas.length - 1 ? `1px solid ${activeTheme.hair}` : "none" }}>
                        <span>{dl(d.k)}</span>
                        <span style={{ fontWeight: 600, color: d.delta > 0 ? activeTheme.warm : activeTheme.calm }}>{d.delta > 0 ? "↑" : "↓"} {Math.abs(d.delta)} days</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })()}

          {/* Weekly focus card */}
          {report.weeklyFocus && (() => {
            const wf = report.weeklyFocus;
            return (
              <div style={S.card}>
                <div style={S.cardLabel}>Weekly breakdown</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                  <div style={{ padding: "14px 16px", backgroundColor: activeTheme.calmTint, borderRadius: 3, borderLeft: `2px solid ${activeTheme.calm}` }}>
                    <div style={{ fontSize: 10, color: activeTheme.calmInk, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 700, marginBottom: 6 }}>Best week</div>
                    <div style={{ fontSize: 13, color: activeTheme.calmInk, fontWeight: 600, marginBottom: 4 }}>w/c {wf.best.label}</div>
                    <div style={{ fontSize: 12, color: activeTheme.soft }}>Rec {wf.best.avgRec} · Stress {wf.best.avgStr}</div>
                    {wf.best.workouts > 0 && <div style={{ fontSize: 11, color: activeTheme.faint, marginTop: 4 }}>{wf.best.workouts} workout{wf.best.workouts > 1 ? "s" : ""}</div>}
                  </div>
                  <div style={{ padding: "14px 16px", backgroundColor: activeTheme.warmTint, borderRadius: 3, borderLeft: `2px solid ${activeTheme.warm}` }}>
                    <div style={{ fontSize: 10, color: activeTheme.warmInk, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 700, marginBottom: 6 }}>Toughest week</div>
                    <div style={{ fontSize: 13, color: activeTheme.warmInk, fontWeight: 600, marginBottom: 4 }}>w/c {wf.tough.label}</div>
                    <div style={{ fontSize: 12, color: activeTheme.soft }}>Rec {wf.tough.avgRec} · Stress {wf.tough.avgStr}</div>
                    {wf.tough.workouts > 0 && <div style={{ fontSize: 11, color: activeTheme.faint, marginTop: 4 }}>{wf.tough.workouts} workout{wf.tough.workouts > 1 ? "s" : ""}</div>}
                  </div>
                </div>
                {wf.focusRec && (
                  <div style={{ padding: "14px 16px", backgroundColor: activeTheme.goldTint, borderRadius: 3, borderLeft: `2px solid ${activeTheme.gold}` }}>
                    <div style={{ fontSize: 10, color: activeTheme.goldInk, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 700, marginBottom: 8 }}>Consider focusing on next week</div>
                    <div style={{ fontSize: 14.5, color: activeTheme.ink, lineHeight: 1.6 }}>{wf.focusRec}</div>
                    <div style={{ fontSize: 11, color: activeTheme.faint, marginTop: 6, fontStyle: "italic" }}>Based on: {wf.focusReason}</div>
                  </div>
                )}
              </div>
            );
          })()}

          <div style={S.card}>
              <div style={S.cardLabel}>Month themes</div>
              <p style={S.cardSub}>Your month, summarised into key disruptors, wins, and changes.</p>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {report.notes.filter(n => n.icon === "◎" || n.icon === "✦" || n.icon === "⇄" || n.icon === "▦").slice(0, 4).map((n, i) => (
                  <div key={i} style={{ fontSize: 14, color: activeTheme.ink, lineHeight: 1.65, padding: "12px 14px", backgroundColor: activeTheme.paperAlt, borderRadius: 3, borderLeft: `1px solid ${activeTheme.hair}` }}>
                    <span style={{ marginRight: 12, color: activeTheme.gold, fontFamily: "'Newsreader', serif" }}>{n.icon}</span>
                    {n.text}
                  </div>
                ))}
              </div>
            </div>

            {/* Priority recommendation */}
          {report.priority && (
            <div style={{ ...S.card, backgroundColor: activeTheme.calmTint, padding: "28px 24px", borderTop: `2px solid ${activeTheme.calm}`, borderRadius: 3 }}>
              <div style={{ ...S.cardLabel, color: activeTheme.calmInk }}>This month's priority · {report.priority.label}{report.priority.confidence ? ` · ${report.priority.confidence} confidence` : ""}</div>
              <p style={{ ...S.coachText, color: activeTheme.calmInk }}>{report.priority.text}</p>
            </div>
          )}

          {report.primaryRecommendation && (
            <div style={S.card}>
              <div style={S.cardLabel}>Why this is showing up</div>
              {report.primaryRecommendation.evidence.map((item, i) => (
                <div key={i} style={{ fontSize: 13, color: activeTheme.soft, lineHeight: 1.6, marginBottom: 6 }}>{item}</div>
              ))}
            </div>
          )}

          <div style={S.card}>
            <div style={S.cardLabel}>This month's signals</div>
            <p style={S.cardSub}>Each day is one cell, with six bands stacked top to bottom — one per signal. Scan a column to see day-of-week patterns; scan a row to spot days where everything moved together. Click a band tag to blow that signal up below.</p>
            <CorrelationChips valid={valid} signals={MONTH_SIGNAL_METRICS} />
            <RibbonCalendar valid={valid} signals={MONTH_SIGNAL_METRICS} expandedField={expandedSignal} onExpand={setExpandedSignal} />
            <div style={{ fontSize: 12, color: activeTheme.faint, marginTop: 14, lineHeight: 1.5 }}>
              Pulse stability is based on HR reading variation, not inter-beat HRV. Use as a trend indicator only.
            </div>
            {valid.some(d => d.acwr !== null) && (
              <div style={{ marginTop: 22, paddingTop: 18, borderTop: `1px solid ${activeTheme.hair}` }}>
                <GridHeatmap signals={valid.map(d => ({ ...d, acwrDisplay: d.acwr !== null ? Math.round(d.acwr * 100) : null }))} field="acwrDisplay" label="Workload Ratio (ACWR ×100)" isInverse={false} />
              </div>
            )}
          </div>
          {valid.length > 0 && lowConfidenceDays / valid.length > 0.3 && (
            <div style={{ ...S.card, backgroundColor: activeTheme.paper }}>
              <div style={S.cardLabel}>Confidence note</div>
              <p style={S.cardSub}>{lowConfidenceDays} of {valid.length} days this month had low night-data confidence. Treat month-level conclusions as directional.</p>
            </div>
          )}

          {report.notes.length > 0 && (
            <div style={S.card}>
              <div style={S.cardLabel}>Observations</div>
              {report.notes.map((n, i) => (
                <div key={i} style={S.coachNote}>
                  <span style={S.coachIcon}>{n.icon}</span>
                  <span style={S.coachNoteText}>{n.text}</span>
                </div>
              ))}
            </div>
          )}

          {/* Actionable guidance */}
          {report.guidance && report.guidance.length > 0 && (
            <div style={S.card}>
              <div style={S.cardLabel}>What to try</div>
              {report.guidance.map((g, i) => (
                <div key={i} style={{ fontSize: 14.5, color: activeTheme.calmInk, lineHeight: 1.7, padding: "12px 16px", backgroundColor: activeTheme.calmTint, borderRadius: 2, marginBottom: 8, borderLeft: `2px solid ${activeTheme.calm}` }}>
                  {g}
                </div>
              ))}
            </div>
          )}

          {/* Best/worst day callouts */}
          {report.callouts && report.callouts.length > 0 && (
            <div style={S.card}>
              <div style={S.cardLabel}>Day highlights</div>
              {report.callouts.map((c, i) => (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 8 }}>
                  <div style={{ padding: "14px 16px", backgroundColor: activeTheme.calmTint, borderRadius: 3, borderLeft: `2px solid ${activeTheme.calm}` }}>
                    <div style={{ fontSize: 10, color: activeTheme.calmInk, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 700, marginBottom: 6 }}>Best day</div>
                    <div style={{ fontSize: 14, color: activeTheme.calmInk, fontWeight: 600 }}>{c.best.date}</div>
                    <div style={{ fontSize: 12, color: activeTheme.soft, marginTop: 3 }}>Recovery {c.best.recovery} · Stress {c.best.stress}</div>
                  </div>
                  <div style={{ padding: "14px 16px", backgroundColor: activeTheme.warmTint, borderRadius: 3, borderLeft: `2px solid ${activeTheme.warm}` }}>
                    <div style={{ fontSize: 10, color: activeTheme.warmInk, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 700, marginBottom: 6 }}>Hardest day</div>
                    <div style={{ fontSize: 14, color: activeTheme.warmInk, fontWeight: 600 }}>{c.worst.date}</div>
                    <div style={{ fontSize: 12, color: activeTheme.soft, marginTop: 3 }}>Recovery {c.worst.recovery} · Stress {c.worst.stress}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {nightTrend.length > 5 && (
            <div style={S.card}>
              <div style={S.cardLabel}>Overnight HR through the month</div>
              <p style={S.cardSub}>Average HR during {NIGHT_LABEL}. Dashed line = your baseline ({baseline.restingHR} bpm).</p>
              <SparkLine data={nightTrend} baseline={baseline.restingHR} />
            </div>
          )}
          <details style={S.card}>
            <summary style={{ cursor: "pointer", color: activeTheme.soft, fontSize: 13 }}>How scores are calculated</summary>
            <div style={{ marginTop: 12, fontSize: 13, color: activeTheme.soft, lineHeight: 1.6 }}>
              <div>Recovery combines your night HR vs your personal baseline and night HR stability.</div>
              <div>Stress reflects how elevated your night HR is relative to baseline.</div>
              <div>These are experimental trend indicators, not clinical measurements.</div>
            </div>
          </details>

          <div style={S.card}>
            <div style={S.cardLabel}>Daily log</div>
            <div style={S.dayGrid}>
              <div style={S.dayGridH}>
                <span>Date</span><span>HR</span><span>Rec</span><span>Str</span><span>Notes</span>
              </div>
              {valid.map((d, i) => {
                const dayLabel = new Date(d.date).toLocaleDateString("en-GB", { weekday: "short", day: "numeric" });
                const recColor = d.recoveryQuality === null ? "#b0b0b0" : d.recoveryQuality > 60 ? activeTheme.calm : d.recoveryQuality < 40 ? activeTheme.warm : activeTheme.gold;
                const stressColor = d.stressSignature === null ? "#b0b0b0" : d.stressSignature > 60 ? activeTheme.warm : d.stressSignature < 35 ? activeTheme.calm : activeTheme.gold;
                const actLabel = d.activityLevel === "workout" ? "workout" : d.activityLevel === "moderate" ? "moderate" : d.activityLevel === "light" ? "light" : "";
                const actColor = d.activityLevel === "workout" ? "#7a5aaa" : d.activityLevel === "moderate" ? "#5a7aaa" : d.activityLevel === "light" ? "#7a9a8a" : "#a09888";
                return (
                  <div key={i} style={{ ...S.dayRow, cursor: "pointer" }} onClick={() => setSelectedDay(d.date)}>
                    <span style={{ color: activeTheme.ink }}>{dayLabel}</span>
                    <span style={{ color: activeTheme.soft, textAlign: "center", fontVariantNumeric: "tabular-nums" }}>{d.dayMeanHR}</span>
                    <span style={{ fontSize: 14, textAlign: "center", color: recColor }}>●</span>
                    <span style={{ fontSize: 14, textAlign: "center", color: stressColor }}>●</span>
                    <span style={{ fontSize: 12, color: actColor, fontStyle: "italic" }}>
                      {(() => {
        const driverTags = [];
        const drv = d.drivers || [];
        if (drv.includes("late_nadir")) driverTags.push("🌙 late nadir");
        if (drv.includes("elevated_night_hr")) driverTags.push("↑ night HR");
        if (drv.includes("rising_baseline")) driverTags.push("↑↑ baseline");
        if (drv.includes("high_wake_spike")) driverTags.push("⚡ wake spike");
        if (drv.includes("high_idle_stress")) driverTags.push("🔥 idle stress");
        if (drv.includes("flat_evening")) driverTags.push("↔ evening");
        if (drv.includes("high_night_volatility") || drv.includes("low_pulse_stability")) driverTags.push("~ pulse");
        if (drv.includes("incomplete_workout_recovery")) driverTags.push("⏳ slow recovery");
        if (drv.includes("good_recovery_morning")) driverTags.push("✦ full recovery");
        if (drv.includes("good_nadir")) driverTags.push("✦ nadir");
        const base = [actLabel, d.activeMinutes > 0 && actLabel && `${d.activeMinutes}m`, d.trimp > 0 && `TRIMP ${d.trimp}`, d.acwr !== null && (d.acwr > 1.5 ? `⚠ ACWR ${d.acwr}` : d.acwr < 0.8 ? `↓ ACWR ${d.acwr}` : null), d.coverage < 80 && `${d.coverage}%`, d.coverageNight < 50 && `${d.coverageNight}% night`, d.confidence !== "high" && `⚠ ${confidenceLabel(d.confidence)}`, ...driverTags];
        return base.filter(Boolean).join(" · ");
      })()}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 16 }}>
            {monthKeys.map(mk => (
              <button key={mk} onClick={() => setSelectedMonth(mk)}
                style={{ ...S.monthBtn, backgroundColor: mk === selectedMonth ? activeTheme.ink : activeTheme.card, color: mk === selectedMonth ? activeTheme.paper : activeTheme.ink, borderColor: mk === selectedMonth ? activeTheme.ink : activeTheme.rule }}>
                {fmtMonth(mk)}
              </button>
            ))}
          </div>
        </div>
        <DayDetailModal
          day={selectedDayRecord}
          baseline={baseline}
          readings={selectedDayRecord ? rawReadingsByDate[selectedDayRecord.date] || [] : []}
          onClose={() => setSelectedDay(null)}
          theme={activeTheme}
        />
      </div>
      </ThemeContext.Provider>
    );
  }

  return null;
}


// ─── Styles ────────────────────────────────────────────────────────────────

function getStyles(T) {
  return {
    shell: { minHeight: "100vh", backgroundColor: T.paper, fontFamily: "'DM Sans', sans-serif", color: T.ink, lineHeight: 1.55, overflowX: "hidden", fontFeatureSettings: "'ss01'" },

    // ─── Import view ────────────────────────────────────────────────────
    importWrap: { display: "flex", justifyContent: "center", alignItems: "flex-start", minHeight: "100vh", padding: "min(10vh, 80px) 24px 60px", backgroundColor: T.paper },
    importInner: { maxWidth: 580, width: "100%" },

    eyebrow: { fontSize: 10.5, color: T.faint, letterSpacing: "0.24em", textTransform: "uppercase", fontWeight: 600, marginBottom: 22, display: "block" },

    importTitle: { fontFamily: "'Newsreader', serif", fontSize: "clamp(40px, 7vw, 60px)", fontWeight: 400, lineHeight: 0.98, margin: "0 0 22px", color: T.ink, letterSpacing: "-0.015em", textWrap: "balance" },
    importSub: { fontSize: 16, color: T.soft, marginBottom: 40, maxWidth: 460, lineHeight: 1.55 },

    textarea: { width: "100%", minHeight: 180, padding: 16, fontSize: 13, fontFamily: "'JetBrains Mono', 'DM Mono', 'SF Mono', monospace", backgroundColor: T.card, border: `1px solid ${T.hair}`, borderRadius: 3, resize: "vertical", color: T.ink, outline: "none", boxSizing: "border-box", lineHeight: 1.5 },

    btnPrimary: { padding: "13px 26px", fontSize: 12, fontWeight: 600, backgroundColor: T.ink, color: T.paper, border: "none", borderRadius: 3, cursor: "pointer", fontFamily: "'DM Sans', sans-serif", letterSpacing: "0.08em", textTransform: "uppercase" },
    btnGhost: { background: "transparent", border: `1px solid ${T.rule}`, color: T.ink, cursor: "pointer", fontSize: 11, fontWeight: 600, fontFamily: "'DM Sans', sans-serif", padding: "9px 14px", borderRadius: 3, letterSpacing: "0.1em", textTransform: "uppercase" },

    fmtNote: { marginTop: 26, fontSize: 12, color: T.faint, lineHeight: 1.55 },
    code: { backgroundColor: T.paperAlt, padding: "2px 6px", borderRadius: 2, fontSize: 11.5, fontFamily: "'JetBrains Mono', 'DM Mono', 'SF Mono', monospace", color: T.ink },

    // ─── Report layout ──────────────────────────────────────────────────
    report: { maxWidth: 880, margin: "0 auto", padding: "44px 28px 80px" },
    header: { marginBottom: 44, paddingBottom: 28, borderBottom: `1px solid ${T.rule}` },
    title: { fontFamily: "'Newsreader', serif", fontSize: "clamp(40px, 6.5vw, 58px)", fontWeight: 400, lineHeight: 1.0, margin: "10px 0 14px", color: T.ink, letterSpacing: "-0.018em", textWrap: "balance" },
    meta: { fontSize: 12, color: T.soft, letterSpacing: "0.04em", fontFamily: "'DM Sans', sans-serif" },

    // "Card" is now a hairlined section, not a rounded box. Keeps the API.
    card: { backgroundColor: "transparent", borderRadius: 0, padding: "32px 0 0", marginBottom: 36, borderTop: `1px solid ${T.hair}`, border: "none", borderTopWidth: 1, borderTopStyle: "solid", borderTopColor: T.hair },
    cardLabel: { fontSize: 10.5, color: T.ink, letterSpacing: "0.22em", textTransform: "uppercase", fontWeight: 700, marginBottom: 10 },
    cardSub: { fontSize: 14, color: T.soft, marginTop: 0, marginBottom: 20, maxWidth: 640, lineHeight: 1.6 },

    // Hero stats — a grid of inset tiles separated by hairlines, not floating cards
    baseGrid: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 1, marginBottom: 14, backgroundColor: T.hair, border: `1px solid ${T.hair}`, borderRadius: 2 },
    baseStat: { textAlign: "left", padding: "22px 20px 20px", backgroundColor: T.card },
    bigNum: { fontFamily: "'Newsreader', serif", fontSize: 56, fontWeight: 400, color: T.ink, lineHeight: 0.92, letterSpacing: "-0.025em", fontFeatureSettings: "'tnum'" },
    statLabel: { fontSize: 10.5, color: T.faint, marginTop: 12, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 600 },
    baseNote: { fontSize: 12.5, color: T.faint, fontStyle: "italic", marginBottom: 0, marginTop: 14, maxWidth: 620, lineHeight: 1.6 },

    insight: { borderLeft: `2px solid ${T.rule}`, paddingLeft: 18, marginBottom: 26, marginTop: 18 },
    insightTitle: { fontSize: 22, fontWeight: 400, color: T.ink, marginBottom: 8, fontFamily: "'Newsreader', serif", lineHeight: 1.15, letterSpacing: "-0.01em" },
    insightBody: { fontSize: 15, color: T.soft, lineHeight: 1.7 },

    coachText: { fontSize: 17, color: T.ink, lineHeight: 1.7, margin: "8px 0 0", maxWidth: 680, fontFamily: "'Newsreader', serif", fontWeight: 400, letterSpacing: "0.005em" },
    coachNote: { display: "flex", gap: 16, alignItems: "flex-start", marginBottom: 0, marginTop: 0, paddingTop: 12, paddingBottom: 12, borderTop: `1px solid ${T.hair}` },
    coachIcon: { fontSize: 16, color: T.faint, flexShrink: 0, marginTop: 1, width: 18, fontFamily: "'Newsreader', serif" },
    coachNoteText: { fontSize: 14, color: T.soft, lineHeight: 1.65 },

    monthBtn: { padding: "10px 16px", fontSize: 11, fontWeight: 600, borderRadius: 3, cursor: "pointer", border: `1px solid ${T.rule}`, fontFamily: "'DM Sans', sans-serif", backgroundColor: T.card, color: T.ink, transition: "all 0.15s ease", letterSpacing: "0.12em", textTransform: "uppercase" },

    dayGrid: { fontSize: 13, marginTop: 8 },
    dayGridH: { display: "grid", gridTemplateColumns: "minmax(70px,110px) minmax(40px,60px) 32px 32px 1fr", gap: 12, fontWeight: 700, color: T.faint, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.16em", borderBottom: `1px solid ${T.rule}`, paddingBottom: 10, marginBottom: 0 },
    dayRow: { display: "grid", gridTemplateColumns: "minmax(70px,110px) minmax(40px,60px) 32px 32px 1fr", gap: 12, padding: "11px 0", borderBottom: `1px solid ${T.hair}`, alignItems: "center" },
  };
}

ReactDOM.createRoot(document.getElementById("root")).render(<HRCoach />);
</script>
</body>
</html>
