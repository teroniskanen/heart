<script type="text/babel">
const { useState, useCallback, useRef, useEffect, useContext } = React;

const THEMES = {
  cream: { appBg:"#ece4d1", paper:"#f4eedd", card:"#fbf6e9", paperAlt:"#efe8d4", ink:"#1a1610", soft:"#544c3f", faint:"#9b9180", hair:"#dcd2bb", rule:"#beb29a", warm:"#a8482a", calm:"#4f7556", gold:"#a67e2a", warmTint:"#f3e0d4", calmTint:"#e3ecdf", goldTint:"#efe6cf", warmInk:"#7a311a", calmInk:"#36513a", goldInk:"#6e521c" },
  sand:  { appBg:"#e2d5bc", paper:"#f3ebd8", card:"#fbf3df", paperAlt:"#ebe1c8", ink:"#1d1810", soft:"#5a4e3c", faint:"#9a8a72", hair:"#d3c5a8", rule:"#b5a585", warm:"#a85530", calm:"#54704c", gold:"#a17a1f", warmTint:"#f1ddcc", calmTint:"#e1ead7", goldTint:"#ede1c1", warmInk:"#7c3a1d", calmInk:"#3a5132", goldInk:"#6b5012" },
  slate: { appBg:"#13161b", paper:"#1c1f25", card:"#262a31", paperAlt:"#181b21", ink:"#f1ead8", soft:"#b8aea0", faint:"#7d7567", hair:"#343940", rule:"#4a515a", warm:"#d27050", calm:"#92ae87", gold:"#dabe6a", warmTint:"#3a2820", calmTint:"#26342a", goldTint:"#332b1c", warmInk:"#e89b80", calmInk:"#b8d0ad", goldInk:"#e8d088" },
};
const ThemeContext = React.createContext(THEMES.cream);
window.THEMES = THEMES;
window.ThemeContext = ThemeContext;

const NIGHT_START = 1;
const NIGHT_END = 5;
const NIGHT_LABEL = "01:00–05:59";
const MAX_GAP_MIN = 15;
const RAW_PERSIST_LIMIT = 5 * 1024 * 1024;

// Tag thresholds — tunable constants
const NIGHT_HR_ELEVATED_BPM = 5;         // elevated_night_hr: bpm above baseline; overridden by EWMA std when available
const IDLE_STRESS_HRR_FRACTION = 0.30;   // high_idle_stress: fraction of HR reserve for elevation threshold
const FLAT_EVENING_NORM = -0.001;        // flat_evening: normalized slope (bpm/min / bpm-range)
const GOOD_EVENING_DROP_NORM = -0.004;   // good_evening_drop: normalized slope threshold
const SHALLOW_NADIR_BPM = 8;            // shallow_nadir: UNCALIBRATED placeholder — check distribution before enabling tag
const MID_SLEEP_AROUSAL_BPM = 10;       // mid_sleep_arousal: elevation above night mean — check sample density before enabling tag
const COMPRESSED_RANGE_RATIO = 1.15;    // compressed_autonomic_range: day/night HR ratio — check distribution before enabling tag
const RISING_BASELINE_BPM = 5;          // rising_baseline: 7d vs 28d night HR delta
const MIN_NIGHT_COV_FOR_TAGS = 60;      // minimum coverageNight% for night-window tags to fire
const MIN_MORNING_COV_FOR_TAGS = 40;    // minimum coverageMorning% for wake-window tags to fire
const MIN_DAY_COV_FOR_TAGS = 60;        // minimum coverageDay% for daytime tags to fire

// Calibration — absolute physiological floors for two-condition triggers
// A tag requires BOTH: reading beyond its personal percentile AND beyond this floor.
// Prevents firing on physiologically-OK days that happen to be a user's worst.
const CALIB_MIN_DAYS = 21;             // qualifying nights required before personal thresholds activate
const SHALLOW_NADIR_ABS_FLOOR = 5;     // shallow_nadir: nadirDepth must be < 5 bpm (not just a personal low)
const HIGH_WAKE_SPIKE_ABS_FLOOR = 20;  // high_wake_spike: wakeSpike must exceed 20 bpm
const HIGH_IDLE_STRESS_ABS_FLOOR = 20; // high_idle_stress: idleStressMinutes must exceed 20 min
const HIGH_NIGHT_VOL_ABS_FLOOR = 5;    // high_night_volatility: nightVolatilityPercent must exceed 5%
const LOW_PULSE_STAB_ABS_FLOOR = 65;   // low_pulse_stability: pulseStability must be below 65
const STORAGE_KEYS = {
  analysis: "hrc-analysis",
  raw: "hrc-raw",
  month: "hrc-selected-month",
  view: "hrc-current-view",
  theme: "hrc-theme",
  accentWarm: "hrc-accent-warm",
  age: "hrc-age",
  fileName: "hrc-file-name",
};
window.NIGHT_START = NIGHT_START;
window.NIGHT_END = NIGHT_END;

function safeJsonParse(value, fallback = null) {
  if (!value) return fallback;
  try { return JSON.parse(value); } catch { return fallback; }
}

function readStorage(key, fallback = null) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : value;
  } catch {
    return fallback;
  }
}

function writeStorage(key, value) {
  try {
    if (value === null || value === undefined || value === "") localStorage.removeItem(key);
    else localStorage.setItem(key, value);
  } catch {}
}

function removeStorageKeys(keys) {
  try { keys.forEach(key => localStorage.removeItem(key)); } catch {}
}

function getSepLabel(sep) {
  return sep === "\t" ? "tab" : sep === "," ? "comma" : "semicolon";
}

function confidence(nightCoverage) {
  if (nightCoverage >= 70) return "high";
  if (nightCoverage >= 40) return "medium";
  return "low";
}

function confidenceLabel(level) {
  return level === "high" ? "high confidence" : level === "medium" ? "limited night data" : "very limited night data";
}

// ─── Data Processing Engine ─────────────────────────────────────────────────

function parseZeppData(raw) {
  // Strip BOM and normalize line endings
  raw = raw.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.trim().split("\n").filter(l => l.trim());
  if (lines.length < 2) return [];

  // Auto-detect delimiter from first few lines
  let sep = "\t";
  const sample = lines.slice(0, 5).join("\n");
  const tabCount = (sample.match(/\t/g) || []).length;
  const commaCount = (sample.match(/,/g) || []).length;
  const semiCount = (sample.match(/;/g) || []).length;
  if (commaCount > tabCount && commaCount >= semiCount) sep = ",";
  else if (semiCount > tabCount && semiCount > commaCount) sep = ";";

  const readings = [];
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    const parts = line.split(sep).map(s => s.trim()).filter(s => s.length > 0);
    if (parts.length < 3) continue;
    // Skip header row
    if (li === 0 && /[a-zA-Z]/.test(parts[2])) continue;
    const [dateStr, timeStr, bpmStr] = parts;
    const bpm = parseInt(bpmStr, 10);
    if (isNaN(bpm)) continue;
    let d, m, y;
    if (dateStr.includes("-")) {
      // YYYY-MM-DD
      [y, m, d] = dateStr.split("-").map(Number);
    } else {
      // DD/MM/YYYY
      [d, m, y] = dateStr.split("/").map(Number);
    }
    const [h, min] = timeStr.split(":").map(Number);
    if (!d || !m || !y || isNaN(h) || isNaN(min)) continue;
    const dt = new Date(y, m - 1, d, h, min);
    if (isNaN(dt.getTime())) continue;
    readings.push({ dt, hour: h, minute: min, bpm, dateKey: `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`, dayOfWeek: dt.getDay() });
  }
  readings.sort((a, b) => a.dt - b.dt);
  return readings;
}

function detectZeppFormat(raw) {
  raw = raw.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.trim().split("\n").filter(l => l.trim());
  let sep = "\t";
  const sample = lines.slice(0, 5).join("\n");
  const tabCount = (sample.match(/\t/g) || []).length;
  const commaCount = (sample.match(/,/g) || []).length;
  const semiCount = (sample.match(/;/g) || []).length;
  if (commaCount > tabCount && commaCount >= semiCount) sep = ",";
  else if (semiCount > tabCount && semiCount > commaCount) sep = ";";
  return { lines, sep };
}

function previewZeppData(raw) {
  const { lines, sep } = detectZeppFormat(raw);
  if (lines.length < 2) return { ok: false, error: "No data lines found.", sep };
  const firstParts = lines[0].split(sep).map(s => s.trim()).filter(Boolean);
  const hasHeader = firstParts.length >= 3 && /[a-zA-Z]/.test(firstParts[2]);
  const startIdx = hasHeader ? 1 : 0;

  const readings = [];
  for (let li = startIdx; li < lines.length; li++) {
    const line = lines[li];
    const parts = line.split(sep).map(s => s.trim()).filter(s => s.length > 0);
    if (parts.length < 3) continue;
    const [dateStr, timeStr, bpmStr] = parts;
    const bpm = parseInt(bpmStr, 10);
    if (isNaN(bpm)) continue;
    let d, m, y;
    if (dateStr.includes("-")) { [y, m, d] = dateStr.split("-").map(Number); }
    else { [d, m, y] = dateStr.split("/").map(Number); }
    const [h, min] = timeStr.split(":").map(Number);
    if (!d || !m || !y || isNaN(h) || isNaN(min)) continue;
    const dt = new Date(y, m - 1, d, h, min);
    if (isNaN(dt.getTime())) continue;
    readings.push({ dt, hour: h, minute: min, bpm, dateKey: `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}` });
  }
  readings.sort((a, b) => a.dt - b.dt);

  const totalLines = lines.length - (hasHeader ? 1 : 0);
  const skipped = Math.max(0, totalLines - readings.length);
  const dateFormat = readings.length ? (lines[startIdx].split(sep)[0].includes("-") ? "YYYY-MM-DD" : "DD/MM/YYYY") : null;
  const start = readings.length ? readings[0].dt : null;
  const end = readings.length ? readings[readings.length - 1].dt : null;
  const deltas = [];
  for (let i = 1; i < readings.length; i++) {
    const dm = (readings[i].dt - readings[i - 1].dt) / 60000;
    if (dm > 0 && dm <= 60) deltas.push(dm);
  }
  const medianInterval = deltas.length ? Math.round(medianArr(deltas) * 10) / 10 : null;

  const days = groupByDate(readings);
  const coverageSummaries = Object.values(days).map(rs => computeCoverage(rs));
  const avgCoverage = coverageSummaries.length ? Math.round(meanArr(coverageSummaries.map(c => c.coverageTotal))) : 0;
  const minCoverage = coverageSummaries.length ? Math.round(Math.min(...coverageSummaries.map(c => c.coverageTotal))) : 0;
  const maxCoverage = coverageSummaries.length ? Math.round(Math.max(...coverageSummaries.map(c => c.coverageTotal))) : 0;
  const sampledDays = Object.values(groupByDate(readings.slice(0, 500)));
  const sampledCoverage = sampledDays.map(rs => computeCoverage(rs));
  const avgNightCoverage = sampledCoverage.length ? Math.round(meanArr(sampledCoverage.map(c => c.coverageNight))) : 0;

  return {
    ok: readings.length >= 20,
    sep,
    dateFormat,
    hasHeader,
    totalLines,
    parsed: readings.length,
    skipped,
    start,
    end,
    medianInterval,
    totalDays: Object.keys(days).length,
    avgCoverage,
    minCoverage,
    maxCoverage,
    avgNightCoverage,
  };
}

function cleanData(readings) {
  const cleaned = [];
  for (let i = 0; i < readings.length; i++) {
    const r = readings[i];
    if (r.bpm < 30 || r.bpm > 220) continue;
    if (i > 0) {
      const gapMinutes = (r.dt - readings[i - 1].dt) / 60000;
      if (gapMinutes < 5 && Math.abs(r.bpm - readings[i - 1].bpm) > 40) continue;
    }
    cleaned.push(r);
  }
  return cleaned;
}

function groupByDate(readings) {
  const days = {};
  for (const r of readings) {
    if (!days[r.dateKey]) days[r.dateKey] = [];
    days[r.dateKey].push(r);
  }
  return days;
}

function computeDataQuality(days) {
  const dateKeys = Object.keys(days).sort();
  const report = { totalDays: dateKeys.length, validDays: 0, incompleteDays: 0, coverageByDay: {} };
  for (const dk of dateKeys) {
    const count = days[dk].length;
    const coverageStats = computeCoverage(days[dk]);
    report.coverageByDay[dk] = {
      count,
      coveredMinutes: coverageStats.totalMinutes,
      coverage: coverageStats.coverageTotal,
      nightCoverage: coverageStats.coverageNight,
      dayCoverage: coverageStats.coverageDay,
    };
    if (coverageStats.coverageTotal >= 80) report.validDays++;
    else report.incompleteDays++;
  }
  const coverages = Object.values(report.coverageByDay).map(c => c.coverage);
  report.avgCoverage = Math.round(meanArr(coverages));
  report.minCoverage = Math.min(...coverages);
  report.maxCoverage = Math.max(...coverages);
  return report;
}

function computeBaseline(days) {
  const allNightReadings = [];
  const dateKeys = Object.keys(days).sort();
  const firstTwoWeeks = dateKeys.slice(0, 14);
  for (const dk of firstTwoWeeks) {
    const coverageStats = computeCoverage(days[dk]);
    if (coverageStats.coverageNight < 50) continue;
    for (const r of days[dk]) {
      if (r.hour >= NIGHT_START && r.hour <= NIGHT_END) allNightReadings.push(r.bpm);
    }
  }
  if (allNightReadings.length < 10) {
    for (const dk of dateKeys) {
      const coverageStats = computeCoverage(days[dk]);
      if (coverageStats.coverageNight < 50) continue;
      for (const r of days[dk]) {
        if (r.hour >= NIGHT_START && r.hour <= NIGHT_END) allNightReadings.push(r.bpm);
      }
    }
  }
  allNightReadings.sort((a, b) => a - b);
  const p10 = allNightReadings[Math.floor(allNightReadings.length * 0.1)] || 55;
  const p50 = allNightReadings[Math.floor(allNightReadings.length * 0.5)] || 65;
  const m = allNightReadings.reduce((s, v) => s + v, 0) / allNightReadings.length || 65;
  const s = Math.sqrt(allNightReadings.reduce((s, v) => s + (v - m) ** 2, 0) / allNightReadings.length) || 5;
  return { restingHR: Math.round(p50), lowestTypical: Math.round(p10), mean: Math.round(m), std: Math.round(s * 10) / 10 };
}

function stdArr(arr) {
  const a = arr.filter(v => v !== null && v !== undefined);
  if (a.length < 2) return 0;
  const m = a.reduce((s, v) => s + v, 0) / a.length;
  return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length);
}

function meanArr(arr) {
  const nonNull = arr.filter(v => v !== null && v !== undefined);
  return nonNull.length ? nonNull.reduce((s, v) => s + v, 0) / nonNull.length : 0;
}

function weightedMean(arr, weightFn = () => 1) {
  if (!arr || arr.length === 0) return 0;
  let total = 0;
  let totalWeight = 0;
  for (const item of arr) {
    if (item === null || item === undefined) continue;
    const weight = Math.max(0, weightFn(item) || 0);
    if (weight <= 0) continue;
    total += item * weight;
    totalWeight += weight;
  }
  return totalWeight > 0 ? total / totalWeight : 0;
}

function getConfidenceWeight(day) {
  if (!day) return 0;
  if (day.confidence === "high") return 1;
  if (day.confidence === "medium") return 0.65;
  return 0.25;
}

function getCoverageWeight(day) {
  const base = getConfidenceWeight(day);
  const nightCoverage = day?.coverageNight ?? day?.rawMetrics?.coverageNight ?? 0;
  return base * Math.max(0.1, nightCoverage / 100);
}

function summarizeConfidence(days) {
  const valid = (days || []).filter(d => !d.incomplete);
  if (valid.length === 0) {
    return { label: "Insufficient", sufficientNightPct: 0, lowConfidenceDays: 0, weightedCoverageNight: 0 };
  }
  const sufficientNightPct = Math.round((valid.filter(d => (d.coverageNight ?? 0) >= 50).length / valid.length) * 100);
  const weightedCoverageNight = Math.round(weightedMean(valid.map(d => d.coverageNight ?? 0), (_, i) => getCoverageWeight(valid[i])));
  const lowConfidenceDays = valid.filter(d => d.confidence === "low").length;
  const label = sufficientNightPct >= 80 ? "Good" : sufficientNightPct >= 60 ? "Fair" : "Weak";
  const copyMode = sufficientNightPct >= 80 ? "direct" : sufficientNightPct >= 60 ? "qualified" : "directional";
  return { label, sufficientNightPct, lowConfidenceDays, weightedCoverageNight, copyMode };
}

function summarizeRange(days, baseline) {
  const valid = (days || []).filter(d => !d.incomplete);
  if (valid.length === 0) {
    return {
      avgRecovery: 0,
      avgStress: 0,
      avgLoad: 0,
      avgEfficiency: 0,
      avgDebt: 0,
      monthRestingHR: null,
      dataQuality: summarizeConfidence(valid),
    };
  }
  const weightFor = day => getCoverageWeight(day);
  const avgRecovery = weightedMean(valid.map(d => d.recoveryQuality), (_, i) => weightFor(valid[i]));
  const avgStress = weightedMean(valid.map(d => d.stressSignature), (_, i) => weightFor(valid[i]));
  const avgLoad = weightedMean(valid.map(d => d.autonomicLoad), (_, i) => weightFor(valid[i]));
  const avgEfficiency = weightedMean(valid.map(d => d.cardioEfficiency), (_, i) => weightFor(valid[i]));
  const avgDebt = weightedMean(valid.map(d => d.recoveryDebt), (_, i) => weightFor(valid[i]));
  const nightDays = valid.filter(d => d.nightMeanHR !== null);
  const monthRestingHR = nightDays.length
    ? Math.round(weightedMean(nightDays.map(d => d.nightMeanHR), (_, i) => weightFor(nightDays[i])))
    : baseline?.restingHR ?? null;
  return {
    avgRecovery,
    avgStress,
    avgLoad,
    avgEfficiency,
    avgDebt,
    monthRestingHR,
    dataQuality: summarizeConfidence(valid),
  };
}

function rollingMean(days, index, key, windowSize, predicate = d => !d.incomplete && d[key] !== null && d[key] !== undefined) {
  const start = Math.max(0, index - windowSize + 1);
  const window = [];
  for (let i = start; i <= index; i++) {
    if (predicate(days[i])) window.push(days[i][key]);
  }
  return window.length ? Math.round(meanArr(window) * 10) / 10 : null;
}

function rollingWeightedMean(days, index, key, windowSize) {
  const start = Math.max(0, index - windowSize + 1);
  const window = [];
  const weights = [];
  for (let i = start; i <= index; i++) {
    const day = days[i];
    if (day.incomplete || day[key] === null || day[key] === undefined) continue;
    window.push(day[key]);
    weights.push(getCoverageWeight(day));
  }
  if (window.length === 0) return null;
  let total = 0;
  let totalWeight = 0;
  for (let i = 0; i < window.length; i++) {
    total += window[i] * weights[i];
    totalWeight += weights[i];
  }
  return totalWeight > 0 ? Math.round((total / totalWeight) * 10) / 10 : null;
}

function medianArr(arr) {
  if (!arr || arr.length === 0) return 0;
  const a = [...arr].sort((x, y) => x - y);
  const mid = Math.floor(a.length / 2);
  return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
}
function clampSampleMinutes(minutes, fallback = 1, maxMinutes = MAX_GAP_MIN) {
  if (!Number.isFinite(minutes) || minutes <= 0) return fallback;
  return Math.max(0.5, Math.min(maxMinutes, minutes));
}
function getSampleMinutes(readings, index, fallback = 1, maxMinutes = MAX_GAP_MIN) {
  const current = readings[index];
  const next = readings[index + 1];
  if (!current || !next) return fallback;
  const delta = (next.dt - current.dt) / 60000;
  const sameDay = current.dateKey === next.dateKey;
  if (!sameDay || delta > MAX_GAP_MIN) return 0;
  return clampSampleMinutes(delta, fallback, maxMinutes);
}
function sumCoveredMinutes(readings, fallback = 1, maxMinutes = MAX_GAP_MIN) {
  if (!readings || readings.length === 0) return 0;
  const sorted = [...readings].sort((a, b) => a.dt - b.dt);
  let total = 0;
  for (let i = 0; i < sorted.length; i++) total += getSampleMinutes(sorted, i, fallback, maxMinutes);
  return Math.min(1440, Math.round(total));
}
function computeCoverage(readings) {
  const sorted = [...(readings || [])].sort((a, b) => a.dt - b.dt);
  let total = 0;
  let night = 0;
  let day = 0;
  let morning = 0;
  for (let i = 0; i < sorted.length - 1; i++) {
    const gapMin = (sorted[i + 1].dt - sorted[i].dt) / 60000;
    if (gapMin <= 0 || gapMin > MAX_GAP_MIN) continue;
    total += gapMin;
    const h = sorted[i].hour;
    if (h >= NIGHT_START && h <= NIGHT_END) night += gapMin;
    if (h >= 8 && h <= 22) day += gapMin;
    if (h >= 5 && h <= 9) morning += gapMin;
  }
  return {
    totalMinutes: Math.round(total),
    nightMinutes: Math.round(night),
    dayMinutes: Math.round(day),
    morningMinutes: Math.round(morning),
    coverageTotal: Math.round(Math.min(100, (total / 1440) * 100)),
    coverageNight: Math.round(Math.min(100, (night / ((NIGHT_END - NIGHT_START + 1) * 60)) * 100)),
    coverageDay: Math.round(Math.min(100, (day / (15 * 60)) * 100)),
    coverageMorning: Math.round(Math.min(100, (morning / (4 * 60)) * 100)),
  };
}
function collectWindowByMinutes(readings, startIndex, windowMinutes, fallback = 1, maxMinutes = MAX_GAP_MIN) {
  const bucket = [];
  let total = 0;
  for (let i = startIndex; i < readings.length && total < windowMinutes; i++) {
    const minutes = getSampleMinutes(readings, i, fallback, maxMinutes);
    bucket.push(readings[i]);
    total += minutes;
  }
  return { readings: bucket, minutes: total };
}
function meanWeightedByMinutes(readings, fallback = 1, maxMinutes = MAX_GAP_MIN) {
  if (!readings || readings.length === 0) return 0;
  let totalMinutes = 0;
  let total = 0;
  for (let i = 0; i < readings.length; i++) {
    const minutes = getSampleMinutes(readings, i, fallback, maxMinutes);
    total += readings[i].bpm * minutes;
    totalMinutes += minutes;
  }
  return totalMinutes > 0 ? total / totalMinutes : meanArr(readings.map(r => r.bpm));
}
function stdWeightedByMinutes(readings, fallback = 1, maxMinutes = MAX_GAP_MIN) {
  if (!readings || readings.length < 2) return 0;
  const m = meanWeightedByMinutes(readings, fallback, maxMinutes);
  let totalMinutes = 0;
  let totalVar = 0;
  for (let i = 0; i < readings.length; i++) {
    const minutes = getSampleMinutes(readings, i, fallback, maxMinutes);
    const diff = readings[i].bpm - m;
    totalVar += minutes * diff * diff;
    totalMinutes += minutes;
  }
  return totalMinutes > 0 ? Math.sqrt(totalVar / totalMinutes) : stdArr(readings.map(r => r.bpm));
}

// Activity detection: rest / light / moderate / workout — relative to personal baseline
// Phase 5: TRIMP — replaces detectActivity. Uses Heart Rate Reserve so thresholds
// scale with personal physiology rather than fixed BPM values.
function calculateTRIMP(readings, currentRestingHR, maxHR) {
  const daytime = readings.filter(r => r.hour >= 6 && r.hour <= 22).sort((a, b) => a.dt - b.dt);
  if (sumCoveredMinutes(daytime, 1, 5) < 20) return { trimp: 0, level: "rest", activeMinutes: 0, peakHR: 0 };

  const hrr = Math.max(1, maxHR - currentRestingHR);
  const lightThreshold = currentRestingHR + hrr * 0.20;
  const moderateThreshold = currentRestingHR + hrr * 0.40;
  const hardThreshold = currentRestingHR + hrr * 0.60;

  let totalTrimp = 0;
  let activeMinutes = 0;
  const peakHR = Math.max(...daytime.map(r => r.bpm));

  for (let i = 0; i < daytime.length; i++) {
    const r = daytime[i];
    const minutes = getSampleMinutes(daytime, i, 1, 5);
    if (r.bpm > currentRestingHR + 15) {
      const intensity = Math.min(1, (r.bpm - currentRestingHR) / hrr);
      const weight = 0.64 * Math.exp(1.8 * intensity);
      totalTrimp += intensity * weight * minutes;
      if (intensity > 0.30) activeMinutes += minutes;
    }
  }

  let hardMinutes = 0;
  for (let i = 0; i < daytime.length; i++) {
    const minutes = getSampleMinutes(daytime, i, 1, 5);
    const gapMinutes = i > 0 ? (daytime[i].dt - daytime[i - 1].dt) / 60000 : 0;
    if (daytime[i].bpm >= hardThreshold) {
      hardMinutes = (i === 0 || gapMinutes <= 10) ? hardMinutes + minutes : minutes;
      if (hardMinutes >= 30) return { trimp: Math.round(totalTrimp), level: "workout", activeMinutes: Math.round(activeMinutes), peakHR };
    } else hardMinutes = 0;
  }

  let modMinutes = 0;
  for (let i = 0; i < daytime.length; i++) {
    const minutes = getSampleMinutes(daytime, i, 1, 5);
    const gapMinutes = i > 0 ? (daytime[i].dt - daytime[i - 1].dt) / 60000 : 0;
    if (daytime[i].bpm >= moderateThreshold) {
      modMinutes = (i === 0 || gapMinutes <= 10) ? modMinutes + minutes : minutes;
      if (modMinutes >= 15) return { trimp: Math.round(totalTrimp), level: "moderate", activeMinutes: Math.round(activeMinutes), peakHR };
    } else modMinutes = 0;
  }

  let lightMinutes = 0;
  for (let i = 0; i < daytime.length; i++) {
    if (daytime[i].bpm >= lightThreshold) lightMinutes += getSampleMinutes(daytime, i, 1, 5);
  }

  if (lightMinutes >= 20) return { trimp: Math.round(totalTrimp), level: "light", activeMinutes: Math.round(activeMinutes), peakHR };
  return { trimp: Math.round(totalTrimp), level: "rest", activeMinutes: Math.round(activeMinutes), peakHR };
}

// Phase 4: HR Nadir Timing — finds when overnight HR reaches its lowest sustained point.
// Healthy: nadir 2:00–3:30am. Late nadir (>5am) suggests body was fighting stress all night.
// Returns { hour, lowestAvg } so callers can compute nadirDepth = nightMeanHR - lowestAvg.
function computeNadirTiming(nightReadings) {
  const sorted = [...nightReadings].sort((a, b) => a.dt - b.dt);
  if (sumCoveredMinutes(sorted, 1, 5) < 45) return null;
  const windowMinutes = 30;
  let lowestAvg = Infinity;
  let nadirHour = null;
  for (let i = 0; i < sorted.length; i++) {
    const bucket = collectWindowByMinutes(sorted, i, windowMinutes, 1, 5);
    if (bucket.minutes < 20) continue;
    const avg = meanWeightedByMinutes(bucket.readings, 1, 5);
    if (avg < lowestAvg) {
      lowestAvg = avg;
      nadirHour = bucket.readings[0].hour + bucket.readings[0].minute / 60;
    }
  }
  return nadirHour !== null
    ? { hour: Math.round(nadirHour * 10) / 10, lowestAvg: Math.round(lowestAvg * 10) / 10 }
    : null;
}

// Phase 3: Evening Restitution Rate — linear regression slope of HR from 8pm–11pm.
// Negative slope = HR dropping (parasympathetic recovery active). Flat/positive = nervous system stuck.
// Returns { slope (bpm/min), startHR } so callers can normalize slope against the available HR range.
function computeEveningDecay(readings) {
  const evening = readings.filter(r => r.hour >= 20 && r.hour <= 23).sort((a, b) => a.dt - b.dt);
  if (sumCoveredMinutes(evening, 1, 5) < 40) return null;

  const startHR = evening[0].bpm;

  const points = evening.map((r, i) => ({
    x: (r.hour - 20) * 60 + r.minute,
    y: r.bpm,
    w: getSampleMinutes(evening, i, 1, 5)
  }));

  const sumW = points.reduce((s, p) => s + p.w, 0);
  if (sumW <= 0) return null;
  const sumWX = points.reduce((s, p) => s + p.w * p.x, 0);
  const sumWY = points.reduce((s, p) => s + p.w * p.y, 0);
  const sumWXY = points.reduce((s, p) => s + p.w * p.x * p.y, 0);
  const sumWX2 = points.reduce((s, p) => s + p.w * p.x * p.x, 0);
  const denom = sumW * sumWX2 - sumWX * sumWX;
  if (denom === 0) return null;
  const slope = (sumW * sumWXY - sumWX * sumWY) / denom;
  return { slope: Math.round(slope * 100) / 100, startHR };
}

// Wake Spike: orthostatic proxy. Compares first 30 min of waking HR to that night's mean.
// Uses dynamicBaseline so detection scales with the user's current fitness.
function calculateWakeSpike(readings, nightMeanHR, dynamicBaseline) {
  const morning = readings.filter(r => r.hour >= 5 && r.hour <= 9).sort((a, b) => a.dt - b.dt);
  if (sumCoveredMinutes(morning, 1, 5) < 20) return null;

  const wakeThreshold = dynamicBaseline + 15;
  let wakeIdx = -1;
  let elevatedMinutes = 0;
  for (let i = 0; i < morning.length; i++) {
    const minutes = getSampleMinutes(morning, i, 1, 5);
    const gapMinutes = i > 0 ? (morning[i].dt - morning[i - 1].dt) / 60000 : 0;
    if (morning[i].bpm > wakeThreshold) {
      elevatedMinutes = (i === 0 || gapMinutes <= 10) ? elevatedMinutes + minutes : minutes;
      if (elevatedMinutes >= 3) {
        wakeIdx = Math.max(0, i - 2);
        break;
      }
    } else {
      elevatedMinutes = 0;
    }
  }
  if (wakeIdx === -1) return null;

  const wakeWindow = collectWindowByMinutes(morning, wakeIdx, 20, 1, 5).readings;
  if (wakeWindow.length < 3) return null;
  const wakeAvg = meanWeightedByMinutes(wakeWindow, 1, 5);

  const spike = wakeAvg - nightMeanHR;
  return spike > 0 ? Math.round(spike) : null;
}

// Detects a discrete mid-sleep arousal: ≥2 consecutive readings ≥MID_SLEEP_AROUSAL_BPM above night
// mean between 1–5am, with gaps ≤10 min. Requires ≥2 consecutive samples to filter single noisy points.
// Returns boolean (null when night data is absent). Tag is held pending sample-density validation.
function computeMidSleepArousal(nightReadings, nightMeanHR) {
  if (nightMeanHR === null) return null;
  const sorted = nightReadings.filter(r => r.hour >= 1 && r.hour <= 5).sort((a, b) => a.dt - b.dt);
  if (sorted.length < 2) return false;
  const threshold = nightMeanHR + MID_SLEEP_AROUSAL_BPM;
  let streak = 0;
  for (let i = 0; i < sorted.length; i++) {
    const gapMin = i > 0 ? (sorted[i].dt - sorted[i - 1].dt) / 60000 : 0;
    if (sorted[i].bpm > threshold && (i === 0 || gapMin <= 10)) {
      streak++;
      if (streak >= 2) return true;
    } else {
      streak = 0;
    }
  }
  return false;
}

function computeDailyTimeline(readings, currentRestingHR, baseline, maxHR, coverageStats) {
  const coverage = coverageStats.coverageTotal;
  const nightCoverage = coverageStats.coverageNight;
  const dayCoverage = coverageStats.coverageDay;
  const nightReadings = readings.filter(r => r.hour >= NIGHT_START && r.hour <= NIGHT_END + 1);
  const nightSignalReadings = nightReadings.filter(r => r.hour <= NIGHT_END);
  const dayReadings = readings.filter(r => r.hour >= 8 && r.hour <= 22);
  const allBpm = readings.map(r => r.bpm);
  const nightCoveredMinutes = coverageStats.nightMinutes;
  const dayCoveredMinutes = coverageStats.dayMinutes;
  const hasNightData = nightCoveredMinutes >= 45;
  const hasDayData = dayCoveredMinutes >= 60;
  const nightMeanHR = hasNightData ? meanWeightedByMinutes(nightSignalReadings, 1, 5) : null;
  const nightStdHR = hasNightData ? stdWeightedByMinutes(nightSignalReadings, 1, 5) : null;
  const nightMinHR = hasNightData ? Math.min(...nightSignalReadings.map(r => r.bpm)) : null;
  const nightMaxHR = hasNightData ? Math.max(...nightSignalReadings.map(r => r.bpm)) : null;
  const dayMeanHR = meanWeightedByMinutes(readings, 1, 5);
  const dayMinHR = Math.min(...allBpm);

  const activity = calculateTRIMP(readings, currentRestingHR, maxHR);
  const nadirResult = computeNadirTiming(nightReadings);
  const nadirHour = nadirResult?.hour ?? null;
  const nadirDepth = (nadirResult && nightMeanHR !== null)
    ? Math.round((nightMeanHR - nadirResult.lowestAvg) * 10) / 10
    : null;
  const eveningResult = computeEveningDecay(readings);
  const eveningDecay = eveningResult?.slope ?? null;
  const eveningStartHR = eveningResult?.startHR ?? null;
  const eveningRange = (eveningStartHR !== null && nightMeanHR !== null) ? eveningStartHR - nightMeanHR : null;
  const eveningDecayNorm = (eveningDecay !== null && eveningRange !== null && eveningRange > 5)
    ? Math.round((eveningDecay / eveningRange) * 10000) / 10000
    : null;

  let pulseStability = null;
  let nightVolatilityPercent = null;
  if (hasNightData) {
    const cv = (nightStdHR / nightMeanHR) * 100;
    nightVolatilityPercent = Math.round(cv * 10) / 10;
    pulseStability = Math.min(100, Math.max(0, Math.round(100 - ((cv - 2) * 15))));
  }

  const wakeSpike = nightMeanHR !== null
    ? calculateWakeSpike(readings, nightMeanHR, currentRestingHR)
    : null;

  let daytimeBelowBaselinePct = null;
  if (hasDayData) {
    const threshold = currentRestingHR + 10;
    let belowMinutes = 0;
    let totalDayMinutes = 0;
    for (let i = 0; i < dayReadings.length; i++) {
      const minutes = getSampleMinutes(dayReadings, i, 1, 5);
      totalDayMinutes += minutes;
      if (dayReadings[i].bpm < threshold) belowMinutes += minutes;
    }
    daytimeBelowBaselinePct = totalDayMinutes > 0 ? (belowMinutes / totalDayMinutes) * 100 : null;
  }

  let idleStressMinutes = null;
  if (hasDayData && (activity.level === "rest" || activity.level === "light")) {
    const idleReadings = readings.filter(r => r.hour >= 7 && r.hour <= 21).sort((a, b) => a.dt - b.dt);
    const elevThreshold = currentRestingHR + IDLE_STRESS_HRR_FRACTION * Math.max(1, maxHR - currentRestingHR);
    let stressMinutes = 0;
    let streakMinutes = 0;
    for (let i = 0; i < idleReadings.length; i++) {
      const minutes = getSampleMinutes(idleReadings, i, 1, 5);
      const gapMinutes = i > 0 ? (idleReadings[i].dt - idleReadings[i - 1].dt) / 60000 : 0;
      if (idleReadings[i].bpm > elevThreshold) {
        streakMinutes = (i === 0 || gapMinutes <= 10) ? streakMinutes + minutes : minutes;
        if (streakMinutes >= 15) stressMinutes += minutes;
      } else {
        streakMinutes = 0;
      }
    }
    idleStressMinutes = Math.round(stressMinutes);
  }

  const midSleepArousal = hasNightData ? computeMidSleepArousal(nightReadings, nightMeanHR) : null;
  const autonomicRangeRatio = (nightMeanHR !== null && nightMeanHR > 0)
    ? Math.round((Math.round(dayMeanHR) / Math.round(nightMeanHR)) * 100) / 100
    : null;

  return {
    dayMeanHR: Math.round(dayMeanHR),
    dayMinHR,
    nightMeanHR: nightMeanHR !== null ? Math.round(nightMeanHR) : null,
    nightStdHR: nightStdHR !== null ? Math.round(nightStdHR * 10) / 10 : null,
    nightMinHR,
    nightMaxHR,
    dynamicBaseline: Math.round(currentRestingHR * 10) / 10,
    baselineDelta: nightMeanHR !== null ? Math.round((nightMeanHR - currentRestingHR) * 10) / 10 : null,
    daytimeBelowBaselinePct: daytimeBelowBaselinePct !== null ? Math.round(daytimeBelowBaselinePct) : null,
    coverageTotal: coverage,
    coverageNight: nightCoverage,
    coverageDay: dayCoverage,
    coverageMorning: coverageStats.coverageMorning ?? null,
    readingCount: readings.length,
    activeMinutes: activity.activeMinutes,
    peakHR: activity.peakHR,
    trimp: activity.trimp,
    activityLevel: activity.level,
    nadirHour,
    nadirDepth,
    eveningDecay,
    eveningDecayNorm,
    pulseStability,
    nightVolatilityPercent,
    wakeSpike,
    idleStressMinutes,
    midSleepArousal,
    autonomicRangeRatio,
    hasNightData,
    hasDayData,
  };
}

function computeScoresFromRaw(rawMetrics, baseline, readings, activityLevel) {
  let recoveryQuality = null;
  if (rawMetrics.hasNightData && rawMetrics.nightMeanHR !== null && rawMetrics.nightStdHR !== null) {
    // depth capped at 15 bpm so extreme outliers don't waste headroom
    const depth = Math.min(rawMetrics.dynamicBaseline - rawMetrics.nightMeanHR, 15);
    // symmetric penalty/reward, capped at ±10 to limit artifact nights from dragging neighbors via smoothing
    const stability = Math.max(-10, 10 - rawMetrics.nightStdHR);
    recoveryQuality = Math.min(100, Math.max(0, 50 + depth * 3 + stability * 2));
  }

  let autonomicLoad = null;
  if (rawMetrics.hasNightData && rawMetrics.nightMeanHR !== null && rawMetrics.nightStdHR !== null) {
    const elevation = rawMetrics.nightMeanHR - rawMetrics.dynamicBaseline;
    // use rolling EWMA std as reference instead of fixed initial-window baseline.std
    const rollingStdRef = rawMetrics.nightHrEwmaStd ?? baseline.std;
    const instability = rawMetrics.nightStdHR - rollingStdRef;
    autonomicLoad = Math.min(100, Math.max(0, 25 + elevation * 3 + instability * 4));
  }

  const daytimeQuiescence = rawMetrics.daytimeBelowBaselinePct !== null
    ? Math.min(100, Math.max(0, rawMetrics.daytimeBelowBaselinePct))
    : null;

  const isActiveDay = activityLevel === "workout" || activityLevel === "moderate";
  let stressSignature = null;
  const eveningReadings = readings.filter(r => r.hour >= 20 && r.hour <= 23);
  const earlyMorningReadings = readings.filter(r => r.hour >= 6 && r.hour <= 7);
  const hasEvening = sumCoveredMinutes(eveningReadings, 1, 5) >= 20;
  const hasMorning = sumCoveredMinutes(earlyMorningReadings, 1, 5) >= 15;
  if (hasEvening || hasMorning) {
    const eveningElev = hasEvening ? meanArr(eveningReadings.map(r => r.bpm)) - rawMetrics.dynamicBaseline : 0;
    const morningElev = hasMorning ? meanArr(earlyMorningReadings.map(r => r.bpm)) - rawMetrics.dynamicBaseline : 0;
    // morning HR is the cleaner autonomic signal; evening confounded by recent activity
    // on active days, suppress evening window entirely (exercise inflates it)
    const useEvening = hasEvening && !isActiveDay;
    const weightedElev = useEvening && hasMorning
      ? eveningElev * 0.3 + morningElev * 0.7
      : hasMorning ? morningElev : (useEvening ? eveningElev : null);
    if (weightedElev !== null) {
      stressSignature = Math.min(100, Math.max(0, 30 + weightedElev * 3));
    }
  }

  return {
    recoveryQuality: recoveryQuality !== null ? Math.round(recoveryQuality) : null,
    autonomicLoad: autonomicLoad !== null ? Math.round(autonomicLoad) : null,
    cardioEfficiency: daytimeQuiescence !== null ? Math.round(daytimeQuiescence) : null,
    stressSignature: stressSignature !== null ? Math.round(stressSignature) : null,
    recoveryDebt: null,
    pulseStability: rawMetrics.pulseStability,
    acwr: null,
  };
}

function computeDriversFromDay(day, thresholds = null) {
  const raw = day.rawMetrics || {};
  const drivers = [];

  const nightOk   = (raw.coverageNight   ?? 0) >= MIN_NIGHT_COV_FOR_TAGS;
  const morningOk = (raw.coverageMorning ?? 0) >= MIN_MORNING_COV_FOR_TAGS;
  const dayOk     = (raw.coverageDay     ?? 0) >= MIN_DAY_COV_FOR_TAGS;

  if ((raw.coverageTotal ?? 0) < 80) drivers.push("low_coverage");

  // Night-window tags
  if (nightOk) {
    const elevatedThreshold = raw.nightHrEwmaStd
      ? Math.max(NIGHT_HR_ELEVATED_BPM, raw.nightHrEwmaStd * 1.5)
      : NIGHT_HR_ELEVATED_BPM;
    if (raw.nightMeanHR !== null && raw.nightMeanHR > raw.dynamicBaseline + elevatedThreshold)
      drivers.push("elevated_night_hr");
    if (raw.nadirHour !== null && raw.nadirHour > 5) drivers.push("late_nadir");
    // shallow_nadir: enabled when calibrated (two-condition: abs floor + personal P20)
    if (raw.nadirDepth !== null) {
      const nadirThr = thresholds?.shallowNadirThreshold ?? SHALLOW_NADIR_BPM;
      if (raw.nadirDepth < nadirThr) drivers.push("shallow_nadir");
    }
    const nightVolThr = thresholds?.highNightVolThreshold ?? 8;
    if (raw.nightVolatilityPercent !== null && raw.nightVolatilityPercent > nightVolThr) drivers.push("high_night_volatility");
    const pulseStabThr = thresholds?.lowPulseStabThreshold ?? 50;
    if (day.pulseStability !== null && day.pulseStability < pulseStabThr) drivers.push("low_pulse_stability");
    if (raw.nadirHour !== null && raw.nadirHour >= 2 && raw.nadirHour <= 3.5) drivers.push("good_nadir");
    const stablePulseThr = thresholds ? (thresholds.lowPulseStabThreshold + 15) : 70;
    if (day.pulseStability !== null && day.pulseStability >= stablePulseThr) drivers.push("stable_pulse");
    // mid_sleep_arousal tag held — metric stored, validate sample density before enabling:
    // if (raw.midSleepArousal === true) drivers.push("mid_sleep_arousal");
  }

  // Morning/wake-window tags
  if (morningOk) {
    const wakeThr = thresholds?.highWakeSpikeThreshold ?? 30;
    if (raw.wakeSpike !== null && raw.wakeSpike > wakeThr) drivers.push("high_wake_spike");
    const smoothWakeThr = thresholds ? (thresholds.highWakeSpikeThreshold - 5) : 25;
    if (raw.wakeSpike !== null && raw.wakeSpike <= smoothWakeThr) drivers.push("smooth_wake");
  }

  // Evening tags (use normalized slope when available, fall back to raw)
  if (raw.eveningDecayNorm !== null) {
    if (raw.eveningDecayNorm > FLAT_EVENING_NORM) drivers.push("flat_evening");
    if (raw.eveningDecayNorm < GOOD_EVENING_DROP_NORM) drivers.push("good_evening_drop");
  } else if (raw.eveningDecay !== null && dayOk) {
    if (raw.eveningDecay > -0.02) drivers.push("flat_evening");
    if (raw.eveningDecay < -0.10) drivers.push("good_evening_drop");
  }

  // Daytime tags
  if (dayOk) {
    const idleThr = thresholds?.highIdleStressThreshold ?? 45;
    if (raw.idleStressMinutes !== null && raw.idleStressMinutes > idleThr) drivers.push("high_idle_stress");
    if (raw.idleStressMinutes !== null && raw.idleStressMinutes <= 10) drivers.push("calm_day");
  }

  // compressed_autonomic_range tag held — metric stored as autonomicRangeRatio, check distribution first:
  // if (nightOk && dayOk && raw.autonomicRangeRatio !== null && raw.autonomicRangeRatio < COMPRESSED_RANGE_RATIO)
  //   drivers.push("compressed_autonomic_range");

  // Compound positive tag: all three night conditions must be well-covered
  if (nightOk && morningOk &&
      raw.nightMeanHR !== null && raw.nightMeanHR <= raw.dynamicBaseline - 2 &&
      raw.wakeSpike !== null && raw.wakeSpike <= 25 &&
      raw.nadirHour !== null && raw.nadirHour >= 2 && raw.nadirHour <= 3.5)
    drivers.push("good_recovery_morning");

  if (raw.activityLevel === "workout" || raw.activityLevel === "moderate") drivers.push("hard_training_day");

  return drivers;
}

// Computes per-user magnitude thresholds from historical day records.
// Returns null when fewer than CALIB_MIN_DAYS qualifying nights are available;
// callers fall back to hardcoded defaults in that case.
function computeUserThresholds(days) {
  function pctile(arr, p) {
    const sorted = [...arr].sort((a, b) => a - b);
    return sorted[Math.max(0, Math.floor(sorted.length * p / 100) - 1)];
  }

  const calibDays = days.filter(d =>
    !d.incomplete &&
    d.rawMetrics?.hasNightData &&
    (d.rawMetrics?.coverageNight ?? 0) >= MIN_NIGHT_COV_FOR_TAGS
  );

  if (calibDays.length < CALIB_MIN_DAYS) return null;

  const nadirDepths     = calibDays.map(d => d.rawMetrics.nadirDepth).filter(v => v !== null && !isNaN(v));
  const wakeSpikes      = calibDays.map(d => d.rawMetrics.wakeSpike).filter(v => v !== null && !isNaN(v));
  const idleStressMins  = calibDays.map(d => d.rawMetrics.idleStressMinutes).filter(v => v !== null && !isNaN(v));
  const nightVols       = calibDays.map(d => d.rawMetrics.nightVolatilityPercent).filter(v => v !== null && !isNaN(v));
  const pulseStabs      = calibDays.map(d => d.pulseStability).filter(v => v !== null && !isNaN(v));

  return {
    calibrated: true,
    daysUsed: calibDays.length,
    // low = bad: fire when nadirDepth < threshold (worst personal P20, but never above abs floor)
    shallowNadirThreshold:   nadirDepths.length    >= 10 ? Math.min(SHALLOW_NADIR_ABS_FLOOR,    pctile(nadirDepths,    20)) : SHALLOW_NADIR_BPM,
    // high = bad: fire when value > threshold (worst personal P80, but never below abs floor)
    highWakeSpikeThreshold:  wakeSpikes.length     >= 10 ? Math.max(HIGH_WAKE_SPIKE_ABS_FLOOR,  pctile(wakeSpikes,     80)) : 30,
    highIdleStressThreshold: idleStressMins.length >= 10 ? Math.max(HIGH_IDLE_STRESS_ABS_FLOOR, pctile(idleStressMins, 80)) : 45,
    highNightVolThreshold:   nightVols.length      >= 10 ? Math.max(HIGH_NIGHT_VOL_ABS_FLOOR,   pctile(nightVols,      80)) : 8,
    // low = bad: fire when pulseStability < threshold (worst personal P20, but never above abs floor)
    lowPulseStabThreshold:   pulseStabs.length     >= 10 ? Math.min(LOW_PULSE_STAB_ABS_FLOOR,   pctile(pulseStabs,     20)) : 50,
  };
}

function buildDayRecord(date, rawMetrics, scores, drivers, coverageStats, currentRestingHR, incomplete = false) {
  const confidenceLevel = confidence(coverageStats.coverageNight);
  return {
    date,
    incomplete,
    confidence: confidenceLevel,
    rawMetrics,
    scores,
    trends: {},
    recommendations: [],
    coverage: rawMetrics.coverageTotal,
    coverageTotal: rawMetrics.coverageTotal,
    coverageNight: rawMetrics.coverageNight,
    coverageDay: rawMetrics.coverageDay,
    coverageMorning: rawMetrics.coverageMorning ?? null,
    dynamicBaseline: rawMetrics.dynamicBaseline ?? Math.round(currentRestingHR * 10) / 10,
    recoveryQuality: scores.recoveryQuality,
    autonomicLoad: scores.autonomicLoad,
    cardioEfficiency: scores.cardioEfficiency,
    stressSignature: scores.stressSignature,
    recoveryDebt: scores.recoveryDebt,
    pulseStability: scores.pulseStability,
    acwr: scores.acwr,
    dayMeanHR: rawMetrics.dayMeanHR ?? null,
    dayMinHR: rawMetrics.dayMinHR ?? null,
    nightMeanHR: rawMetrics.nightMeanHR ?? null,
    readingCount: rawMetrics.readingCount ?? 0,
    activityLevel: rawMetrics.activityLevel ?? "rest",
    activeMinutes: rawMetrics.activeMinutes ?? 0,
    peakHR: rawMetrics.peakHR ?? 0,
    trimp: rawMetrics.trimp ?? 0,
    hasWorkout: rawMetrics.activityLevel === "workout",
    nadirHour: rawMetrics.nadirHour ?? null,
    nadirDepth: rawMetrics.nadirDepth ?? null,
    eveningDecay: rawMetrics.eveningDecay ?? null,
    eveningDecayNorm: rawMetrics.eveningDecayNorm ?? null,
    nightVolatilityPercent: rawMetrics.nightVolatilityPercent ?? null,
    wakeSpike: rawMetrics.wakeSpike ?? null,
    idleStressMinutes: rawMetrics.idleStressMinutes ?? null,
    midSleepArousal: rawMetrics.midSleepArousal ?? null,
    autonomicRangeRatio: rawMetrics.autonomicRangeRatio ?? null,
    nightHrEwmaStd: rawMetrics.nightHrEwmaStd ?? null,
    drivers,
  };
}

function attachRollingTrends(days) {
  for (let i = 0; i < days.length; i++) {
    if (days[i].incomplete) continue;
    days[i].trends = {
      nightHr7d: rollingWeightedMean(days, i, "nightMeanHR", 7),
      nightHr14d: rollingWeightedMean(days, i, "nightMeanHR", 14),
      nightHr28d: rollingWeightedMean(days, i, "nightMeanHR", 28),
      recovery7d: rollingWeightedMean(days, i, "recoveryQuality", 7),
      recovery14d: rollingWeightedMean(days, i, "recoveryQuality", 14),
      stress7d: rollingWeightedMean(days, i, "stressSignature", 7),
      stress14d: rollingWeightedMean(days, i, "stressSignature", 14),
      coverageNight7d: rollingMean(days, i, "coverageNight", 7, d => !d.incomplete && d.coverageNight !== null && d.coverageNight !== undefined),
    };
  }

  // Cross-day tags: belong in the trends layer, not the stateless daily driver pass.
  for (let i = 0; i < days.length; i++) {
    if (days[i].incomplete) continue;
    const t = days[i].trends;

    // rising_baseline: 7-day night HR has climbed >RISING_BASELINE_BPM above 28-day baseline.
    // Requires enough history for both windows to be meaningful.
    if (t.nightHr7d !== null && t.nightHr28d !== null &&
        t.nightHr7d > t.nightHr28d + RISING_BASELINE_BPM) {
      if (!days[i].drivers.includes("rising_baseline"))
        days[i].drivers.push("rising_baseline");
    }

    // incomplete_workout_recovery: the night after a hard day is still elevated.
    if (i > 0 && !days[i - 1].incomplete) {
      const prevLevel = days[i - 1].activityLevel;
      if ((prevLevel === "workout" || prevLevel === "moderate") &&
          days[i].nightMeanHR !== null &&
          days[i].nightMeanHR > days[i].dynamicBaseline + NIGHT_HR_ELEVATED_BPM) {
        if (!days[i].drivers.includes("incomplete_workout_recovery"))
          days[i].drivers.push("incomplete_workout_recovery");
      }
    }
  }

  for (let i = 0; i < days.length; i++) {
    if (days[i].incomplete) continue;
    const windowStart = Math.max(0, i - 4);
    const win = days.slice(windowStart, i + 1).filter(d => !d.incomplete && d.nightMeanHR !== null && d.confidence !== "low");
    if (win.length >= 2) {
      const recentNightMean = weightedMean(win.map(d => d.nightMeanHR), (_, idx) => getCoverageWeight(win[idx]));
      // Use baseline as it stood before the 5-day window to prevent self-suppression:
      // a sustained elevation raises the EWMA, zeroing out drift vs today's baseline.
      const lagIdx = Math.max(0, i - 5);
      const referenceBaseline = days[lagIdx].dynamicBaseline;
      const drift = recentNightMean - referenceBaseline;
      days[i].scores.recoveryDebt = Math.min(100, Math.max(0, 30 + drift * 6));
      days[i].recoveryDebt = Math.round(days[i].scores.recoveryDebt);
    }
  }

  const rawLoads = days.map(d => d.incomplete ? null : d.autonomicLoad);
  for (let i = 0; i < days.length; i++) {
    if (days[i].incomplete) continue;
    const window = [];
    for (let j = Math.max(0, i - 1); j <= Math.min(days.length - 1, i + 1); j++) {
      if (!days[j].incomplete && rawLoads[j] !== null) window.push(rawLoads[j]);
    }
    if (window.length > 0) {
      const smoothed = Math.round(meanArr(window));
      days[i].scores.autonomicLoad = smoothed;
      days[i].autonomicLoad = smoothed;
    }
  }

  const rawRecoveries = days.map(d => d.incomplete ? null : d.recoveryQuality);
  for (let i = 0; i < days.length; i++) {
    if (days[i].incomplete) continue;
    const window = [];
    for (let j = Math.max(0, i - 1); j <= Math.min(days.length - 1, i + 1); j++) {
      if (!days[j].incomplete && rawRecoveries[j] !== null) window.push(rawRecoveries[j]);
    }
    if (window.length > 0) {
      const smoothed = Math.round(meanArr(window));
      days[i].scores.recoveryQuality = smoothed;
      days[i].recoveryQuality = smoothed;
    }
  }

  for (let i = 0; i < days.length; i++) {
    if (days[i].incomplete) { days[i].scores.acwr = null; days[i].acwr = null; continue; }
    const acuteWin = days.slice(Math.max(0, i - 6), i + 1).filter(d => !d.incomplete);
    const chronicWin = days.slice(Math.max(0, i - 27), i + 1).filter(d => !d.incomplete);
    if (acuteWin.length < 4 || chronicWin.length < 14) { days[i].scores.acwr = null; days[i].acwr = null; continue; }
    const acuteLoad = meanArr(acuteWin.map(d => d.trimp));
    const chronicLoad = meanArr(chronicWin.map(d => d.trimp));
    const acwr = chronicLoad > 0 ? Math.round((acuteLoad / chronicLoad) * 100) / 100 : null;
    days[i].scores.acwr = acwr;
    days[i].acwr = acwr;
  }
}

const ACTIONS = {
  sleep_timing_anchor:    "Keep bedtime and wake time within a 30-minute window for the next three nights.",
  lighter_late_evening:   "Finish heavy meals 2–3 hours before bed when possible.",
  alcohol_free_winddown:  "Avoid alcohol close to bedtime on nights where recovery matters.",
  caffeine_cutoff:        "Try stopping caffeine earlier in the day for one week.",
  evening_decompression:  "Dim lights and reduce work/screens during the final hour before bed.",
  training_deload:        "Reduce intensity for the next two to three days.",
  rest_day_protection:    "Schedule at least one full rest day this week — not active recovery, actual rest.",
  low_intensity_movement: "Add a short easy walk after dinner to support the evening HR wind-down.",
  hydration_on_waking:    "Drink 250–500 ml of water immediately on waking.",
  training_spacing:       "Add at least one lighter day between hard sessions.",
  use_surrounding_trend:  "Use the surrounding days for context rather than this day in isolation.",
  data_quality_note:      "Wear your device overnight for more reliable trend reading.",
};

function buildRecommendation(id, severity, confidenceLevel, title, observation, interpretation, evidence, actionIds) {
  return { id, severity, confidence: confidenceLevel, title, why: observation, observation, interpretation, evidence, actionIds, actions: actionIds.map(k => ACTIONS[k] || k) };
}

function buildFallbackPriority(avgRecovery, avgStress, avgDebt, avgEfficiency, copyMode) {
  if (copyMode === "directional") {
    if (avgRecovery < 45) return { label: "Sleep & recovery",  text: "Night coverage is limited, but recovery looks under pressure. Sleep consistency — a steady bedtime window — is a low-risk first step." };
    if (avgStress > 60)   return { label: "Stress management", text: "Stress looks elevated, though data quality limits certainty. A calmer evening routine is worth testing regardless." };
    if (avgDebt > 50)     return { label: "Load management",   text: "Recovery debt may be accumulating. If training has been heavy, scheduling a genuine rest day is a good bet." };
    return null;
  }
  const q = copyMode === "qualified";
  if (avgRecovery < 45) return { label: "Sleep & recovery",  text: q ? "Recovery looks under pressure most nights. Sleep consistency — a steady 30-minute bedtime window — is the clearest first experiment." : "Your #1 lever this month is sleep. Everything else improves when overnight recovery improves. Start with consistent timing." };
  if (avgStress > 60)   return { label: "Stress management", text: q ? "Evening HR has been running elevated. Building a clearer wind-down — dimmer lights, no screens — may help bring it down." : "Your body is running hot in the evenings. Focus on winding down earlier — this single change tends to cascade into better recovery." };
  if (avgDebt > 50)     return { label: "Load management",   text: q ? "Recovery debt looks elevated. At least one genuine rest day per week — not active recovery, actual rest — should help." : "More strain is accumulating than is clearing. Introduce at least one genuine rest day per week — not active recovery, actual rest." };
  if (avgEfficiency < 35) return { label: "Daytime HR",      text: "Your heart is working harder than it needs to during the day. Check hydration, caffeine timing, and consider adding low-intensity movement." };
  return null;
}

function generateDayRecommendations(day, prevDay, context = {}) {
  if (!day || day.incomplete) return [];
  const recs = [];
  const trends = day.trends || {};
  const baseline = context.baseline;
  if (
    trends.recovery7d !== null &&
    trends.recovery14d !== null &&
    trends.recovery7d < trends.recovery14d - 6 &&
    trends.nightHr7d !== null &&
    baseline &&
    trends.nightHr7d > baseline.restingHR + 4 &&
    (trends.coverageNight7d ?? 0) >= 60
  ) {
    recs.push(buildRecommendation(
      "recovery_decline_elevated_night_hr",
      "high",
      day.confidence,
      "Recovery is trending down",
      "Your recent overnight heart rate is running above baseline while recovery has declined versus the longer trend.",
      "This can reflect accumulated load, reduced sleep quality, or weaker recovery capacity — worth watching if it persists.",
      [
        `Recovery 7d ${Math.round(trends.recovery7d)} vs 14d ${Math.round(trends.recovery14d)}`,
        `Night HR 7d ${Math.round(trends.nightHr7d)} bpm vs baseline ${baseline.restingHR}`,
        `Night coverage 7d ${Math.round(trends.coverageNight7d)}%`,
      ],
      ["sleep_timing_anchor", "alcohol_free_winddown", "training_spacing"]
    ));
  }
  if (day.activityLevel === "rest" && day.stressSignature > 60) {
    recs.push(buildRecommendation(
      "high_stress_rest_days",
      "moderate",
      day.confidence,
      "Stress remains high on rest days",
      "Your evening or early-morning heart rate stayed elevated without exercise to explain it.",
      "This pattern is consistent with mental or life stress carrying over into your overnight state.",
      [
        `Stress score ${day.stressSignature}`,
        `Night HR delta ${day.rawMetrics?.baselineDelta ?? "n/a"} bpm`,
      ],
      ["evening_decompression", "caffeine_cutoff", "low_intensity_movement"]
    ));
  }
  if (day.nadirHour !== null && day.nadirHour > 5) {
    recs.push(buildRecommendation(
      "late_nadir_pattern",
      "moderate",
      day.confidence,
      "Your system calmed down late",
      "The overnight low point arrived later than the typical 2–3am window.",
      "A late nadir often reflects late load on the system — food, alcohol, or sustained activation close to sleep.",
      [
        `Nadir at ~${day.nadirHour.toFixed(1)}h`,
        `Coverage night ${day.coverageNight}%`,
      ],
      ["lighter_late_evening", "alcohol_free_winddown"]
    ));
  }
  const flatEvening = day.eveningDecayNorm !== null
    ? day.eveningDecayNorm > FLAT_EVENING_NORM
    : (day.eveningDecay !== null && day.eveningDecay > -0.02);
  if (flatEvening) {
    recs.push(buildRecommendation(
      "flat_evening_pattern",
      "moderate",
      day.confidence,
      "Your evening wind-down looked flat",
      "Heart rate did not fall much between 8pm and 11pm.",
      "A flat evening curve suggests the nervous system stayed activated when it should be winding down.",
      [
        `Evening slope ${day.eveningDecay} bpm/min`,
      ],
      ["evening_decompression"]
    ));
  }
  if (day.acwr !== null && day.acwr > 1.5) {
    recs.push(buildRecommendation(
      "training_load_spike",
      "high",
      day.confidence,
      "Training load is spiking",
      "Recent workload is much higher than your rolling baseline.",
      "A large acute-to-chronic ratio can precede fatigue accumulation and reduced recovery quality if sustained.",
      [
        `ACWR ${day.acwr}`,
        `TRIMP ${day.trimp}`,
      ],
      ["training_deload", "sleep_timing_anchor"]
    ));
  }
  if (day.confidence === "low") {
    recs.push(buildRecommendation(
      "low_confidence_data_quality",
      "low",
      "low",
      "Low confidence day",
      "Night coverage was limited, so scores are estimates rather than solid readings.",
      "The surrounding trend is more reliable than this single day — use it as context, not a definitive signal.",
      [
        `Night coverage ${day.coverageNight}%`,
      ],
      ["use_surrounding_trend", "data_quality_note"]
    ));
  }
  return recs;
}

function generateRangeRecommendations(days, baseline) {
  const valid = (days || []).filter(d => !d.incomplete);
  if (valid.length === 0) return [];
  const recs = [];
  const summary = summarizeRange(valid, baseline);
  const confidenceSummary = summarizeConfidence(valid);
  const latest = valid[valid.length - 1];
  if (latest) recs.push(...generateDayRecommendations(latest, valid[valid.length - 2] || null, { baseline }));
  if (summary.avgStress > 60 && valid.filter(d => d.activityLevel === "rest" && d.stressSignature > 55).length >= 3) {
    recs.push({ ...buildRecommendation(
      "high_stress_rest_days",
      "high",
      confidenceSummary.label === "Weak" ? "low" : "medium",
      "Rest-day stress is a month-level theme",
      "Stress stayed elevated even on easier days across the month.",
      "When rest-day stress is persistently high, it tends to reflect life or mental load rather than training.",
      [
        `${valid.filter(d => d.activityLevel === "rest" && d.stressSignature > 55).length} stressed rest days`,
        `Weighted month stress ${Math.round(summary.avgStress)}`,
      ],
      ["evening_decompression", "caffeine_cutoff"]
    ), timeframe: "month" });
  }
  if (confidenceSummary.lowConfidenceDays / valid.length > 0.3) {
    recs.push({ ...buildRecommendation(
      "low_confidence_data_quality",
      "low",
      "low",
      "Data quality limits this month",
      "A meaningful share of nights had weak coverage this month.",
      "Monthly averages based on partial data should be treated as directional rather than precise.",
      [
        `${confidenceSummary.lowConfidenceDays} low-confidence days`,
        `${confidenceSummary.sufficientNightPct}% of nights had sufficient night coverage`,
      ],
      ["use_surrounding_trend"]
    ), timeframe: "month" });
  }
  return recs;
}

function pickPrimaryRecommendation(recommendations) {
  if (!recommendations || recommendations.length === 0) return null;
  const severityScore   = { high: 40, moderate: 25, low: 10, positive: 0 };
  const confidenceScore = { high: 20, medium: 10, low: -20 };
  const persistenceBonus = { recovery_decline_elevated_night_hr: 15, training_load_spike: 15, baseline_drift: 10 };
  const score = rec =>
    (severityScore[rec.severity] || 0) +
    (confidenceScore[rec.confidence] || 0) +
    (persistenceBonus[rec.id] || 0) +
    (rec.id?.includes("low_confidence") ? -10 : 0);
  return [...recommendations].sort((a, b) => score(b) - score(a))[0];
}

function computeDailySignals(days, baseline, maxHR) {
  const dateKeys = Object.keys(days).sort();
  const dailySignals = [];

  // Phase 2: EWMA dynamic baseline — starts from initial 14-day baseline,
  // updates each night so signals adapt as fitness changes.
  const alpha = 2 / (21 + 1); // 21-day smoothing factor
  const varAlpha = 2 / (14 + 1); // 14-day EWMA for inter-night variance
  let currentRestingHR = baseline.restingHR;
  let ewmaNightVar = 4; // initial variance (≈2 bpm std); updated each night

  for (const dk of dateKeys) {
    const readings = days[dk];
    const coverageStats = computeCoverage(readings);
    const coveredMinutes = coverageStats.totalMinutes;

    if (coveredMinutes < 60) {
      const rawMetrics = {
        dayMeanHR: null,
        dayMinHR: null,
        nightMeanHR: null,
        nightStdHR: null,
        nightMinHR: null,
        nightMaxHR: null,
        dynamicBaseline: Math.round(currentRestingHR * 10) / 10,
        baselineDelta: null,
        daytimeBelowBaselinePct: null,
        coverageTotal: coverageStats.coverageTotal,
        coverageNight: coverageStats.coverageNight,
        coverageDay: coverageStats.coverageDay,
        coverageMorning: coverageStats.coverageMorning ?? null,
        readingCount: readings.length,
        activeMinutes: 0,
        peakHR: 0,
        trimp: 0,
        activityLevel: "rest",
        nadirHour: null,
        nadirDepth: null,
        eveningDecay: null,
        eveningDecayNorm: null,
        pulseStability: null,
        nightVolatilityPercent: null,
        wakeSpike: null,
        idleStressMinutes: null,
        midSleepArousal: null,
        autonomicRangeRatio: null,
        nightHrEwmaStd: null,
        hasNightData: false,
        hasDayData: false,
      };
      const scores = { recoveryQuality: null, autonomicLoad: null, cardioEfficiency: null, stressSignature: null, recoveryDebt: null, pulseStability: null, acwr: null };
      dailySignals.push(buildDayRecord(dk, rawMetrics, scores, ["low_coverage"], coverageStats, currentRestingHR, true));
      // Still update EWMA with whatever night data exists
      const nightBpmPartial = readings.filter(r => r.hour >= NIGHT_START && r.hour <= NIGHT_END).map(r => r.bpm);
      if (nightBpmPartial.length >= 5) {
        const partialNightMean = meanArr(nightBpmPartial);
        const residual = partialNightMean - currentRestingHR;
        ewmaNightVar = varAlpha * (residual * residual) + (1 - varAlpha) * ewmaNightVar;
        currentRestingHR = partialNightMean * alpha + currentRestingHR * (1 - alpha);
      }
      continue;
    }

    const rawMetrics = computeDailyTimeline(readings, currentRestingHR, baseline, maxHR, coverageStats);
    rawMetrics.nightHrEwmaStd = Math.round(Math.sqrt(ewmaNightVar) * 10) / 10;
    const scores = computeScoresFromRaw(rawMetrics, baseline, readings, rawMetrics.activityLevel);
    const provisionalDay = buildDayRecord(dk, rawMetrics, scores, [], coverageStats, currentRestingHR, false);
    provisionalDay.drivers = computeDriversFromDay(provisionalDay);
    dailySignals.push(provisionalDay);

    // Update EWMA after this day's signals are computed so today compares against prior baseline.
    if (rawMetrics.hasNightData) {
      const residual = rawMetrics.nightMeanHR - currentRestingHR;
      ewmaNightVar = varAlpha * (residual * residual) + (1 - varAlpha) * ewmaNightVar;
      currentRestingHR = rawMetrics.nightMeanHR * alpha + currentRestingHR * (1 - alpha);
    }
  }

  // Phase 2: recompute all drivers with calibrated per-user thresholds (if enough history)
  const userThresholds = computeUserThresholds(dailySignals);
  if (userThresholds) {
    for (const day of dailySignals) {
      if (!day.incomplete) {
        day.drivers = computeDriversFromDay(day, userThresholds);
      }
    }
  }

  attachRollingTrends(dailySignals);
  for (let i = 0; i < dailySignals.length; i++) {
    dailySignals[i].recommendations = generateDayRecommendations(dailySignals[i], dailySignals[i - 1] || null, { baseline });
  }

  return { dailySignals, userThresholds };
}

function detectWorkoutRecovery(dailySignals, baseline) {
  const recoveryLags = [];
  for (let i = 0; i < dailySignals.length; i++) {
    const d = dailySignals[i];
    if (d.incomplete || (d.activityLevel !== "workout" && d.activityLevel !== "moderate")) continue;
    let daysToRecover = 0;
    for (let j = i + 1; j < Math.min(i + 7, dailySignals.length); j++) {
      if (dailySignals[j].incomplete) continue;
      if (dailySignals[j].nightMeanHR !== null && dailySignals[j].nightMeanHR <= baseline.restingHR + 2) break;
      daysToRecover++;
    }
    recoveryLags.push(daysToRecover);
  }
  return recoveryLags.length > 0 ? { avg: meanArr(recoveryLags), max: Math.max(...recoveryLags), count: recoveryLags.length } : null;
}

function findPatterns(dailySignals, baseline) {
  const valid = dailySignals.filter(d => !d.incomplete);
  const insights = [];

  // 1. Day-of-week rhythm
  const dayNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const byDow = {};
  for (const d of valid) {
    const dow = (new Date(d.date).getDay() + 6) % 7;
    if (!byDow[dow]) byDow[dow] = [];
    byDow[dow].push(d);
  }
  const dowRecovery = {};
  for (const [dow, ds] of Object.entries(byDow)) {
    dowRecovery[dow] = meanArr(ds.map(d => d.recoveryQuality));
  }
  const bestDow = Object.entries(dowRecovery).sort((a, b) => b[1] - a[1])[0];
  const worstDow = Object.entries(dowRecovery).sort((a, b) => a[1] - b[1])[0];
  if (bestDow && worstDow && bestDow[1] - worstDow[1] > 8) {
    const worstDayName = dayNames[worstDow[0]];
    const prevDayName = dayNames[(parseInt(worstDow[0]) + 6) % 7];
    insights.push({
      type: "weekly_rhythm", title: "Your week has a rhythm",
      detail: `Recovery is strongest on ${dayNames[bestDow[0]]}s (~${Math.round(bestDow[1])}) and weakest on ${worstDayName}s (~${Math.round(worstDow[1])}). That's a ${Math.round(bestDow[1] - worstDow[1])}-point swing.`,
      guidance: `Your ${worstDayName} dip is shaped by what you do on ${prevDayName}. Review your ${prevDayName} habits — late nights, alcohol, heavy training, or skipped wind-down time are the usual culprits. Even shifting one of those by an hour can move the needle.`,
      severity: "info",
    });
  }

  // 2. Weekend vs weekday
  const weekdayDays = valid.filter(d => { const dow = (new Date(d.date).getDay() + 6) % 7; return dow < 5; });
  const weekendDays = valid.filter(d => { const dow = (new Date(d.date).getDay() + 6) % 7; return dow >= 5; });
  if (weekdayDays.length >= 10 && weekendDays.length >= 4) {
    const wdRec = meanArr(weekdayDays.map(d => d.recoveryQuality));
    const weRec = meanArr(weekendDays.map(d => d.recoveryQuality));
    const wdStress = meanArr(weekdayDays.map(d => d.stressSignature));
    const weStress = meanArr(weekendDays.map(d => d.stressSignature));
    if (Math.abs(wdRec - weRec) > 6 || Math.abs(wdStress - weStress) > 6) {
      const betterOnWeekends = weRec > wdRec;
      insights.push({
        type: "weekend_pattern", title: betterOnWeekends ? "Weekends recover what weekdays take" : "Your weekends are harder on your body",
        detail: betterOnWeekends
          ? `Weekend recovery averages ${Math.round(weRec)} vs ${Math.round(wdRec)} on weekdays. Stress drops from ${Math.round(wdStress)} to ${Math.round(weStress)}.`
          : `Weekend recovery (${Math.round(weRec)}) is actually lower than weekdays (${Math.round(wdRec)}). Weekend stress runs at ${Math.round(weStress)} vs ${Math.round(wdStress)}.`,
        guidance: betterOnWeekends
          ? `Your body clearly needs the weekend reset. If your weekday stress stays this high, look for even small recovery windows mid-week — a 20-minute walk, an earlier bedtime on Wednesday, or cutting caffeine after 2pm.`
          : `Weekends are costing you recovery, not building it. Late nights, alcohol, disrupted sleep schedules, or intense social activity are common causes. Try keeping Saturday night sleep within 1 hour of your weekday schedule.`,
        severity: "info",
      });
    }
  }

  // 3. Stress clusters
  const highStressWindows = [];
  let streakStart = -1;
  for (let i = 0; i < valid.length; i++) {
    if (valid[i].stressSignature > 65) {
      if (streakStart === -1) streakStart = i;
    } else {
      if (streakStart !== -1 && i - streakStart >= 3) {
        highStressWindows.push({ start: valid[streakStart].date, end: valid[i - 1].date, days: i - streakStart });
      }
      streakStart = -1;
    }
  }
  if (highStressWindows.length > 0) {
    const longest = highStressWindows.sort((a, b) => b.days - a.days)[0];
    insights.push({
      type: "stress_cluster", title: "Extended stress periods detected",
      detail: `Your longest elevated-stress window ran ${longest.days} days (${fmtDate(longest.start)} → ${fmtDate(longest.end)}). Evening heart rate stayed well above baseline throughout — consistent with accumulated strain.`,
      guidance: `Stress that persists more than 3 days tends to compound. Your body can handle short spikes, but multi-day elevation means recovery is being outpaced. During periods like this, prioritise sleep above everything else — it's the single highest-leverage intervention. Even 30 extra minutes makes a measurable difference in overnight HR.`,
      severity: "warning",
    });
  }

  // 4. Best and worst weeks
  const weeks = [];
  for (let i = 0; i < valid.length; i += 7) {
    const week = valid.slice(i, i + 7);
    if (week.length < 4) continue;
    const avgRec = meanArr(week.map(d => d.recoveryQuality));
    const avgStress = meanArr(week.map(d => d.stressSignature));
    const avgDebt = meanArr(week.map(d => d.recoveryDebt));
    const workouts = week.filter(d => d.activityLevel === "workout" || d.activityLevel === "moderate").length;
    weeks.push({ start: week[0].date, end: week[week.length - 1].date, avgRec, avgStress, avgDebt, workouts, composite: avgRec - avgStress * 0.5 - avgDebt * 0.3 });
  }
  if (weeks.length >= 3) {
    weeks.sort((a, b) => b.composite - a.composite);
    const best = weeks[0];
    const worst = weeks[weeks.length - 1];
    insights.push({
      type: "peak_week", title: "Your best week",
      detail: `The week of ${fmtDate(best.start)}: recovery ${Math.round(best.avgRec)}, stress ${Math.round(best.avgStress)}, debt ${Math.round(best.avgDebt)}${best.workouts > 0 ? `, ${best.workouts} workout${best.workouts > 1 ? 's' : ''}` : ''}.`,
      guidance: `This is your template. Try to recall what was different — sleep schedule, training load, work stress, social commitments. The goal isn't to replicate it perfectly, but to identify which 1-2 factors had the biggest impact and protect those.`,
      severity: "positive",
    });
    insights.push({
      type: "tough_week", title: "Your toughest week",
      detail: `The week of ${fmtDate(worst.start)}: recovery ${Math.round(worst.avgRec)}, stress ${Math.round(worst.avgStress)}, debt ${Math.round(worst.avgDebt)}${worst.workouts > 0 ? `, ${worst.workouts} workout${worst.workouts > 1 ? 's' : ''}` : ''}.`,
      guidance: `When multiple signals deteriorate together like this, it's rarely just one cause. But the recovery action is always the same: reduce discretionary load. Skip the intense workout, go to bed 45 minutes earlier, cut alcohol for the week. Your body is asking for a lighter week.`,
      severity: "warning",
    });
  }

  // 5. Baseline drift
  if (valid.length >= 30) {
    const firstMonth = valid.slice(0, 30).filter(d => d.nightMeanHR !== null);
    const lastMonth = valid.slice(-30).filter(d => d.nightMeanHR !== null);
    if (firstMonth.length > 10 && lastMonth.length > 10) {
      const earlyResting = meanArr(firstMonth.map(d => d.nightMeanHR));
      const lateResting = meanArr(lastMonth.map(d => d.nightMeanHR));
      const drift = lateResting - earlyResting;
      if (Math.abs(drift) >= 2) {
        insights.push({
          type: "baseline_drift",
          title: drift > 0 ? "Your resting HR has crept up" : "Your resting HR has improved",
          detail: drift > 0
            ? `Overnight HR drifted up ~${Math.round(Math.abs(drift))} bpm (from ~${Math.round(earlyResting)} to ~${Math.round(lateResting)}).`
            : `Overnight HR dropped ~${Math.round(Math.abs(drift))} bpm (from ~${Math.round(earlyResting)} to ~${Math.round(lateResting)}).`,
          guidance: drift > 0
            ? `A rising resting HR over weeks usually points to one of: reduced aerobic exercise, accumulated life stress, weight gain, or seasonal shifts. The most direct test is to add 2-3 sessions of easy-pace cardio (walking, cycling, swimming) per week for 3 weeks and see if the trend reverses.`
            : `This is a genuine cardiovascular improvement — your heart is doing the same work with less effort. Whatever you've been doing (more activity, better sleep, less stress), it's working. Keep it up.`,
          severity: drift > 0 ? "warning" : "positive",
        });
      }
    }
  }

  // 6. Workout recovery lag
  // 6. Workout recovery lag — analyze both workout and moderate days
  const workoutDays = valid.filter(d => d.activityLevel === "workout" || d.activityLevel === "moderate");
  if (workoutDays.length >= 3) {
    const nextDayRecovery = [];
    const twoDayRecovery = [];
    for (const wd of workoutDays) {
      const idx = valid.indexOf(wd);
      if (idx < valid.length - 1 && !valid[idx + 1].incomplete) nextDayRecovery.push(valid[idx + 1].recoveryQuality);
      if (idx < valid.length - 2 && !valid[idx + 2].incomplete) twoDayRecovery.push(valid[idx + 2].recoveryQuality);
    }
    if (nextDayRecovery.length >= 3) {
      const overallAvg = meanArr(valid.map(d => d.recoveryQuality));
      const avgNext = meanArr(nextDayRecovery);
      const avgTwo = twoDayRecovery.length >= 3 ? meanArr(twoDayRecovery) : overallAvg;
      const dropNext = overallAvg - avgNext;
      const stillSuppressed = overallAvg - avgTwo > 3;
      if (dropNext > 5) {
        insights.push({
          type: "recovery_lag", title: "How exercise hits your recovery",
          detail: `Next-day recovery drops ~${Math.round(dropNext)} points after workouts (from ~${Math.round(overallAvg)} to ~${Math.round(avgNext)}).${stillSuppressed ? ` It's still suppressed on day 2 (~${Math.round(avgTwo)}), meaning full recovery takes 2+ days.` : ` By day 2, you're back to baseline — your body absorbs the load well.`}`,
          guidance: stillSuppressed
            ? `Two-day suppression suggests you're training near your current recovery ceiling. Consider spacing hard sessions at least 48 hours apart, or alternating intensity (hard/easy/hard). Adding a protein-rich meal within 2 hours post-workout and prioritising 7+ hours of sleep on workout nights can shorten this window.`
            : `Single-day recovery is a healthy pattern — your body handles the training load and bounces back. You have room to maintain or slightly increase intensity if your goals call for it.`,
          severity: stillSuppressed ? "warning" : "info",
        });
      }
    }
  }

  // 7. Consistency analysis — how variable are your signals day to day?
  if (valid.length >= 14) {
    const recStd = stdArr(valid.map(d => d.recoveryQuality));
    const stressStd = stdArr(valid.map(d => d.stressSignature));
    if (recStd > 18 || stressStd > 18) {
      insights.push({
        type: "variability", title: "Your signals are volatile",
        detail: `Recovery varies by ±${Math.round(recStd)} points and stress by ±${Math.round(stressStd)} points day-to-day. That's a lot of swing.`,
        guidance: `High day-to-day variability usually means your routine is inconsistent — different sleep times, erratic training, irregular meal timing, or variable stress. Your body thrives on predictability. The single most effective change is a consistent wake time (±30 minutes), even on weekends. It anchors your circadian rhythm and everything downstream improves.`,
        severity: "info",
      });
    } else if (recStd < 10 && stressStd < 10) {
      insights.push({
        type: "consistency", title: "Remarkably consistent signals",
        detail: `Recovery only varies by ±${Math.round(recStd)} points, stress by ±${Math.round(stressStd)}. Your body is in a stable rhythm.`,
        guidance: `Consistency is the foundation of long-term health. You've built a routine your body responds well to. The main risk is complacency — if all signals are consistently mediocre, stability isn't enough. But if they're consistently good, protect what you're doing.`,
        severity: "positive",
      });
    }
  }

  // 8. Phase 6: ACWR — detect sustained overreach or detraining periods
  const acwrDays = valid.filter(d => d.acwr !== null);
  if (acwrDays.length >= 14) {
    // Overreach: any window of 5+ consecutive days with ACWR > 1.5
    let overreachStreak = 0, overreachPeak = 0, overreachStart = null, longestOverreach = null;
    for (const d of acwrDays) {
      if (d.acwr > 1.5) {
        if (overreachStreak === 0) overreachStart = d.date;
        overreachStreak++;
        overreachPeak = Math.max(overreachPeak, d.acwr);
        if (overreachStreak >= 5 && (!longestOverreach || overreachStreak > longestOverreach.days)) {
          longestOverreach = { start: overreachStart, days: overreachStreak, peak: overreachPeak };
        }
      } else {
        overreachStreak = 0; overreachPeak = 0;
      }
    }
    if (longestOverreach) {
      insights.push({
        type: "acwr_overreach", title: "Training load spiked too fast",
        detail: `Your acute-to-chronic workload ratio (ACWR) exceeded 1.5 for ${longestOverreach.days} consecutive days starting ${fmtDate(longestOverreach.start)} (peak: ${longestOverreach.peak.toFixed(2)}). This is the "danger zone" where injury and burnout risk rises sharply.`,
        guidance: `ACWR > 1.5 means your recent load is 50% higher than your rolling norm — more than your body has been conditioned to handle. In the two weeks following a spike like this, reduce intensity by 20–30%, prioritise sleep, and watch overnight HR for sustained elevation (a reliable early-warning sign of accumulated fatigue).`,
        severity: "warning",
      });
    }

    // Detraining: 14+ days with ACWR < 0.8
    const detrain = acwrDays.filter(d => d.acwr < 0.8);
    if (detrain.length >= 14) {
      const avgDetrain = meanArr(detrain.map(d => d.acwr));
      insights.push({
        type: "acwr_detraining", title: "Extended detraining period",
        detail: `ACWR stayed below 0.8 on ${detrain.length} days (avg ${avgDetrain.toFixed(2)}), meaning recent activity was well below your established baseline. At this level, cardiovascular adaptation begins to reverse.`,
        guidance: `Some detraining is fine — bodies need recovery phases. But if this is unintentional, a gradual ramp-up (no more than 10% weekly TRIMP increase) will rebuild the base without triggering a compensatory overreach.`,
        severity: "info",
      });
    }

    // Sustained sweet spot — positive signal
    const sweetSpot = acwrDays.filter(d => d.acwr >= 0.8 && d.acwr <= 1.3);
    if (sweetSpot.length >= acwrDays.length * 0.65) {
      insights.push({
        type: "acwr_optimal", title: "Training load well-managed",
        detail: `${sweetSpot.length} of ${acwrDays.length} measured days had an ACWR in the 0.8–1.3 sweet spot — the range associated with fitness gains without overreach risk.`,
        guidance: `You're building fitness at a sustainable pace. Keep the weekly load increase under 10% and maintain at least one genuine rest day per week to sustain this balance.`,
        severity: "positive",
      });
    }
  }

  return insights;
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

function getMonthKey(dateStr) { return dateStr.substring(0, 7); }

function fmtMonth(monthKey) {
  const [y, m] = monthKey.split("-");
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return `${months[parseInt(m) - 1]} ${y}`;
}

function generateExportSummary(baseline, dailySignals, patterns, recovery, dataQuality) {
  const valid = dailySignals.filter(d => !d.incomplete);
  const lines = [];
  lines.push("# Heart Rate Coach — Summary Report");
  lines.push(`Generated: ${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}`);
  lines.push("");
  lines.push("## Data Quality");
  lines.push(`- ${dataQuality.totalDays} days in dataset, ${dataQuality.validDays} with sufficient coverage (>=80%)`);
  lines.push(`- ${dataQuality.incompleteDays} days flagged incomplete`);
  lines.push(`- Average daily coverage: ${dataQuality.avgCoverage}%`);
  lines.push("");
  lines.push("## Personal Baseline");
  lines.push(`- Resting HR: ${baseline.restingHR} bpm`);
  lines.push(`- Lowest typical: ${baseline.lowestTypical} bpm`);
  lines.push(`- Overnight variability: +/-${baseline.std} bpm`);
  if (recovery) lines.push(`- Post-workout recovery: ~${recovery.avg.toFixed(1)} days avg (${recovery.count} workouts detected)`);
  lines.push("");
  lines.push("## Key Findings");
  for (const p of patterns) {
    lines.push("");
    lines.push(`### ${p.title}`);
    lines.push(p.detail);
    if (p.guidance) lines.push(`\n> ${p.guidance}`);
  }
  lines.push("");
  lines.push("---");
  lines.push("Note: Consumer wrist HR data is trend-grade, not medical-grade.");
  return lines.join("\n");
}
