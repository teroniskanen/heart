<!-- ── engine ── -->
<script type="text/babel">
// engine.jsx — Heart Rate data engine
function detectFormat(raw) {
  raw = raw.replace(/^﻿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.trim().split("\n").filter(Boolean);
  if (lines.length < 2) return null;

  let sep = "\t";
  const sample = lines.slice(0, 5).join("\n");
  const t = (sample.match(/\t/g) || []).length;
  const c = (sample.match(/,/g) || []).length;
  const s = (sample.match(/;/g) || []).length;
  if (c > t && c >= s) sep = ",";
  else if (s > t && s > c) sep = ";";

  let parsed = 0, skipped = 0;
  const dates = [];
  for (let i = 0; i < lines.length; i++) {
    const p = lines[i].split(sep);
    if (p.length < 3 || isNaN(parseInt(p[2], 10))) { skipped++; continue; }
    parsed++;
    dates.push(p[0]);
  }
  return {
    ok: parsed >= 100,
    parsed, skipped,
    delimiter: sep === "\t" ? "tab" : sep === "," ? "comma" : "semicolon",
    firstDate: dates[0],
    lastDate: dates[dates.length - 1],
  };
}

function meanArr(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0; }
function stdArr(a) {
  if (a.length < 2) return 0;
  const m = meanArr(a);
  return Math.sqrt(meanArr(a.map(v => (v - m) ** 2)));
}
function clampMin(m) { return Math.max(0.5, Math.min(10, m || 1)); }
function getMinutes(r, i) {
  if (!r[i + 1]) return 1;
  return clampMin((r[i + 1].dt - r[i].dt) / 60000);
}
function sumCoveredMinutes(r) {
  let t = 0;
  for (let i = 0; i < r.length; i++) t += getMinutes(r, i);
  return Math.min(1440, Math.round(t));
}
function meanWeighted(r) {
  let s = 0, m = 0;
  for (let i = 0; i < r.length; i++) {
    const min = getMinutes(r, i);
    s += r[i].bpm * min;
    m += min;
  }
  return m ? s / m : meanArr(r.map(x => x.bpm));
}

function parseZeppData(raw) {
  raw = raw.replace(/^﻿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.trim().split("\n").filter(Boolean);
  let sep = "\t";
  const s = lines.slice(0, 5).join("\n");
  if ((s.match(/,/g) || []).length > (s.match(/\t/g) || []).length) sep = ",";
  const out = [];
  for (let l of lines) {
    const p = l.split(sep);
    if (p.length < 3 || isNaN(parseInt(p[2]))) continue;
    let d, m, y;
    if (p[0].includes("-")) [y, m, d] = p[0].split("-").map(Number);
    else [d, m, y] = p[0].split("/").map(Number);
    const [h, mi] = p[1].split(":").map(Number);
    const dt = new Date(y, m - 1, d, h, mi);
    if (isNaN(dt)) continue;
    out.push({
      dt, hour: h, minute: mi, bpm: +p[2],
      dateKey: `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`,
    });
  }
  return out.sort((a, b) => a.dt - b.dt);
}

function groupByDate(r) {
  const d = {};
  r.forEach(x => { (d[x.dateKey] = d[x.dateKey] || []).push(x); });
  return d;
}

function analyze(readings) {
  const days = groupByDate(readings);
  const dateKeys = Object.keys(days).sort();

  const night = [];
  dateKeys.slice(0, 14).forEach(d =>
    days[d].forEach(r => { if (r.hour >= 1 && r.hour <= 5) night.push(r.bpm); })
  );
  const baseline = {
    restingHR: Math.round(meanArr(night.length ? night : readings.map(r => r.bpm))),
    std: Math.round(stdArr(night) * 10) / 10,
  };

  const signals = [];
  let dyn = baseline.restingHR;
  const alpha = 2 / 22;

  for (const d of dateKeys) {
    const r = days[d];
    const covMin = sumCoveredMinutes(r);
    const coverage = Math.round((covMin / 1440) * 100);

    if (covMin < 60) { signals.push({ date: d, incomplete: true, coverage }); continue; }

    const n = r.filter(x => x.hour >= 1 && x.hour <= 5);
    const day = r.filter(x => x.hour >= 8 && x.hour <= 22);

    const nightMean = n.length ? meanWeighted(n) : null;
    const nightStd = n.length ? stdArr(n.map(x => x.bpm)) : null;

    const recovery = nightMean !== null
      ? Math.min(100, Math.max(0, 50 + (dyn - nightMean) * 3 + (10 - nightStd) * 2)) : 50;
    const stress = nightMean !== null
      ? Math.min(100, Math.max(0, 30 + (nightMean - dyn) * 3)) : 50;
    const efficiency = day.length
      ? Math.min(100, Math.max(0, day.filter(x => x.bpm < dyn + 10).length / day.length * 100)) : 50;
    const cv = nightMean ? (nightStd / nightMean) * 100 : null;
    const ans = cv ? Math.min(100, Math.max(0, Math.round(100 - (cv - 2) * 15))) : null;

    const hourly = Array.from({ length: 24 }, () => []);
    r.forEach(x => hourly[x.hour].push(x.bpm));
    const hourlyMean = hourly.map(h => h.length ? Math.round(meanArr(h)) : null);

    const drivers = [];
    if (coverage < 80) drivers.push("low_coverage");
    if (nightMean && nightMean > dyn + 3) drivers.push("elevated_night_hr");
    if (ans !== null && ans < 50) drivers.push("low_ans_stability");
    if (nightMean && nightMean < dyn - 2) drivers.push("good_recovery");
    if (ans !== null && ans > 70) drivers.push("stable_ans");

    signals.push({
      date: d, coverage,
      recovery: Math.round(recovery),
      stress: Math.round(stress),
      efficiency: Math.round(efficiency),
      ans,
      nightMean: nightMean ? Math.round(nightMean) : null,
      drivers, hourlyMean,
    });

    if (nightMean) dyn = nightMean * alpha + dyn * (1 - alpha);
  }

  const months = {};
  signals.forEach(s => {
    const m = s.date.slice(0, 7);
    (months[m] = months[m] || []).push(s);
  });
  const monthKeys = Object.keys(months).sort();

  const reports = {};
  monthKeys.forEach((m, idx) => {
    const v = months[m].filter(x => !x.incomplete);
    if (!v.length) return;

    const avgRec = meanArr(v.map(x => x.recovery));
    const avgStress = meanArr(v.map(x => x.stress));
    const avgEff = meanArr(v.map(x => x.efficiency));
    const avgNight = meanArr(v.filter(x => x.nightMean).map(x => x.nightMean));

    const dCount = {};
    v.forEach(d => (d.drivers || []).forEach(k => dCount[k] = (dCount[k] || 0) + 1));

    let comparison = null;
    if (idx > 0) {
      const pm = monthKeys[idx - 1];
      const pv = months[pm].filter(x => !x.incomplete);
      if (pv.length) {
        const pRec = meanArr(pv.map(x => x.recovery));
        const pStress = meanArr(pv.map(x => x.stress));
        comparison = {
          prevMonth: pm,
          recovery: Math.round(avgRec - pRec),
          stress: Math.round(avgStress - pStress),
        };
      }
    }

    let focus = "You're on track — keep the rhythm you've built.";
    let focusTitle = "Stay the course";
    if ((dCount.elevated_night_hr || 0) > 4) {
      focusTitle = "Prioritize sleep";
      focus = "Your nights are running hot. Cut caffeine after 2pm and dim lights by 9pm this week.";
    } else if ((dCount.low_ans_stability || 0) > 4) {
      focusTitle = "Anchor your schedule";
      focus = "Your nervous system wants predictability. Lock in a consistent wake time — even on weekends.";
    } else if ((dCount.good_recovery || 0) > 8) {
      focusTitle = "Push a little";
      focus = "Recovery is strong. This is the week to add intensity — your body can take more.";
    }

    reports[m] = {
      avgRec: Math.round(avgRec),
      avgStress: Math.round(avgStress),
      avgEff: Math.round(avgEff),
      avgNight: Math.round(avgNight),
      drivers: dCount,
      comparison,
      focus, focusTitle,
    };
  });

  return { baseline, signals, months, monthKeys, reports };
}

Object.assign(window, {
  detectFormat, parseZeppData, analyze, meanArr, stdArr, groupByDate,
});
</script>

<!-- ── mockdata ── -->
<script type="text/babel">
// mockdata.jsx — Generates realistic mock Zepp data for demo mode
function generateMockZepp(months = 4) {
  const rows = [];
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - months + 1, 1);

  for (let dayOffset = 0; dayOffset < months * 30; dayOffset++) {
    const d = new Date(start);
    d.setDate(d.getDate() + dayOffset);
    if (d > now) break;

    const monthIdx = Math.floor(dayOffset / 30);
    const stressFactor = monthIdx === 1 ? 1.15 : monthIdx === 2 ? 0.92 : 1.0;
    const dow = d.getDay();
    const weekend = (dow === 0 || dow === 6);

    const baseRest = 58 + (monthIdx === 1 ? 4 : monthIdx === 2 ? -2 : 0) + Math.sin(dayOffset / 10) * 2;
    const dayNoise = (Math.random() - 0.5) * 3;

    for (let min = 0; min < 1440; min += 5) {
      if (Math.random() < 0.03) continue;

      const h = Math.floor(min / 60);
      const m = min % 60;
      let bpm;

      if (h >= 0 && h < 6) {
        bpm = baseRest + dayNoise + Math.sin(min / 120) * 2 + (Math.random() - 0.5) * 3;
        bpm *= stressFactor;
      } else if (h >= 6 && h < 8) {
        bpm = baseRest + 8 + Math.random() * 10;
      } else if (h >= 8 && h < 12) {
        bpm = baseRest + 4 + Math.random() * 12 + (weekend ? -3 : 0);
        if (h === 7 && Math.random() < 0.4 && !weekend) bpm = 120 + Math.random() * 30;
      } else if (h >= 12 && h < 18) {
        const active = Math.random() < 0.18;
        bpm = active
          ? baseRest + 18 + Math.random() * 22 * stressFactor
          : baseRest + 2 + Math.random() * 10 * stressFactor;
      } else if (h >= 18 && h < 22) {
        bpm = baseRest + 6 + Math.random() * 12;
        if (h === 18 && Math.random() < 0.3) bpm = 130 + Math.random() * 35;
      } else {
        bpm = baseRest + 12 + Math.random() * 6;
      }

      bpm = Math.max(42, Math.min(180, Math.round(bpm)));

      const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const timeStr = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
      rows.push(`${dateStr}\t${timeStr}\t${bpm}`);
    }
  }

  return rows.join("\n");
}

window.generateMockZepp = generateMockZepp;
</script>

<!-- ── charts ── -->
<script type="text/babel">
// charts.jsx — Editorial SVG charts
const CHART_C = {
  ink: "#2a2620",
  soft: "#6a6055",
  faint: "#a09888",
  hair: "#e8e2d8",
  paper: "#f9f6f0",
  card: "#ffffff",
  warm: "#b85c3c",
  calm: "#5a7a5a",
  accent: "#8a7a5a",
  gold: "#c9a961",
};

function MonthRecoveryChart({ days, height = 180 }) {
  const width = 380;
  const pad = { t: 24, r: 16, b: 28, l: 16 };
  const w = width - pad.l - pad.r;
  const h = height - pad.t - pad.b;

  if (!days || !days.length) return null;

  const n = days.length;
  const xFor = i => pad.l + (n > 1 ? (i / (n - 1)) * w : w / 2);
  const yFor = v => pad.t + h - (v / 100) * h;

  const recPath = days.map((d, i) => `${i === 0 ? "M" : "L"}${xFor(i)},${yFor(d.recovery)}`).join(" ");
  const recArea = `${recPath} L${xFor(n - 1)},${pad.t + h} L${xFor(0)},${pad.t + h} Z`;
  const strPath = days.map((d, i) => `${i === 0 ? "M" : "L"}${xFor(i)},${yFor(d.stress)}`).join(" ");

  const weekTicks = [];
  days.forEach((d, i) => {
    const dt = new Date(d.date);
    if (dt.getDay() === 1) weekTicks.push({ i, label: dt.getDate() });
  });

  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" style={{ display: "block" }}>
      <line x1={pad.l} x2={pad.l + w} y1={yFor(50)} y2={yFor(50)}
        stroke={CHART_C.hair} strokeDasharray="2 4" />
      <text x={pad.l + w} y={yFor(50) - 4} fontSize="9" fill={CHART_C.faint}
        textAnchor="end" fontFamily="DM Sans">50</text>

      <path d={recArea} fill={CHART_C.calm} opacity="0.12" />
      <path d={recPath} stroke={CHART_C.calm} strokeWidth="1.5" fill="none"
        strokeLinejoin="round" strokeLinecap="round" />

      <path d={strPath} stroke={CHART_C.warm} strokeWidth="1.2" fill="none"
        strokeDasharray="3 2" strokeLinejoin="round" />

      {days.map((d, i) => (
        <circle key={i} cx={xFor(i)} cy={yFor(d.recovery)} r="2.2"
          fill={CHART_C.paper} stroke={CHART_C.calm} strokeWidth="1.2" />
      ))}

      {weekTicks.map((t, k) => (
        <g key={k}>
          <line x1={xFor(t.i)} x2={xFor(t.i)} y1={pad.t + h} y2={pad.t + h + 3}
            stroke={CHART_C.faint} />
          <text x={xFor(t.i)} y={pad.t + h + 16} fontSize="10" fill={CHART_C.soft}
            textAnchor="middle" fontFamily="DM Sans">{t.label}</text>
        </g>
      ))}

      <g transform={`translate(${pad.l}, 10)`}>
        <circle cx="4" cy="4" r="3" fill={CHART_C.calm} />
        <text x="12" y="7" fontSize="10" fill={CHART_C.soft} fontFamily="DM Sans">Recovery</text>
        <line x1="72" x2="84" y1="4" y2="4" stroke={CHART_C.warm} strokeWidth="1.2" strokeDasharray="3 2" />
        <text x="90" y="7" fontSize="10" fill={CHART_C.soft} fontFamily="DM Sans">Stress</text>
      </g>
    </svg>
  );
}

function MiniSpark({ values, width = 52, height = 18, color = CHART_C.ink }) {
  const vals = values.filter(v => v != null);
  if (vals.length < 2) return null;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const xStep = width / (vals.length - 1);
  const path = vals.map((v, i) => `${i === 0 ? "M" : "L"}${i * xStep},${height - ((v - min) / range) * height}`).join(" ");
  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <path d={path} stroke={color} strokeWidth="1" fill="none" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

function TrendsChart({ monthKeys, reports, metric = "recovery", height = 260 }) {
  const width = 380;
  const pad = { t: 30, r: 16, b: 36, l: 32 };
  const w = width - pad.l - pad.r;
  const h = height - pad.t - pad.b;

  const pts = monthKeys.map(m => {
    const r = reports[m];
    if (!r) return null;
    const v = metric === "recovery" ? r.avgRec
            : metric === "stress" ? r.avgStress
            : metric === "efficiency" ? r.avgEff
            : r.avgNight;
    return { m, v };
  }).filter(Boolean);

  if (pts.length < 1) return null;

  const color = metric === "recovery" ? CHART_C.calm
              : metric === "stress" ? CHART_C.warm
              : metric === "efficiency" ? CHART_C.gold
              : CHART_C.accent;

  let yMin = 0, yMax = 100;
  if (metric === "nightHR") {
    const vals = pts.map(p => p.v);
    yMin = Math.min(...vals) - 4;
    yMax = Math.max(...vals) + 4;
  }
  const yFor = v => pad.t + h - ((v - yMin) / (yMax - yMin)) * h;
  const xFor = i => pad.l + (pts.length > 1 ? (i / (pts.length - 1)) * w : w / 2);

  const path = pts.map((p, i) => `${i === 0 ? "M" : "L"}${xFor(i)},${yFor(p.v)}`).join(" ");
  const area = `${path} L${xFor(pts.length - 1)},${pad.t + h} L${xFor(0)},${pad.t + h} Z`;

  const gridLines = metric === "nightHR"
    ? [yMin, (yMin + yMax) / 2, yMax].map(v => Math.round(v))
    : [0, 50, 100];

  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" style={{ display: "block" }}>
      {gridLines.map((gv, i) => (
        <g key={i}>
          <line x1={pad.l} x2={pad.l + w} y1={yFor(gv)} y2={yFor(gv)}
            stroke={CHART_C.hair} strokeDasharray={i === 1 ? "2 4" : "0"} />
          <text x={pad.l - 6} y={yFor(gv) + 3} fontSize="10" fill={CHART_C.faint}
            textAnchor="end" fontFamily="DM Sans">{gv}</text>
        </g>
      ))}

      <path d={area} fill={color} opacity="0.14" />
      <path d={path} stroke={color} strokeWidth="1.8" fill="none"
        strokeLinejoin="round" strokeLinecap="round" />

      {pts.map((p, i) => (
        <g key={i}>
          <circle cx={xFor(i)} cy={yFor(p.v)} r="3.5" fill={CHART_C.paper}
            stroke={color} strokeWidth="1.8" />
          <text x={xFor(i)} y={yFor(p.v) - 10} fontSize="11" fill={CHART_C.ink}
            textAnchor="middle" fontFamily="Instrument Serif">{Math.round(p.v)}</text>
        </g>
      ))}

      {pts.map((p, i) => {
        const [y, mo] = p.m.split("-");
        const label = new Date(+y, +mo - 1, 1).toLocaleDateString("en-GB", { month: "short" });
        return (
          <text key={i} x={xFor(i)} y={pad.t + h + 18} fontSize="11"
            fill={CHART_C.soft} textAnchor="middle" fontFamily="DM Sans">{label}</text>
        );
      })}
    </svg>
  );
}

function DayRibbon({ hourly, width = 120, height = 22, baseline = 60 }) {
  if (!hourly) return null;
  const filled = hourly.map(v => v == null ? baseline : v);
  const min = Math.min(...filled, baseline - 5);
  const max = Math.max(...filled, baseline + 30);
  const range = max - min || 1;
  const xStep = width / 23;
  const yFor = v => height - ((v - min) / range) * height;

  const path = filled.map((v, i) => `${i === 0 ? "M" : "L"}${i * xStep},${yFor(v)}`).join(" ");
  const area = `${path} L${width},${height} L0,${height} Z`;
  const baselineY = yFor(baseline);

  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <path d={area} fill={CHART_C.accent} opacity="0.14" />
      <line x1="0" x2={width} y1={baselineY} y2={baselineY}
        stroke={CHART_C.faint} strokeDasharray="1 2" />
      <path d={path} stroke={CHART_C.ink} strokeWidth="1" fill="none"
        strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

Object.assign(window, { MonthRecoveryChart, MiniSpark, TrendsChart, DayRibbon, CHART_C });
</script>

<script type="text/babel">
// android-frame.jsx — Android device frame
const MD_C = {
  surface: '#f4fbf8',
  surfaceVariant: '#dae5e1',
  inverseOnSurface: '#ecf2ef',
  secondaryContainer: '#cde8e1',
  primaryFixedDim: '#83d5c6',
  onSurface: '#171d1b',
  onSurfaceVar: '#49454f',
  onPrimaryContainer: '#00201c',
  primary: '#006a60',
  frameBorder: 'rgba(116,119,117,0.5)',
};

function AndroidStatusBar({ dark = false }) {
  const c = dark ? '#fff' : MD_C.onSurface;
  return (
    <div style={{
      height: 40, display: 'flex', alignItems: 'center',
      justifyContent: 'space-between', padding: '0 16px',
      position: 'relative',
      fontFamily: 'Roboto, system-ui, sans-serif',
    }}>
      <div style={{ width: 128, display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ fontSize: 14, fontWeight: 400, letterSpacing: 0.25, lineHeight: '20px', color: c }}>9:30</span>
      </div>
      <div style={{
        position: 'absolute', left: '50%', top: 8, transform: 'translateX(-50%)',
        width: 24, height: 24, borderRadius: 100, background: '#2e2e2e',
      }} />
      <div style={{ display: 'flex', alignItems: 'center' }}>
        <div style={{ display: 'flex', paddingRight: 2 }}>
          <svg width="16" height="16" viewBox="0 0 16 16" style={{ marginRight: -2 }}>
            <path d="M8 13.3L.67 5.97a10.37 10.37 0 0114.66 0L8 13.3z" fill={c}/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 16 16" style={{ marginRight: -2 }}>
            <path d="M14.67 14.67V1.33L1.33 14.67h13.34z" fill={c}/>
          </svg>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16">
          <rect x="3.75" y="2" width="8.5" height="13" rx="1.5" fill={c}/>
          <rect x="5.5" y="0.9" width="5" height="2" rx="0.5" fill={c}/>
        </svg>
      </div>
    </div>
  );
}

function AndroidAppBar({ title = 'Title', large = false }) {
  const iconDot = (
    <div style={{
      width: 48, height: 48, display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div style={{ width: 22, height: 22, borderRadius: '50%', background: MD_C.onSurfaceVar, opacity: 0.3 }} />
    </div>

  return (
    <div style={{ background: MD_C.surface, padding: '4px 4px 0' }}>
      <div style={{ height: 56, display: 'flex', alignItems: 'center', gap: 4 }}>
        {iconDot}
        {!large && (
          <span style={{
            flex: 1, fontSize: 22, fontWeight: 400, color: MD_C.onSurface,
            fontFamily: 'Roboto, system-ui, sans-serif',
          }}>{title}</span>
        )}
        {large && <div style={{ flex: 1 }} />}
        {iconDot}
      </div>
      {large && (
        <div style={{
          padding: '16px 16px 20px',
          fontSize: 28, fontWeight: 400, color: MD_C.onSurface,
          fontFamily: 'Roboto, system-ui, sans-serif',
        }}>{title}</div>
      )}
    </div>
  );
}

function AndroidListItem({ headline, supporting, leading }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 16,
      padding: '12px 16px', minHeight: 56, boxSizing: 'border-box',
      fontFamily: 'Roboto, system-ui, sans-serif',
    }}>
      {leading && (
        <div style={{
          width: 40, height: 40, borderRadius: '50%',
          background: MD_C.primary, color: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 18, fontWeight: 500, flexShrink: 0,
        }}>{leading}</div>
      )}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 16, color: MD_C.onSurface, lineHeight: '24px' }}>{headline}</div>
        {supporting && (
          <div style={{ fontSize: 14, color: MD_C.onSurfaceVar, lineHeight: '20px' }}>{supporting}</div>
        )}
      </div>

  );
}

function AndroidNavBar({ dark = false }) {
  return (
    <div style={{
      height: 24, display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div style={{
        width: 108, height: 4, borderRadius: 2,
        background: dark ? '#fff' : MD_C.onSurface, opacity: 0.4,
      }} />
    </div>

}

function AndroidDevice({
  children, width = 412, height = 892, dark = false,
  title, large = false, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 18, overflow: 'hidden',
      background: dark ? '#1d1b20' : MD_C.surface,
      border: `8px solid ${MD_C.frameBorder}`,

      {title !== undefined && <AndroidAppBar title={title} large={large} />}

}

Object.assign(window, {
  AndroidDevice, AndroidStatusBar, AndroidAppBar, AndroidListItem, AndroidNavBar,
});

<!-- ── screens ── -->
<script type="text/babel">
// screens.jsx — Import, Monthly, Trends screens
const { useState, useEffect, useRef } = React;

const S = {
  paper: "#f9f6f0",
  card: "#ffffff",
  ink: "#2a2620",
  soft: "#6a6055",
  faint: "#a09888",
  hair: "#e8e2d8",
  warm: "#b85c3c",
  calm: "#5a7a5a",
  gold: "#c9a961",
  serif: `"Instrument Serif", Georgia, serif`,
  sans: `"DM Sans", system-ui, sans-serif`,
};

function ImportScreen({ onComplete }) {
  const [raw, setRaw] = useState("");
  const [preview, setPreview] = useState(null);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const doPreview = (text) => {
    const t = text ?? raw;
    const p = window.detectFormat(t);
    if (!p || !p.ok) {
      setError("Need at least 100 valid readings to analyze.");
      setPreview(null);
      return;
    }
    setPreview(p); setError("");
  };

  const loadDemo = () => {
    setLoading(true);
    setTimeout(() => {
      const mock = window.generateMockZepp(4);
      setRaw(mock);
      doPreview(mock);
      setLoading(false);
    }, 50);
  };

  const runAnalysis = () => {
    setLoading(true);
    setTimeout(() => {
      const data = window.parseZeppData(raw);
      onComplete(data);
    }, 300);
  };

  return (
    <div style={{
      height: "100%", background: S.paper, overflowY: "auto",
      fontFamily: S.sans, color: S.ink,
    }}>
      <div style={{ padding: "32px 24px 48px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 28 }}>
          <svg width="22" height="22" viewBox="0 0 22 22">
            <path d="M11 18.5 S3 13 3 8 a4 4 0 0 1 8 -1 a4 4 0 0 1 8 1 c0 5 -8 10.5 -8 10.5z"
              fill="none" stroke={S.ink} strokeWidth="1.4" strokeLinejoin="round"/>
          </svg>
          <span style={{ fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", color: S.soft }}>
            Heart Rate Coach
          </span>
        </div>

        <h1 style={{
          fontFamily: S.serif, fontSize: 38, lineHeight: 1.05, fontWeight: 400,
          letterSpacing: "-0.01em", marginBottom: 14,
        }}>
          Your heart,<br/><em style={{ color: S.warm }}>listened to.</em>
        </h1>
        <p style={{ color: S.soft, fontSize: 15, lineHeight: 1.55, marginBottom: 28, maxWidth: 320 }}>
          Paste your Zepp heart-rate export and we'll surface what your body is telling you — day by day, month by month.
        </p>

        <button onClick={loadDemo} disabled={loading}
          style={{
            width: "100%", padding: "14px 16px", marginBottom: 10,
            background: S.ink, color: S.paper, border: "none", borderRadius: 10,
            fontFamily: S.sans, fontSize: 14, fontWeight: 500, letterSpacing: 0.2,
            cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          }}>
          <span style={{ opacity: 0.6 }}>✧</span>
          {loading ? "Preparing…" : "Try with demo data"}
        </button>

        <div style={{
          display: "flex", alignItems: "center", gap: 10,
          fontSize: 11, color: S.faint, textTransform: "uppercase",
          letterSpacing: 1.2, margin: "18px 0 14px",
        }}>
          <div style={{ flex: 1, height: 1, background: S.hair }}/>
          <span>or paste your own</span>
          <div style={{ flex: 1, height: 1, background: S.hair }}/>
        </div>

        <textarea
          value={raw}
          onChange={e => { setRaw(e.target.value); setPreview(null); setError(""); }}
          placeholder={"2026-03-01\t07:42\t68\n2026-03-01\t07:47\t71\n…"}
          style={{
            width: "100%", minHeight: 110, padding: 14,
            fontFamily: "ui-monospace, SFMono-Regular, monospace",
            fontSize: 12, lineHeight: 1.5,
            background: S.card, color: S.ink,
            border: `1px solid ${S.hair}`, borderRadius: 10, resize: "vertical",
            outline: "none",
          }}
        />

        {error && (
          <div style={{ color: S.warm, marginTop: 10, fontSize: 13 }}>{error}</div>
        )}

        {!preview && raw && (
          <button onClick={() => doPreview()}
            style={{
              marginTop: 12, width: "100%", padding: "12px 16px",
              background: S.card, color: S.ink, border: `1px solid ${S.ink}`,
              borderRadius: 10, fontFamily: S.sans, fontSize: 14, fontWeight: 500,
              cursor: "pointer",
            }}>
            Preview import
          </button>
        )}

        {preview && (
          <div style={{
            marginTop: 16, padding: 18, background: S.card,
            border: `1px solid ${S.hair}`, borderRadius: 10,
          }}>
            <div style={{ fontSize: 11, letterSpacing: 1.2, textTransform: "uppercase",
              color: S.faint, marginBottom: 10 }}>Ready to analyze</div>
            <div style={{
              fontFamily: S.serif, fontSize: 32, lineHeight: 1, marginBottom: 6,
            }}>{preview.parsed.toLocaleString()}</div>
            <div style={{ fontSize: 13, color: S.soft, marginBottom: 14 }}>
              readings parsed, {preview.firstDate} → {preview.lastDate}
            </div>
            <button onClick={runAnalysis} disabled={loading}
              style={{
                width: "100%", padding: "12px 16px",
                background: S.warm, color: S.paper, border: "none", borderRadius: 10,
                fontFamily: S.sans, fontSize: 14, fontWeight: 500,
                cursor: "pointer",
              }}>
              {loading ? "Analyzing…" : "Run analysis →"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function Header({ tab, onTab, monthLabel, onReset }) {
  return (
    <div style={{
      background: S.paper, padding: "16px 20px 0",
      borderBottom: `1px solid ${S.hair}`,
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <svg width="16" height="16" viewBox="0 0 22 22">
            <path d="M11 18.5 S3 13 3 8 a4 4 0 0 1 8 -1 a4 4 0 0 1 8 1 c0 5 -8 10.5 -8 10.5z"
              fill={S.warm} stroke={S.warm} strokeWidth="1" strokeLinejoin="round"/>
          </svg>
          <span style={{ fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", color: S.soft }}>
            {monthLabel}
          </span>
        </div>
        <button onClick={onReset} style={{
          background: "none", border: "none", color: S.faint,
          fontSize: 11, cursor: "pointer", letterSpacing: 0.5,
          fontFamily: S.sans,
        }}>Reset</button>
      </div>
      <div style={{ display: "flex", gap: 24 }}>
        {["Month", "Trends"].map(t => (
          <button key={t} onClick={() => onTab(t.toLowerCase())}
            style={{
              background: "none", border: "none", padding: "8px 0 14px",
              borderBottom: tab === t.toLowerCase() ? `2px solid ${S.ink}` : "2px solid transparent",
              color: tab === t.toLowerCase() ? S.ink : S.faint,
              fontFamily: S.sans, fontSize: 14, fontWeight: 500, cursor: "pointer",
              letterSpacing: 0.2,
            }}>{t}</button>
        ))}
      </div>
    </div>
  );
}

function MonthScreen({ analysis, selectedMonth, setSelectedMonth }) {
  const { months, monthKeys, reports, baseline } = analysis;
  const validMonthKeys = monthKeys.filter(mk => reports[mk]);
  const report = reports[selectedMonth];

  if (!report) {
    return (
      <div style={{ padding: 32, color: S.soft, fontFamily: S.sans, textAlign: "center" }}>
        <div style={{ fontFamily: S.serif, fontSize: 24, marginBottom: 10, color: S.ink }}>
          Not enough data
        </div>
        <p style={{ fontSize: 13, lineHeight: 1.55, marginBottom: 20 }}>
          {selectedMonth} has no complete days. Pick another month below.
        </p>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center" }}>
          {validMonthKeys.map(mk => (
            <button key={mk} onClick={() => setSelectedMonth(mk)} style={{
              padding: "8px 14px", borderRadius: 999, border: `1px solid ${S.hair}`,
              background: "transparent", color: S.ink, cursor: "pointer",
              fontFamily: S.sans, fontSize: 12,
            }}>{mk}</button>
          ))}
        </div>
      </div>
    );
  }

  const days = (months[selectedMonth] || []).filter(d => !d.incomplete);
  const [y, m] = selectedMonth.split("-");
  const monthName = new Date(+y, +m - 1, 1).toLocaleDateString("en-GB",
    { month: "long", year: "numeric" });

  const driverMap = {
    elevated_night_hr: { label: "elevated nights", tone: "warm" },
    low_ans_stability: { label: "variable HRV", tone: "warm" },
    good_recovery: { label: "deep recovery", tone: "calm" },
    stable_ans: { label: "steady nervous system", tone: "calm" },
    low_coverage: { label: "incomplete data", tone: "faint" },
  };
  const topDrivers = Object.entries(report.drivers || {})
    .sort((a, b) => b[1] - a[1]).slice(0, 3);

  const cmp = report.comparison;

  return (
    <div style={{ padding: "20px 20px 40px" }}>
      <div style={{
        display: "flex", gap: 8, overflowX: "auto", marginBottom: 20,
        scrollbarWidth: "none", paddingBottom: 2,
      }}>
        {validMonthKeys.map(mk => {
          const [yk, mk2] = mk.split("-");
          const short = new Date(+yk, +mk2 - 1, 1).toLocaleDateString("en-GB", { month: "short" });
          const isSel = mk === selectedMonth;
          return (
            <button key={mk} onClick={() => setSelectedMonth(mk)}
              style={{
                padding: "8px 14px", borderRadius: 999, flexShrink: 0,
                border: `1px solid ${isSel ? S.ink : S.hair}`,
                background: isSel ? S.ink : "transparent",
                color: isSel ? S.paper : S.soft,
                fontFamily: S.sans, fontSize: 12, fontWeight: 500,
                cursor: "pointer", letterSpacing: 0.3,
              }}>{short} '{yk.slice(2)}</button>
          );
        })}
      </div>

      <h1 style={{
        fontFamily: S.serif, fontSize: 36, lineHeight: 1.05, fontWeight: 400,
        letterSpacing: "-0.01em", marginBottom: 6,
      }}>
        {monthName.split(" ")[0]}<br/>
        <span style={{ color: S.soft, fontSize: 22 }}>{monthName.split(" ")[1]}</span>
      </h1>
      <p style={{ color: S.soft, fontSize: 13, marginBottom: 22 }}>
        {days.length} complete days · resting {baseline.restingHR} bpm
      </p>

      <div style={{
        background: S.ink, color: S.paper, borderRadius: 14,
        padding: "22px 22px 24px", marginBottom: 20, position: "relative",
        overflow: "hidden",
      }}>
        <div style={{
          position: "absolute", right: -20, top: -20, width: 120, height: 120,
          borderRadius: "50%", background: S.warm, opacity: 0.18,
        }}/>
        <div style={{
          fontSize: 10, letterSpacing: 1.8, textTransform: "uppercase",
          color: "rgba(249,246,240,0.55)", marginBottom: 14,
        }}>This week's focus</div>
        <div style={{
          fontFamily: S.serif, fontSize: 24, lineHeight: 1.15, marginBottom: 10,
        }}>{report.focusTitle}</div>
        <p style={{ fontSize: 14, lineHeight: 1.55, color: "rgba(249,246,240,0.82)",
          position: "relative", zIndex: 1 }}>
          {report.focus}
        </p>
      </div>

      <div style={{
        background: S.card, borderRadius: 14, padding: "18px 14px 14px",
        border: `1px solid ${S.hair}`, marginBottom: 16,
      }}>
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "baseline",
          padding: "0 6px 4px",
        }}>
          <div style={{ fontSize: 11, letterSpacing: 1.3, textTransform: "uppercase", color: S.faint }}>
            Month at a glance
          </div>
          {cmp && (
            <div style={{ fontSize: 11, color: S.soft }}>vs last month</div>
          )}
        </div>
        <window.MonthRecoveryChart days={days} />
      </div>

      <div style={{
        display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10, marginBottom: 20,
      }}>
        <BigStat label="Recovery" value={report.avgRec} delta={cmp?.recovery} positiveUp />
        <BigStat label="Stress" value={report.avgStress} delta={cmp?.stress} positiveUp={false} />
        <BigStat label="Efficiency" value={report.avgEff} />
      </div>

      {topDrivers.length > 0 && (
        <div style={{ marginBottom: 24 }}>
          <div style={{
            fontSize: 11, letterSpacing: 1.3, textTransform: "uppercase",
            color: S.faint, marginBottom: 10,
          }}>What's driving this</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {topDrivers.map(([k, n]) => {
              const d = driverMap[k] || { label: k, tone: "faint" };
              const color = d.tone === "warm" ? S.warm : d.tone === "calm" ? S.calm : S.faint;
              return (
                <div key={k} style={{
                  padding: "6px 12px", borderRadius: 999,
                  background: `${color}14`, color: color,
                  fontSize: 12, fontWeight: 500,
                  display: "flex", gap: 6, alignItems: "center",
                }}>
                  <span>{d.label}</span>
                  <span style={{ opacity: 0.6, fontSize: 11 }}>{n} days</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div>
        <div style={{
          fontSize: 11, letterSpacing: 1.3, textTransform: "uppercase",
          color: S.faint, marginBottom: 10,
        }}>Daily log</div>
        <div style={{
          background: S.card, borderRadius: 14, border: `1px solid ${S.hair}`,
          overflow: "hidden",
        }}>
          {days.map((d, i) => <DayRow key={i} d={d} last={i === days.length - 1} baseline={baseline.restingHR}/>)}
        </div>
      </div>
    </div>
  );
}

function BigStat({ label, value, delta, positiveUp = true }) {
  const hasDelta = delta !== undefined && delta !== null;
  const good = hasDelta && (positiveUp ? delta >= 0 : delta <= 0);
  const deltaColor = !hasDelta ? S.faint : good ? S.calm : S.warm;
  const arrow = !hasDelta ? "" : delta > 0 ? "↑" : delta < 0 ? "↓" : "·";
  return (
    <div style={{
      background: S.card, border: `1px solid ${S.hair}`,
      borderRadius: 12, padding: "14px 12px", textAlign: "center",
    }}>
      <div style={{ fontFamily: S.serif, fontSize: 30, lineHeight: 1 }}>{Math.round(value)}</div>
      <div style={{ fontSize: 11, color: S.soft, marginTop: 4, letterSpacing: 0.3 }}>{label}</div>
      {hasDelta && (
        <div style={{ fontSize: 10, color: deltaColor, marginTop: 4, fontWeight: 500 }}>
          {arrow} {Math.abs(delta)}
        </div>
      )}
    </div>
  );
}

function DayRow({ d, last, baseline }) {
  const dt = new Date(d.date);
  const dow = dt.toLocaleDateString("en-GB", { weekday: "short" }).toUpperCase();
  const num = dt.getDate();
  const dotColor = d.recovery >= 65 ? S.calm : d.recovery >= 45 ? S.gold : S.warm;

  return (
    <div style={{
      display: "grid", gridTemplateColumns: "44px 1fr auto",
      gap: 12, padding: "12px 14px",
      borderBottom: last ? "none" : `1px solid ${S.hair}`,
      alignItems: "center",
    }}>
      <div>
        <div style={{ fontSize: 10, color: S.faint, letterSpacing: 0.5 }}>{dow}</div>
        <div style={{ fontFamily: S.serif, fontSize: 22, lineHeight: 1 }}>{num}</div>
      </div>
      <div style={{ minWidth: 0 }}>
        <window.DayRibbon hourly={d.hourlyMean} baseline={baseline} width={160} height={22} />
        <div style={{ display: "flex", gap: 10, marginTop: 4, fontSize: 11, color: S.soft }}>
          <span>Rec <b style={{ color: S.ink, fontWeight: 500 }}>{d.recovery}</b></span>
          <span>Str <b style={{ color: S.ink, fontWeight: 500 }}>{d.stress}</b></span>
          {d.nightMean && <span>Night <b style={{ color: S.ink, fontWeight: 500 }}>{d.nightMean}</b></span>}
        </div>
      </div>
      <div style={{
        width: 8, height: 8, borderRadius: "50%", background: dotColor,
      }}/>
    </div>
  );
}

function TrendsScreen({ analysis }) {
  const { monthKeys, reports, baseline } = analysis;
  const [metric, setMetric] = useState("recovery");

  const metrics = [
    { key: "recovery", label: "Recovery", color: S.calm, desc: "How well your nights restore you." },
    { key: "stress", label: "Stress", color: S.warm, desc: "How hard your system is working." },
    { key: "efficiency", label: "Efficiency", color: S.gold, desc: "Time spent near resting in the day." },
    { key: "nightHR", label: "Night HR", color: S.soft, desc: "Average sleeping heart rate." },
  ];
  const active = metrics.find(m => m.key === metric);

  const valid = monthKeys.filter(m => reports[m]);
  let narrative = null;
  if (valid.length >= 2) {
    const first = reports[valid[0]];
    const last = reports[valid[valid.length - 1]];
    const pick = (r) => metric === "recovery" ? r.avgRec
      : metric === "stress" ? r.avgStress
      : metric === "efficiency" ? r.avgEff : r.avgNight;
    const d = Math.round(pick(last) - pick(first));
    narrative = { d, first: valid[0], last: valid[valid.length - 1] };
  }

  const trendVerdict = (() => {
    if (!narrative) return null;
    const { d } = narrative;
    const goodUp = metric === "recovery" || metric === "efficiency";
    const goodDown = metric === "stress" || metric === "nightHR";
    if (Math.abs(d) < 3) return { label: "holding steady", tone: "soft" };
    if ((goodUp && d > 0) || (goodDown && d < 0)) return { label: "trending up", tone: "calm" };
    return { label: "trending down", tone: "warm" };
  })();

  return (
    <div style={{ padding: "20px 20px 40px" }}>
      <h1 style={{
        fontFamily: S.serif, fontSize: 36, lineHeight: 1.05, fontWeight: 400,
        letterSpacing: "-0.01em", marginBottom: 6,
      }}>Trends</h1>
      <p style={{ color: S.soft, fontSize: 13, marginBottom: 22 }}>
        {valid.length} months · since {valid[0] || "—"}
      </p>

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 18 }}>
        {metrics.map(mt => {
          const isSel = mt.key === metric;
          return (
            <button key={mt.key} onClick={() => setMetric(mt.key)}
              style={{
                padding: "8px 14px", borderRadius: 999,
                border: `1px solid ${isSel ? mt.color : S.hair}`,
                background: isSel ? `${mt.color}18` : "transparent",
                color: isSel ? mt.color : S.soft,
                fontFamily: S.sans, fontSize: 12, fontWeight: 500, cursor: "pointer",
              }}>{mt.label}</button>
          );
        })}
      </div>

      <div style={{
        background: S.card, borderRadius: 14, padding: "20px 14px 14px",
        border: `1px solid ${S.hair}`, marginBottom: 16,
      }}>
        <div style={{ padding: "0 6px 8px" }}>
          <div style={{ fontFamily: S.serif, fontSize: 24, color: active.color }}>
            {active.label}
          </div>
          <div style={{ fontSize: 12, color: S.soft, marginTop: 2 }}>
            {active.desc}
          </div>
        </div>
        <window.TrendsChart monthKeys={valid} reports={reports} metric={metric}/>
      </div>

      {narrative && trendVerdict && (
        <div style={{
          background: S.card, borderRadius: 14, padding: "18px 18px 20px",
          border: `1px solid ${S.hair}`, marginBottom: 16,
        }}>
          <div style={{
            fontSize: 11, letterSpacing: 1.3, textTransform: "uppercase",
            color: S.faint, marginBottom: 8,
          }}>The arc</div>
          <div style={{ fontFamily: S.serif, fontSize: 22, lineHeight: 1.5, paddingBottom: 6, marginBottom: 14 }}>
            Your {active.label.toLowerCase()} is <em style={{
              color: trendVerdict.tone === "calm" ? S.calm :
                     trendVerdict.tone === "warm" ? S.warm : S.ink,
            }}>{trendVerdict.label}</em>.
          </div>
          <p style={{ fontSize: 13, lineHeight: 1.6, color: S.soft }}>
            {narrative.d > 0 ? "+" : ""}{narrative.d} from {monthShort(narrative.first)} to {monthShort(narrative.last)}.
            {" "}
            {trendVerdict.tone === "calm" && "Keep doing what you're doing."}
            {trendVerdict.tone === "warm" && "Worth paying attention to — small changes now."}
            {trendVerdict.tone === "soft" && "Nothing dramatic — your system is stable."}
          </p>
        </div>
      )}

      <div style={{
        fontSize: 11, letterSpacing: 1.3, textTransform: "uppercase",
        color: S.faint, marginBottom: 10,
      }}>Month by month</div>
      <div style={{
        background: S.card, borderRadius: 14, border: `1px solid ${S.hair}`,
        overflow: "hidden",
      }}>
        {valid.map((m, i) => {
          const r = reports[m];
          return (
            <div key={m} style={{
              display: "grid", gridTemplateColumns: "auto 1fr auto auto auto",
              gap: 10, padding: "12px 14px", alignItems: "center",
              borderBottom: i === valid.length - 1 ? "none" : `1px solid ${S.hair}`,
            }}>
              <div style={{ fontFamily: S.serif, fontSize: 18, width: 46 }}>{monthShort(m)}</div>
              <div style={{ color: S.faint, fontSize: 11 }}>{m.slice(0, 4)}</div>
              <MiniStat label="Rec" v={r.avgRec} color={S.calm}/>
              <MiniStat label="Str" v={r.avgStress} color={S.warm}/>
              <MiniStat label="Eff" v={r.avgEff} color={S.gold}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function monthShort(mk) {
  const [y, m] = mk.split("-");
  return new Date(+y, +m - 1, 1).toLocaleDateString("en-GB", { month: "short" });
}

function MiniStat({ label, v, color }) {
  return (
    <div style={{ textAlign: "center", width: 46 }}>
      <div style={{ fontFamily: S.serif, fontSize: 18, color: S.ink }}>{Math.round(v)}</div>
      <div style={{ fontSize: 9, color: color, letterSpacing: 0.6,
        textTransform: "uppercase", fontWeight: 500 }}>{label}</div>
    </div>
  );
}

Object.assign(window, { ImportScreen, Header, MonthScreen, TrendsScreen });
</script>

<!-- ── app ── -->
<script type="text/babel">
// app.jsx — Main composition
const { useState: useS, useEffect: useE } = React;

const TWEAK_DEFAULTS = {
  theme: "cream",
  accentWarm: "#b85c3c",
};

function applyTheme(theme) {
  const themes = {
    cream: { paper: "#f9f6f0", card: "#ffffff", ink: "#2a2620", hair: "#e8e2d8" },
    sand:  { paper: "#f3ede0", card: "#faf5e8", ink: "#2a2620", hair: "#dfd5c2" },
    slate: { paper: "#1e1c1a", card: "#2a2622", ink: "#f5efe2", hair: "#3a342d" },
  };
  const t = themes[theme] || themes.cream;
  document.body.style.background = t.paper;
}

function App() {
  const [tab, setTab] = useS(() => localStorage.getItem("hrc-tab") || "month");
  const [tweaks, setTweaks] = useS(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useS(false);
  const [analysis, setAnalysis] = useS(null);
  const [selectedMonth, setSelectedMonth] = useS(null);

  useE(() => applyTheme(tweaks.theme), [tweaks.theme]);
  useE(() => { localStorage.setItem("hrc-tab", tab); }, [tab]);

  const updateTweak = (k, v) => setTweaks(prev => ({ ...prev, [k]: v }));

  const onImportComplete = (readings) => {
    const a = window.analyze(readings);
    setAnalysis(a);
    const validMonths = a.monthKeys.filter(mk => a.reports[mk]);
    setSelectedMonth(validMonths[validMonths.length - 1] || a.monthKeys[a.monthKeys.length - 1]);
  };

  const reset = () => { setAnalysis(null); setSelectedMonth(null); };

  const bgColor = tweaks.theme === "slate" ? "#14120f"
                : tweaks.theme === "sand"  ? "#e8dfc8" : "#efe9dc";

  return (
    <div style={{
      minHeight: "100vh", display: "flex", alignItems: "center",
      justifyContent: "center", padding: 24, gap: 24,
      background: bgColor,
      fontFamily: `"DM Sans", system-ui, sans-serif`,
    }}>
      <window.AndroidDevice>
        {!analysis ? (
          <window.ImportScreen onComplete={onImportComplete}/>
        ) : (
          <div style={{ height: "100%", background: "#f9f6f0",
            display: "flex", flexDirection: "column", overflow: "hidden" }}>
            <window.Header
              tab={tab} onTab={setTab}
              monthLabel={tab === "month" ? "Monthly review" : "Trends"}
              onReset={reset}
            />
            <div style={{ flex: 1, overflowY: "auto" }}>
              {tab === "month" ? (
                <window.MonthScreen
                  analysis={analysis}
                  selectedMonth={selectedMonth}
                  setSelectedMonth={setSelectedMonth}
                />
              ) : (
                <window.TrendsScreen analysis={analysis}/>
              )}
            </div>
          </div>
        )}
      </window.AndroidDevice>

      {/* tweaks toggle */}
      <button onClick={() => setTweaksOpen(o => !o)}
        style={{
          position: "fixed", bottom: 20, right: 20,
          width: 44, height: 44, borderRadius: "50%",
          background: "#2a2620", color: "#f9f6f0",
          border: "none", cursor: "pointer", fontSize: 18,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 4px 16px rgba(0,0,0,0.2)",
        }} title="Tweaks">⚙</button>

      {tweaksOpen && (
        <TweaksPanel tweaks={tweaks} update={updateTweak} onClose={() => setTweaksOpen(false)}/>
      )}
    </div>
  );
}

function TweaksPanel({ tweaks, update, onClose }) {
  return (
    <div style={{
      position: "fixed", right: 20, bottom: 72, width: 260,
      background: "#fff", border: "1px solid #e8e2d8", borderRadius: 12,
      padding: 16, fontFamily: `"DM Sans", system-ui, sans-serif`,
      boxShadow: "0 12px 40px rgba(0,0,0,0.15)", zIndex: 1000,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ fontFamily: `"Instrument Serif", Georgia, serif`, fontSize: 20 }}>Tweaks</div>
        <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer",
          fontSize: 18, color: "#a09888" }}>×</button>
      </div>

      <div style={{ fontSize: 10, letterSpacing: 1.3, textTransform: "uppercase",
        color: "#a09888", marginBottom: 8 }}>Theme</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {[
          { k: "cream", bg: "#f9f6f0", ink: "#2a2620" },
          { k: "sand",  bg: "#f3ede0", ink: "#2a2620" },
          { k: "slate", bg: "#1e1c1a", ink: "#f5efe2" },
        ].map(t => (
          <button key={t.k} onClick={() => update("theme", t.k)}
            style={{
              flex: 1, padding: "10px 8px", borderRadius: 8,
              border: tweaks.theme === t.k ? `2px solid #2a2620` : "1px solid #e8e2d8",
              background: t.bg, color: t.ink, cursor: "pointer",
              fontSize: 11, fontWeight: 500, textTransform: "capitalize",
            }}>{t.k}</button>
        ))}
      </div>

      <div style={{ fontSize: 10, letterSpacing: 1.3, textTransform: "uppercase",
        color: "#a09888", marginBottom: 8 }}>Accent color</div>
      <div style={{ display: "flex", gap: 6 }}>
        {["#b85c3c", "#a04d68", "#6a7a3a", "#7a5a8a", "#3a6a7a"].map(c => (
          <button key={c} onClick={() => update("accentWarm", c)}
            style={{
              width: 32, height: 32, borderRadius: "50%", background: c,
              border: tweaks.accentWarm === c ? `2px solid #2a2620` : "1px solid #e8e2d8",
              cursor: "pointer",
            }}/>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
