<script type="text/babel">
const { useState, useCallback, useRef, useEffect } = React;

// ─── Data Processing Engine ─────────────────────────────────────────────────

function parseZeppData(raw) {
  raw = raw.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.trim().split("\n").filter(l => l.trim());
  if (lines.length < 2) return [];

  let sep = "\t";
  const sample = lines.slice(0, 5).join("\n");
  const tabCount = (sample.match(/\t/g) || []).length;
  const commaCount = (sample.match(/,/g) || []).length;
  const semiCount = (sample.match(/;/g) || []).length;
  if (commaCount > tabCount && commaCount >= semiCount) sep = ",";
  else if (semiCount > tabCount && semiCount > commaCount) sep = ";";

  const readings = [];
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    const parts = line.split(sep).map(s => s.trim()).filter(s => s.length > 0);
    if (parts.length < 3) continue;
    if (li === 0 && /[a-zA-Z]/.test(parts[2])) continue;
    const [dateStr, timeStr, bpmStr] = parts;
    const bpm = parseInt(bpmStr, 10);
    if (isNaN(bpm)) continue;
    let d, m, y;
    if (dateStr.includes("-")) { [y, m, d] = dateStr.split("-").map(Number); }
    else { [d, m, y] = dateStr.split("/").map(Number); }
    const [h, min] = timeStr.split(":").map(Number);
    if (!d || !m || !y || isNaN(h) || isNaN(min)) continue;
    const dt = new Date(y, m - 1, d, h, min);
    if (isNaN(dt.getTime())) continue;
    readings.push({ dt, hour: h, minute: min, bpm, dateKey: `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`, dayOfWeek: dt.getDay() });
  }
  readings.sort((a, b) => a.dt - b.dt);
  return readings;
}

function detectZeppFormat(raw) {
  raw = raw.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.trim().split("\n").filter(l => l.trim());
  let sep = "\t";
  const sample = lines.slice(0, 5).join("\n");
  const tabCount = (sample.match(/\t/g) || []).length;
  const commaCount = (sample.match(/,/g) || []).length;
  const semiCount = (sample.match(/;/g) || []).length;
  if (commaCount > tabCount && commaCount >= semiCount) sep = ",";
  else if (semiCount > tabCount && semiCount > commaCount) sep = ";";
  return { lines, sep };
}

function previewZeppData(raw) {
  const { lines, sep } = detectZeppFormat(raw);
  if (lines.length < 2) return { ok: false, error: "No data lines found.", sep };
  const firstParts = lines[0].split(sep).map(s => s.trim()).filter(Boolean);
  const hasHeader = firstParts.length >= 3 && /[a-zA-Z]/.test(firstParts[2]);
  const startIdx = hasHeader ? 1 : 0;

  const readings = [];
  for (let li = startIdx; li < lines.length; li++) {
    const line = lines[li];
    const parts = line.split(sep).map(s => s.trim()).filter(s => s.length > 0);
    if (parts.length < 3) continue;
    const [dateStr, timeStr, bpmStr] = parts;
    const bpm = parseInt(bpmStr, 10);
    if (isNaN(bpm)) continue;
    let d, m, y;
    if (dateStr.includes("-")) { [y, m, d] = dateStr.split("-").map(Number); }
    else { [d, m, y] = dateStr.split("/").map(Number); }
    const [h, min] = timeStr.split(":").map(Number);
    if (!d || !m || !y || isNaN(h) || isNaN(min)) continue;
    const dt = new Date(y, m - 1, d, h, min);
    if (isNaN(dt.getTime())) continue;
    readings.push({ dt, hour: h, minute: min, bpm, dateKey: `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}` });
  }
  readings.sort((a, b) => a.dt - b.dt);

  const totalLines = lines.length - (hasHeader ? 1 : 0);
  const skipped = Math.max(0, totalLines - readings.length);
  const dateFormat = readings.length ? (lines[startIdx].split(sep)[0].includes("-") ? "YYYY-MM-DD" : "DD/MM/YYYY") : null;
  const start = readings.length ? readings[0].dt : null;
  const end = readings.length ? readings[readings.length - 1].dt : null;
  const deltas = [];
  for (let i = 1; i < readings.length; i++) {
    const dm = (readings[i].dt - readings[i - 1].dt) / 60000;
    if (dm > 0 && dm <= 60) deltas.push(dm);
  }
  const medianInterval = deltas.length ? Math.round(medianArr(deltas) * 10) / 10 : null;

  const days = groupByDate(readings);
  const coverMinutes = Object.values(days).map(rs => sumCoveredMinutes(rs));
  const avgCoverage = coverMinutes.length ? Math.round((meanArr(coverMinutes) / 1440) * 100) : 0;
  const minCoverage = coverMinutes.length ? Math.round((Math.min(...coverMinutes) / 1440) * 100) : 0;
  const maxCoverage = coverMinutes.length ? Math.round((Math.max(...coverMinutes) / 1440) * 100) : 0;

  return {
    ok: readings.length >= 20,
    sep,
    dateFormat,
    hasHeader,
    totalLines,
    parsed: readings.length,
    skipped,
    start,
    end,
    medianInterval,
    totalDays: Object.keys(days).length,
    avgCoverage,
    minCoverage,
    maxCoverage,
  };
}

function cleanData(readings) {
  const cleaned = [];
  for (let i = 0; i < readings.length; i++) {
    const r = readings[i];
    if (r.bpm < 30 || r.bpm > 220) continue;
    if (i > 0) {
      const gapMinutes = (r.dt - readings[i - 1].dt) / 60000;
      if (gapMinutes < 5 && Math.abs(r.bpm - readings[i - 1].bpm) > 40) continue;
    }
    cleaned.push(r);
  }
  return cleaned;
}

function groupByDate(readings) {
  const days = {};
  for (const r of readings) {
    if (!days[r.dateKey]) days[r.dateKey] = [];
    days[r.dateKey].push(r);
  }
  return days;
}

function computeDataQuality(days) {
  const dateKeys = Object.keys(days).sort();
  const report = { totalDays: dateKeys.length, validDays: 0, incompleteDays: 0, coverageByDay: {} };
  for (const dk of dateKeys) {
    const count = days[dk].length;
    const coveredMinutes = sumCoveredMinutes(days[dk]);
    const coverage = Math.min(100, Math.round((coveredMinutes / 1440) * 100));
    report.coverageByDay[dk] = { count, coveredMinutes, coverage };
    if (coverage >= 80) report.validDays++;
    else report.incompleteDays++;
  }
  const coverages = Object.values(report.coverageByDay).map(c => c.coverage);
  report.avgCoverage = Math.round(meanArr(coverages));
  report.minCoverage = Math.min(...coverages);
  report.maxCoverage = Math.max(...coverages);
  return report;
}

function computeBaseline(days) {
  const allNightReadings = [];
  const dateKeys = Object.keys(days).sort();
  const firstTwoWeeks = dateKeys.slice(0, 14);
  for (const dk of firstTwoWeeks) {
    for (const r of days[dk]) {
      if (r.hour >= 1 && r.hour <= 5) allNightReadings.push(r.bpm);
    }
  }
  if (allNightReadings.length < 10) {
    for (const dk of dateKeys) {
      for (const r of days[dk]) {
        if (r.hour >= 1 && r.hour <= 5) allNightReadings.push(r.bpm);
      }
    }
  }
  allNightReadings.sort((a, b) => a - b);
  const p10 = allNightReadings[Math.floor(allNightReadings.length * 0.1)] || 55;
  const p50 = allNightReadings[Math.floor(allNightReadings.length * 0.5)] || 65;
  const m = allNightReadings.reduce((s, v) => s + v, 0) / allNightReadings.length || 65;
  const s = Math.sqrt(allNightReadings.reduce((s, v) => s + (v - m) ** 2, 0) / allNightReadings.length) || 5;
  return { restingHR: Math.round(p50), lowestTypical: Math.round(p10), mean: Math.round(m), std: Math.round(s * 10) / 10 };
}

function stdArr(arr) {
  if (arr.length < 2) return 0;
  const m = arr.reduce((s, v) => s + v, 0) / arr.length;
  return Math.sqrt(arr.reduce((s, v) => s + (v - m) ** 2, 0) / arr.length);
}

function meanArr(arr) {
  return arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0;
}

function medianArr(arr) {
  if (!arr || arr.length === 0) return 0;
  const a = [...arr].sort((x, y) => x - y);
  const mid = Math.floor(a.length / 2);
  return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
}

function clampSampleMinutes(minutes, fallback = 1, maxMinutes = 10) {
  if (!Number.isFinite(minutes) || minutes <= 0) return fallback;
  return Math.max(0.5, Math.min(maxMinutes, minutes));
}

function getSampleMinutes(readings, index, fallback = 1, maxMinutes = 10) {
  const current = readings[index];
  const next = readings[index + 1];
  if (!current || !next) return fallback;
  const delta = (next.dt - current.dt) / 60000;
  const sameDay = current.dateKey === next.dateKey;
  return sameDay ? clampSampleMinutes(delta, fallback, maxMinutes) : fallback;
}

function sumCoveredMinutes(readings, fallback = 1, maxMinutes = 10) {
  if (!readings || readings.length === 0) return 0;
  const sorted = [...readings].sort((a, b) => a.dt - b.dt);
  let total = 0;
  for (let i = 0; i < sorted.length; i++) total += getSampleMinutes(sorted, i, fallback, maxMinutes);
  return Math.min(1440, Math.round(total));
}

function collectWindowByMinutes(readings, startIndex, windowMinutes, fallback = 1, maxMinutes = 10) {
  const bucket = [];
  let total = 0;
  for (let i = startIndex; i < readings.length && total < windowMinutes; i++) {
    const minutes = getSampleMinutes(readings, i, fallback, maxMinutes);
    bucket.push(readings[i]);
    total += minutes;
  }
  return { readings: bucket, minutes: total };
}

function meanWeightedByMinutes(readings, fallback = 1, maxMinutes = 10) {
  if (!readings || readings.length === 0) return 0;
  let totalMinutes = 0;
  let total = 0;
  for (let i = 0; i < readings.length; i++) {
    const minutes = getSampleMinutes(readings, i, fallback, maxMinutes);
    total += readings[i].bpm * minutes;
    totalMinutes += minutes;
  }
  return totalMinutes > 0 ? total / totalMinutes : meanArr(readings.map(r => r.bpm));
}

function stdWeightedByMinutes(readings, fallback = 1, maxMinutes = 10) {
  if (!readings || readings.length < 2) return 0;
  const m = meanWeightedByMinutes(readings, fallback, maxMinutes);
  let totalMinutes = 0;
  let totalVar = 0;
  for (let i = 0; i < readings.length; i++) {
    const minutes = getSampleMinutes(readings, i, fallback, maxMinutes);
    const diff = readings[i].bpm - m;
    totalVar += minutes * diff * diff;
    totalMinutes += minutes;
  }
  return totalMinutes > 0 ? Math.sqrt(totalVar / totalMinutes) : stdArr(readings.map(r => r.bpm));
}

function calculateTRIMP(readings, currentRestingHR, maxHR) {
  const daytime = readings.filter(r => r.hour >= 6 && r.hour <= 22).sort((a, b) => a.dt - b.dt);
  if (sumCoveredMinutes(daytime, 1, 5) < 20) return { trimp: 0, level: "rest", activeMinutes: 0, peakHR: 0 };

  const hrr = Math.max(1, maxHR - currentRestingHR);
  const lightThreshold = currentRestingHR + hrr * 0.20;
  const moderateThreshold = currentRestingHR + hrr * 0.40;
  const hardThreshold = currentRestingHR + hrr * 0.60;

  let totalTrimp = 0;
  let activeMinutes = 0;
  const peakHR = Math.max(...daytime.map(r => r.bpm));

  for (let i = 0; i < daytime.length; i++) {
    const r = daytime[i];
    const minutes = getSampleMinutes(daytime, i, 1, 5);
    if (r.bpm > currentRestingHR + 15) {
      const intensity = Math.min(1, (r.bpm - currentRestingHR) / hrr);
      const weight = 0.64 * Math.exp(1.8 * intensity);
      totalTrimp += intensity * weight * minutes;
      if (intensity > 0.30) activeMinutes += minutes;
    }
  }

  let hardMinutes = 0;
  for (let i = 0; i < daytime.length; i++) {
    const minutes = getSampleMinutes(daytime, i, 1, 5);
    const gapMinutes = i > 0 ? (daytime[i].dt - daytime[i - 1].dt) / 60000 : 0;
    if (daytime[i].bpm >= hardThreshold) {
      hardMinutes = (i === 0 || gapMinutes <= 10) ? hardMinutes + minutes : minutes;
      if (hardMinutes >= 30) return { trimp: Math.round(totalTrimp), level: "workout", activeMinutes: Math.round(activeMinutes), peakHR };
    } else hardMinutes = 0;
  }

  let modMinutes = 0;
  for (let i = 0; i < daytime.length; i++) {
    const minutes = getSampleMinutes(daytime, i, 1, 5);
    const gapMinutes = i > 0 ? (daytime[i].dt - daytime[i - 1].dt) / 60000 : 0;
    if (daytime[i].bpm >= moderateThreshold) {
      modMinutes = (i === 0 || gapMinutes <= 10) ? modMinutes + minutes : minutes;
      if (modMinutes >= 15) return { trimp: Math.round(totalTrimp), level: "moderate", activeMinutes: Math.round(activeMinutes), peakHR };
    } else modMinutes = 0;
  }

  let lightMinutes = 0;
  for (let i = 0; i < daytime.length; i++) {
    if (daytime[i].bpm >= lightThreshold) lightMinutes += getSampleMinutes(daytime, i, 1, 5);
  }

  if (lightMinutes >= 20) return { trimp: Math.round(totalTrimp), level: "light", activeMinutes: Math.round(activeMinutes), peakHR };
  return { trimp: Math.round(totalTrimp), level: "rest", activeMinutes: Math.round(activeMinutes), peakHR };
}

function computeNadirTiming(nightReadings) {
  const sorted = [...nightReadings].sort((a, b) => a.dt - b.dt);
  if (sumCoveredMinutes(sorted, 1, 5) < 45) return null;
  const windowMinutes = 30;
  let lowestAvg = Infinity;
  let nadirHour = null;
  for (let i = 0; i < sorted.length; i++) {
    const bucket = collectWindowByMinutes(sorted, i, windowMinutes, 1, 5);
    if (bucket.minutes < 20) continue;
    const avg = meanWeightedByMinutes(bucket.readings, 1, 5);
    if (avg < lowestAvg) {
      lowestAvg = avg;
      nadirHour = bucket.readings[0].hour + bucket.readings[0].minute / 60;
    }
  }
  return nadirHour !== null ? Math.round(nadirHour * 10) / 10 : null;
}

function computeEveningDecay(readings) {
  const evening = readings.filter(r => r.hour >= 20 && r.hour <= 23).sort((a, b) => a.dt - b.dt);
  if (sumCoveredMinutes(evening, 1, 5) < 40) return null;

  const points = evening.map((r, i) => ({
    x: (r.hour - 20) * 60 + r.minute,
    y: r.bpm,
    w: getSampleMinutes(evening, i, 1, 5)
  }));

  const sumW = points.reduce((s, p) => s + p.w, 0);
  if (sumW <= 0) return null;
  const sumWX = points.reduce((s, p) => s + p.w * p.x, 0);
  const sumWY = points.reduce((s, p) => s + p.w * p.y, 0);
  const sumWXY = points.reduce((s, p) => s + p.w * p.x * p.y, 0);
  const sumWX2 = points.reduce((s, p) => s + p.w * p.x * p.x, 0);
  const denom = sumW * sumWX2 - sumWX * sumWX;
  if (denom === 0) return null;
  const slope = (sumW * sumWXY - sumWX * sumWY) / denom;
  return Math.round(slope * 100) / 100;
}

function calculateWakeSpike(readings, nightMeanHR, dynamicBaseline) {
  const morning = readings.filter(r => r.hour >= 5 && r.hour <= 9).sort((a, b) => a.dt - b.dt);
  if (sumCoveredMinutes(morning, 1, 5) < 20) return null;

  const wakeThreshold = dynamicBaseline + 15;
  let wakeIdx = -1;
  let elevatedMinutes = 0;
  for (let i = 0; i < morning.length; i++) {
    const minutes = getSampleMinutes(morning, i, 1, 5);
    const gapMinutes = i > 0 ? (morning[i].dt - morning[i - 1].dt) / 60000 : 0;
    if (morning[i].bpm > wakeThreshold) {
      elevatedMinutes = (i === 0 || gapMinutes <= 10) ? elevatedMinutes + minutes : minutes;
      if (elevatedMinutes >= 3) {
        wakeIdx = Math.max(0, i - 2);
        break;
      }
    } else {
      elevatedMinutes = 0;
    }
  }
  if (wakeIdx === -1) return null;

  const wakeWindow = collectWindowByMinutes(morning, wakeIdx, 20, 1, 5).readings;
  if (wakeWindow.length < 3) return null;
  const wakeAvg = meanWeightedByMinutes(wakeWindow, 1, 5);

  const spike = wakeAvg - nightMeanHR;
  return spike > 0 ? Math.round(spike) : null;
}

function computeDailySignals(days, baseline, maxHR) {
  const dateKeys = Object.keys(days).sort();
  const dailySignals = [];

  const alpha = 2 / (21 + 1); // 21-day smoothing factor
  let currentRestingHR = baseline.restingHR;

  for (const dk of dateKeys) {
    const readings = days[dk];
    const coveredMinutes = sumCoveredMinutes(readings);
    const coverage = Math.round((coveredMinutes / 1440) * 100);

    if (coveredMinutes < 60) {
      dailySignals.push({ date: dk, incomplete: true, coverage, drivers: ["low_coverage"] });
      const nightBpmPartial = readings.filter(r => r.hour >= 1 && r.hour <= 5).map(r => r.bpm);
      if (nightBpmPartial.length >= 5) {
        currentRestingHR = meanArr(nightBpmPartial) * alpha + currentRestingHR * (1 - alpha);
      }
      continue;
    }

    const nightReadings = readings.filter(r => r.hour >= 1 && r.hour <= 6);
    const nightSignalReadings = nightReadings.filter(r => r.hour <= 5);
    const nightBpm = nightSignalReadings.map(r => r.bpm); 
    const dayReadings = readings.filter(r => r.hour >= 8 && r.hour <= 22);
    const dayBpm = dayReadings.map(r => r.bpm);
    const allBpm = readings.map(r => r.bpm);
    const nightCoveredMinutes = sumCoveredMinutes(nightSignalReadings, 1, 5);
    const dayCoveredMinutes = sumCoveredMinutes(dayReadings, 1, 5);
    const hasNightData = nightCoveredMinutes >= 45;
    const hasDayData = dayCoveredMinutes >= 60;

    let recoveryQuality = 50;
    if (hasNightData) {
      const nightMean = meanWeightedByMinutes(nightSignalReadings, 1, 5);
      const nightStd = stdWeightedByMinutes(nightSignalReadings, 1, 5);
      const depth = currentRestingHR - nightMean; 
      const stability = Math.max(0, 10 - nightStd);
      recoveryQuality = Math.min(100, Math.max(0, 50 + depth * 3 + stability * 2));
    }

    let autonomicLoad = 25;
    if (hasNightData) {
      const nMean = meanWeightedByMinutes(nightSignalReadings, 1, 5);
      const nStd = stdWeightedByMinutes(nightSignalReadings, 1, 5);
      const elevation = nMean - currentRestingHR;
      const instability = nStd - baseline.std;
      autonomicLoad = Math.min(100, Math.max(0, 25 + elevation * 3 + instability * 4));
    }

    let cardioEfficiency = 50;
    if (hasDayData) {
      const threshold = currentRestingHR + 10;
      let belowMinutes = 0;
      let totalDayMinutes = 0;
      for (let i = 0; i < dayReadings.length; i++) {
        const minutes = getSampleMinutes(dayReadings, i, 1, 5);
        totalDayMinutes += minutes;
        if (dayReadings[i].bpm < threshold) belowMinutes += minutes;
      }
      cardioEfficiency = totalDayMinutes > 0 ? Math.min(100, Math.max(0, (belowMinutes / totalDayMinutes) * 100)) : 50;
    }

    let stressSignature = 50;
    const eveningReadings = readings.filter(r => r.hour >= 20 && r.hour <= 23);
    const eveningBpm = eveningReadings.map(r => r.bpm);
    const earlyMorningReadings = readings.filter(r => r.hour >= 6 && r.hour <= 7);
    const morningBpm = earlyMorningReadings.map(r => r.bpm);
    const hasEvening = sumCoveredMinutes(eveningReadings, 1, 5) >= 20;
    const hasMorning = sumCoveredMinutes(earlyMorningReadings, 1, 5) >= 15;
    if (hasEvening || hasMorning) {
      const eveningElev = hasEvening ? meanArr(eveningBpm) - currentRestingHR : 0;
      const morningElev = hasMorning ? meanArr(morningBpm) - currentRestingHR : 0;
      const weightedElev = hasEvening && hasMorning
        ? eveningElev * 0.7 + morningElev * 0.3
        : hasEvening ? eveningElev : morningElev;
      stressSignature = Math.min(100, Math.max(0, 30 + weightedElev * 3));
    }

    const dayMeanHR = meanWeightedByMinutes(readings, 1, 5);
    const dayMinHR = Math.min(...allBpm);
    const nightMeanHR = hasNightData ? meanWeightedByMinutes(nightSignalReadings, 1, 5) : null;

    const activity = calculateTRIMP(readings, currentRestingHR, maxHR);
    const nadirHour = computeNadirTiming(nightReadings);
    const eveningDecay = computeEveningDecay(readings);

    let ansStability = null;
    let nightVolatilityPercent = null;
    if (hasNightData) {
      const nMean = meanWeightedByMinutes(nightSignalReadings, 1, 5);
      const nStd = stdWeightedByMinutes(nightSignalReadings, 1, 5);
      const cv = (nStd / nMean) * 100;
      nightVolatilityPercent = Math.round(cv * 10) / 10;
      const score = 100 - ((cv - 2) * 15);
      ansStability = Math.min(100, Math.max(0, Math.round(score)));
    }

    const wakeSpike = nightMeanHR !== null
      ? calculateWakeSpike(readings, nightMeanHR, currentRestingHR)
      : null;

    let idleStressMinutes = null;
    if (hasDayData && (activity.level === "rest" || activity.level === "light")) {
      const idleReadings = readings.filter(r => r.hour >= 8 && r.hour <= 20).sort((a, b) => a.dt - b.dt);
      const elevThreshold = currentRestingHR + 25;
      let stressMinutes = 0;
      let streakMinutes = 0;
      for (let i = 0; i < idleReadings.length; i++) {
        const minutes = getSampleMinutes(idleReadings, i, 1, 5);
        const gapMinutes = i > 0 ? (idleReadings[i].dt - idleReadings[i - 1].dt) / 60000 : 0;
        if (idleReadings[i].bpm > elevThreshold) {
          streakMinutes = (i === 0 || gapMinutes <= 10) ? streakMin + minutes : minutes;
          if (streakMinutes >= 15) stressMinutes += minutes;
        } else {
          streakMinutes = 0;
        }
      }
      idleStressMinutes = Math.round(stressMinutes);
    }

    const drivers = [];
    if (coverage < 80) drivers.push("low_coverage");
    if (hasNightData && nightMeanHR !== null && nightMeanHR > currentRestingHR + 3) drivers.push("elevated_night_hr");
    if (nadirHour !== null && nadirHour > 5) drivers.push("late_nadir");
    if (eveningDecay !== null && eveningDecay > -0.02) drivers.push("flat_evening");
    if (ansStability !== null && ansStability < 50) drivers.push("low_ans_stability");
    if (nightVolatilityPercent !== null && nightVolatilityPercent > 8) drivers.push("high_night_volatility");
    if (wakeSpike !== null && wakeSpike > 30) drivers.push("high_wake_spike");
    if (idleStressMinutes !== null && idleStressMinutes > 45) drivers.push("high_idle_stress");
    if (activity.level === "workout" || activity.level === "moderate") drivers.push("hard_training_day");
    if (nadirHour !== null && nadirHour >= 2 && nadirHour <= 3.5) drivers.push("good_nadir");
    if (eveningDecay !== null && eveningDecay < -0.10) drivers.push("good_evening_drop");
    if (ansStability !== null && ansStability >= 70) drivers.push("strong_ans_stability");
    if (wakeSpike !== null && wakeSpike <= 25) drivers.push("smooth_wake");
    if (idleStressMinutes !== null && idleStressMinutes <= 10) drivers.push("calm_day");

    dailySignals.push({
      date: dk, incomplete: false, coverage,
      dynamicBaseline: Math.round(currentRestingHR * 10) / 10,
      recoveryQuality: Math.round(recoveryQuality),
      autonomicLoad: Math.round(autonomicLoad),
      cardioEfficiency: Math.round(cardioEfficiency),
      stressSignature: Math.round(stressSignature),
      recoveryDebt: 30,
      dayMeanHR: Math.round(dayMeanHR),
      dayMinHR,
      nightMeanHR: nightMeanHR !== null ? Math.round(nightMeanHR) : null,
      readingCount: readings.length,
      activityLevel: activity.level,
      activeMinutes: activity.activeMinutes,
      peakHR: activity.peakHR,
      trimp: activity.trimp,
      hasWorkout: activity.level === "workout",
      nadirHour,
      eveningDecay,
      ansStability,
      nightVolatilityPercent,
      wakeSpike,
      idleStressMinutes,
      drivers,
    });

    if (hasNightData) {
      currentRestingHR = meanArr(nightBpm) * alpha + currentRestingHR * (1 - alpha);
    }
  }

  for (let i = 0; i < dailySignals.length; i++) {
    if (dailySignals[i].incomplete) continue;
    const windowStart = Math.max(0, i - 4);
    const win = dailySignals.slice(windowStart, i + 1).filter(d => !d.incomplete && d.nightMeanHR !== null);
    if (win.length >= 2) {
      const recentNightMean = meanArr(win.map(d => d.nightMeanHR));
      const drift = recentNightMean - dailySignals[i].dynamicBaseline;
      dailySignals[i].recoveryDebt = Math.min(100, Math.max(0, 30 + drift * 6));
    }
  }

  const rawLoads = dailySignals.map(d => d.incomplete ? null : d.autonomicLoad);
  for (let i = 0; i < dailySignals.length; i++) {
    if (dailySignals[i].incomplete) continue;
    const window = [];
    for (let j = Math.max(0, i - 1); j <= Math.min(dailySignals.length - 1, i + 1); j++) {
      if (!dailySignals[j].incomplete && rawLoads[j] !== null) window.push(rawLoads[j]);
    }
    if (window.length > 0) dailySignals[i].autonomicLoad = Math.round(meanArr(window));
  }

  for (let i = 0; i < dailySignals.length; i++) {
    if (dailySignals[i].incomplete) { dailySignals[i].acwr = null; continue; }
    const acuteWin  = dailySignals.slice(Math.max(0, i - 6),  i + 1).filter(d => !d.incomplete);
    const chronicWin = dailySignals.slice(Math.max(0, i - 27), i + 1).filter(d => !d.incomplete);
    if (acuteWin.length < 4 || chronicWin.length < 14) { dailySignals[i].acwr = null; continue; }
    const acuteLoad   = meanArr(acuteWin.map(d => d.trimp));
    const chronicLoad = meanArr(chronicWin.map(d => d.trimp));
    dailySignals[i].acwr = chronicLoad > 0 ? Math.round((acuteLoad / chronicLoad) * 100) / 100 : null;
  }

  return dailySignals;
}

function findPatterns(dailySignals, baseline) {
  const valid = dailySignals.filter(d => !d.incomplete);
  const insights = [];

  const dayNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const byDow = {};
  for (const d of valid) {
    const dow = (new Date(d.date).getDay() + 6) % 7;
    if (!byDow[dow]) byDow[dow] = [];
    byDow[dow].push(d);
  }
  const dowRecovery = {};
  for (const [dow, ds] of Object.entries(byDow)) {
    dowRecovery[dow] = meanArr(ds.map(d => d.recoveryQuality));
  }
  const bestDow = Object.entries(dowRecovery).sort((a, b) => b[1] - a[1])[0];
  const worstDow = Object.entries(dowRecovery).sort((a, b) => a[1] - b[1])[0];
  if (bestDow && worstDow && bestDow[1] - worstDow[1] > 8) {
    insights.push({
      type: "weekly_rhythm", title: "Your week has a rhythm",
      detail: `Recovery is strongest on ${dayNames[bestDow[0]]}s (~${Math.round(bestDow[1])}) and weakest on ${dayNames[worstDow[0]]}s (~${Math.round(worstDow[1])}).`,
      guidance: `Your ${dayNames[worstDow[0]]} dip is shaped by what you do on ${dayNames[(parseInt(worstDow[0]) + 6) % 7]}.`,
      severity: "info",
    });
  }

  const weekdayDays = valid.filter(d => { const dow = (new Date(d.date).getDay() + 6) % 7; return dow < 5; });
  const weekendDays = valid.filter(d => { const dow = (new Date(d.date).getDay() + 6) % 7; return dow >= 5; });
  if (weekdayDays.length >= 10 && weekendDays.length >= 4) {
    const wdRec = meanArr(weekdayDays.map(d => d.recoveryQuality));
    const weRec = meanArr(weekendDays.map(d => d.recoveryQuality));
    if (Math.abs(wdRec - weRec) > 6) {
      insights.push({
        type: "weekend_pattern", title: weRec > wdRec ? "Weekends recover what weekdays take" : "Your weekends are harder on your body",
        detail: weRec > wdRec ? `Weekend recovery averages ${Math.round(weRec)} vs ${Math.round(wdRec)} on weekdays.` : `Weekend recovery (${Math.round(weRec)}) is lower than weekdays (${Math.round(wdRec)}).`,
        severity: "info",
      });
    }
  }

  const avgStress = meanArr(valid.map(d => d.stressSignature));
  if (avgStress > 55) {
    insights.push({
      type: "high_stress", title: "High evening load detected",
      detail: `Your stress signature (evening HR elevation) is high (avg ${Math.round(avgStress)}).`,
      guidance: "A high stress signature is the most common disruptor of overnight recovery. Try a 'digital sunset' — no screens and dim lights for the final 60 minutes of the day.",
      severity: "warning",
    });
  }

  const weeks = [];
  for (let i = 0; i < valid.length; i += 7) {
    const week = valid.slice(i, i + 7);
    if (week.length < 4) continue;
    const avgRec = meanArr(week.map(d => d.recoveryQuality));
    const avgStress = meanArr(week.map(d => d.stressSignature));
    const avgDebt = meanArr(week.map(d => d.recoveryDebt));
    const workouts = week.filter(d => d.activityLevel === "workout" || d.activityLevel === "moderate").length;
    weeks.push({ start: week[0].date, avgRec, avgStress, avgDebt, workouts, composite: avgRec - avgStress * 0.5 - avgDebt * 0.3 });
  }
  if (weeks.length >= 3) {
    weeks.sort((a, b) => b.composite - a.composite);
    const best = weeks[0];
    const worst = weeks[weeks.length - 1];
    insights.push({
      type: "peak_week", title: "Your best week",
      detail: `The week of ${fmtDate(best.start)}: recovery ${Math.round(best.avgRec)}, stress ${Math.round(best.avgStress)}.`,
      severity: "positive",
    });
    insights.push({
      type: "tough_week", title: "Your toughest week",
      detail: `The week of ${fmtDate(worst.start)}: recovery ${Math.round(worst.avgRec)}, stress ${Math.round(worst.avgStress)}.`,
      severity: "warning",
    });
  }

  const workoutDays = valid.filter(d => d.activityLevel === "workout" || d.activityLevel === "moderate");
  if (workoutDays.length >= 3) {
    const nextDayRecovery = [];
    for (const wd of workoutDays) {
      const idx = valid.indexOf(wd);
      if (idx < valid.length - 1 && !valid[idx + 1].incomplete) nextDayRecovery.push(valid[idx + 1].recoveryQuality);
    }
    if (nextDayRecovery.length >= 3) {
      const overallAvg = meanArr(valid.map(d => d.recoveryQuality));
      const avgNext = meanArr(nextDayRecovery);
      const dropNext = overallAvg - avgNext;
      if (dropNext > 5) {
        insights.push({
          type: "recovery_lag", title: "How exercise hits your recovery",
          detail: `Next-day recovery drops ~${Math.round(dropNext)} points after workouts.`,
          severity: "info",
        });
      }
    }
  }

  const acwrDays = valid.filter(d => d.acwr !== null);
  if (acwrDays.length >= 14) {
    const sweetSpot = acwrDays.filter(d => d.acwr >= 0.8 && d.acwr <= 1.3);
    if (sweetSpot.length >= acwrDays.length * 0.65) {
      insights.push({
        type: "acwr_optimal", title: "Training load well-managed",
        detail: `${sweetSpot.length} of ${acwrDays.length} measured days had an ACWR in the 0.8–1.3 sweet spot.`,
        severity: "positive",
      });
    }
  }

  return insights;
}

function detectWorkoutRecovery(dailySignals, baseline) {
  const recoveryLags = [];
  for (let i = 0; i < dailySignals.length; i++) {
    const d = dailySignals[i];
    if (d.incomplete || (d.activityLevel !== "workout" && d.activityLevel !== "moderate")) continue;
    let daysToRecover = 0;
    for (let j = i + 1; j < Math.min(i + 7, dailySignals.length); j++) {
      if (dailySignals[j].incomplete) continue;
      if (dailySignals[j].nightMeanHR !== null && dailySignals[j].nightMeanHR <= baseline.restingHR + 2) break;
      daysToRecover++;
    }
    recoveryLags.push(daysToRecover);
  }
  return recoveryLags.length > 0 ? { avg: meanArr(recoveryLags), max: Math.max(...recoveryLags), count: recoveryLags.length } : null;
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

function getMonthKey(dateStr) { return dateStr.substring(0, 7); }

function fmtMonth(monthKey) {
  const [y, m] = monthKey.split("-");
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return `${months[parseInt(m) - 1]} ${y}`;
}

function generateExportSummary(baseline, dailySignals, patterns, recovery, dataQuality) {
  const valid = dailySignals.filter(d => !d.incomplete);
  const lines = [];
  lines.push("# Heart Rate Coach — Summary Report");
  lines.push(`Generated: ${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}`);
  lines.push("");
  lines.push("## Data Quality");
  lines.push(`- ${dataQuality.totalDays} days in dataset, ${dataQuality.validDays} valid`);
  lines.push("");
  lines.push("## Personal Baseline");
  lines.push(`- Resting HR: ${baseline.restingHR} bpm`);
  lines.push(`- Overnight variability: +/-${baseline.std} bpm`);
  if (recovery) lines.push(`- Post-workout recovery: ~${recovery.avg.toFixed(1)} days avg`);
  lines.push("");
  lines.push("## Key Findings");
  for (const p of patterns) {
    lines.push("");
    lines.push(`### ${p.title}`);
    lines.push(p.detail);
    if (p.guidance) lines.push(`\n> ${p.guidance}`);
  }
  return lines.join("\n");
}

function generateMonthCoachNotes(monthSignals, baseline, allSignals, allMonthReports, currentMonthKey) {
  const valid = monthSignals.filter(d => !d.incomplete);
  if (valid.length < 5) return { summary: "Not enough data.", notes: [], guidance: [], callouts: [] };

  const avgRecovery = meanArr(valid.map(d => d.recoveryQuality));
  const avgStress = meanArr(valid.map(d => d.stressSignature));
  const avgLoad = meanArr(valid.map(d => d.autonomicLoad));
  const avgEfficiency = meanArr(valid.map(d => d.cardioEfficiency));
  const avgDebt = meanArr(valid.map(d => d.recoveryDebt));
  const nightMeans = valid.filter(d => d.nightMeanHR !== null).map(d => d.nightMeanHR);
  const monthRestingHR = nightMeans.length > 0 ? Math.round(meanArr(nightMeans)) : null;

  const notes = [];
  const guidance = [];
  const callouts = [];

  const disruptorKeys = ["elevated_night_hr", "late_nadir", "flat_evening", "high_night_volatility", "high_wake_spike", "high_idle_stress", "low_ans_stability"]; 
  const winKeys = ["good_nadir", "good_evening_drop", "strong_ans_stability", "smooth_wake", "calm_day"]; 

  const labelMap = {
    elevated_night_hr: "elevated overnight HR",
    late_nadir: "late HR nadir",
    flat_evening: "flat evening wind-down",
    high_night_volatility: "chaotic overnight rhythm",
    low_ans_stability: "low ANS stability",
    high_wake_spike: "high wake-up spike",
    high_idle_stress: "high daytime idle stress",
    good_nadir: "optimal nadir timing",
    good_evening_drop: "strong evening wind-down",
    strong_ans_stability: "stable overnight rhythm",
    smooth_wake: "smooth wake response",
    calm_day: "calm daytime HR",
  };

  const driverCounts = {};
  for (const d of valid) {
    if (d.drivers) d.drivers.forEach(k => driverCounts[k] = (driverCounts[k] || 0) + 1);
  }

  if (avgRecovery >= 65) {
    notes.push({ icon: "✦", text: "Strong recovery this month. Your body resets well overnight." });
  } else if (avgRecovery < 50) {
    notes.push({ icon: "▽", text: "Recovery under pressure. Overnight HR stayed elevated." });
  }

  if (avgStress > 60) {
    notes.push({ icon: "△", text: "Elevated stress signature. Your evenings aren't calming down enough." });
  }

  if (avgDebt > 45) {
    notes.push({ icon: "△", text: "Recovery debt accumulated. Your resting HR sat above baseline." });
  }

  const topDisruptors = disruptorKeys
    .map(k => [k, driverCounts[k] || 0])
    .filter(x => x[1] > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);
  if (topDisruptors.length > 0) {
    const parts = topDisruptors.map(([k, v]) => `${labelMap[k] || k} (${v} day${v !== 1 ? "s" : ""})`);
    notes.push({ icon: "◎", text: `Most common disruptors: ${parts.join(", ")}.` });
  }

  const topWins = winKeys
    .map(k => [k, driverCounts[k] || 0])
    .filter(x => x[1] > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);
  if (topWins.length > 0) {
    const parts = topWins.map(([k, v]) => `${labelMap[k] || k} (${v} day${v !== 1 ? "s" : ""})`);
    notes.push({ icon: "✦", text: `What went well: ${parts.join(", ")}.` });
  }

  let summary = `Resting HR: ~${monthRestingHR} bpm.`;
  if (monthRestingHR !== null) {
    const diff = monthRestingHR - baseline.restingHR;
    if (Math.abs(diff) > 2) summary += diff > 0 ? " Above your baseline." : " Below your baseline.";
    else summary += " Right at your baseline.";
  }

  let priority = null;
  if (avgRecovery < 45) priority = { label: "Sleep", text: "Prioritise sleep regularity." };
  else if (avgStress > 60) priority = { label: "Stress", text: "Build an evening wind-down." };

  let monthComparison = null;
  if (allMonthReports && allSignals) {
    const sortedKeys = Object.keys(allMonthReports).sort();
    const currentIdx = sortedKeys.indexOf(currentMonthKey);
    if (currentIdx > 0) {
      const prevKey = sortedKeys[currentIdx - 1];
      const prevReport = allMonthReports[prevKey];
      const prevValid = allSignals.filter(d => getMonthKey(d.date) === prevKey && !d.incomplete);
      if (prevReport && prevValid.length >= 5) {
        const recDiff = avgRecovery - prevReport.avgRecovery;
        const stressDiff = avgStress - prevReport.avgStress;
        monthComparison = {
          prevMonth: fmtMonth(prevKey),
          recDiff: Math.round(recDiff * 10) / 10,
          stressDiff: Math.round(stressDiff * 10) / 10,
        };
      }
    }
  }

  const weeklySummaries = [];
  if (valid.length >= 7) {
    const weekMap = {};
    for (const d of valid) {
      const dt = new Date(d.date);
      const day = dt.getDay();
      const mondayOffset = (day === 0 ? -6 : 1 - day);
      const monday = new Date(dt);
      monday.setDate(dt.getDate() + mondayOffset);
      const wk = monday.toISOString().slice(0, 10);
      if (!weekMap[wk]) weekMap[wk] = [];
      weekMap[wk].push(d);
    }
    for (const [wk, days] of Object.entries(weekMap).sort()) {
      if (days.length >= 3) {
        weeklySummaries.push({
          wk, label: new Date(wk).toLocaleDateString("en-GB", { day: "numeric", month: "short" }),
          avgRec: Math.round(meanArr(days.map(d => d.recoveryQuality))),
          avgStr: Math.round(meanArr(days.map(d => d.stressSignature))),
          workouts: days.filter(d => d.activityLevel === "workout").length
        });
      }
    }
  }

  let weeklyFocus = null;
  if (weeklySummaries.length >= 2) {
    const scored = weeklySummaries.map(w => ({ ...w, score: w.avgRec - w.avgStr * 0.5 }));
    const best = scored.reduce((a, b) => b.score > a.score ? b : a);
    const tough = scored.reduce((a, b) => b.score < a.score ? b : a);
    weeklyFocus = { best, tough, focusRec: driverCounts.late_nadir >= 4 ? "Earlier evenings" : "Protect habits" };
  }

  return { summary, notes, guidance, priority, monthComparison, weeklyFocus, weeklySummaries, avgRecovery, avgStress, avgLoad, avgEfficiency, avgDebt };
}

function generateMockZepp(months = 4) {
  const rows = [];
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - months + 1, 1);

  for (let dayOffset = 0; dayOffset < months * 30; dayOffset++) {
    const d = new Date(start);
    d.setDate(d.getDate() + dayOffset);
    if (d > now) break;

    const monthIdx = Math.floor(dayOffset / 30);
    const stressFactor = monthIdx === 1 ? 1.15 : 1.0;
    const weekend = (d.getDay() === 0 || d.getDay() === 6);

    const baseRest = 58 + (monthIdx === 1 ? 4 : 0) + Math.sin(dayOffset / 10) * 2;
    const dayNoise = (Math.random() - 0.5) * 3;

    for (let min = 0; min < 1440; min += 5) {
      if (Math.random() < 0.03) continue;

      const h = Math.floor(min / 60);
      const m = min % 60;
      let bpm;

      if (h >= 0 && h < 6) {
        bpm = (baseRest + dayNoise + Math.sin(min / 120) * 2 + (Math.random() - 0.5) * 3) * stressFactor;
      } else if (h >= 6 && h < 8) {
        bpm = baseRest + 8 + Math.random() * 10;
      } else if (h >= 8 && h < 12) {
        bpm = baseRest + 4 + Math.random() * 12 + (weekend ? -3 : 0);
      } else if (h >= 12 && h < 18) {
        bpm = (Math.random() < 0.18) ? baseRest + 18 + Math.random() * 22 : baseRest + 2 + Math.random() * 10;
      } else if (h >= 18 && h < 22) {
        bpm = baseRest + 6 + Math.random() * 12;
      } else {
        bpm = baseRest + 12 + Math.random() * 6;
      }

      const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const timeStr = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
      rows.push(`${dateStr}\t${timeStr}\t${Math.max(42, Math.min(180, Math.round(bpm)))}`);
    }
  }
  return rows.join("\n");
}

// ─── UI Components ─────────────────────────────────────────────────────────

function GridHeatmap({ signals, field, label, isInverse }) {
  const valid = signals.filter(d => !d.incomplete);
  if (valid.length === 0) return null;
  const values = valid.map(d => d[field]);
  const sorted = [...values].sort((a, b) => a - b);
  let lo = sorted[Math.floor(sorted.length * 0.25)];
  let hi = sorted[Math.floor(sorted.length * 0.75)];
  if (hi - lo < 5) { const mid = (lo + hi) / 2; lo = mid - 3; hi = mid + 3; }

  const lookup = {};
  valid.forEach((d, i) => { lookup[d.date] = values[i]; });

  const firstDate = new Date(valid[0].date);
  const year = firstDate.getFullYear();
  const month = firstDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; 

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) {
    const dk = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    if (lookup[dk] !== undefined) {
      const v = lookup[dk];
      let quality;
      if (isInverse) quality = v < lo ? 2 : v > hi ? 0 : 1;
      else quality = v > hi ? 2 : v < lo ? 0 : 1;
      cells.push({ quality, value: v, date: dk, day });
    } else {
      cells.push({ empty: true, day });
    }
  }

  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) {
    weeks.push(cells.slice(i, i + 7));
  }
  const colors = ["hsl(4, 60%, 50%)", "hsl(38, 40%, 58%)", "hsl(145, 38%, 42%)"];
  const dowLabels = ["M", "T", "W", "T", "F", "S", "S"];

  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 11, color: "#8a8478", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</div>
      <div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 22px)", gap: 2, marginBottom: 2 }}>
          {dowLabels.map((l, i) => (
            <div key={i} style={{ fontSize: 9, color: "#b0a898", textAlign: "center" }}>{l}</div>
          ))}
        </div>
        {weeks.map((week, wi) => (
          <div key={wi} style={{ display: "grid", gridTemplateColumns: "repeat(7, 22px)", gap: 2, marginBottom: 2 }}>
            {Array.from({ length: 7 }, (_, di) => {
              const cell = week[di];
              if (!cell) return <div key={di} style={{ width: 22, height: 18, borderRadius: 3 }} />;
              if (cell.empty) return <div key={di} style={{ width: 22, height: 18, borderRadius: 3, backgroundColor: "#f0ece4" }} />;
              return (
                <div key={di} title={`${cell.day}: ${cell.value}`}
                  style={{ width: 22, height: 18, borderRadius: 3, backgroundColor: colors[cell.quality], opacity: 0.88 }} />
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function FullGridHeatmap({ signals, field, label, isInverse }) {
  const valid = signals.filter(d => !d.incomplete);
  if (valid.length === 0) return null;
  const values = valid.map(d => d[field]);
  const sorted = [...values].sort((a, b) => a - b);
  let lo = sorted[Math.floor(sorted.length * 0.25)];
  let hi = sorted[Math.floor(sorted.length * 0.75)];
  if (hi - lo < 5) { const mid = (lo + hi) / 2; lo = mid - 3; hi = mid + 3; }

  const firstDate = new Date(valid[0].date);
  const startDow = (firstDate.getDay() + 6) % 7; 
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (const d of valid) {
    const v = d[field];
    let quality;
    if (isInverse) quality = v < lo ? 2 : v > hi ? 0 : 1;
    else quality = v > hi ? 2 : v < lo ? 0 : 1;
    cells.push({ quality, value: v, date: d.date });
  }
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) {
    weeks.push(cells.slice(i, i + 7));
  }
  const colors = ["hsl(4, 60%, 50%)", "hsl(38, 40%, 58%)", "hsl(145, 38%, 42%)"];
  const dowLabels = ["M", "T", "W", "T", "F", "S", "S"];

  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 11, color: "#8a8478", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</div>
      <div style={{ display: "flex", gap: 1, overflowX: "auto", paddingBottom: 4 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 1, marginRight: 4 }}>
          {dowLabels.map((l, i) => (
            <div key={i} style={{ width: 12, height: 13, fontSize: 9, color: "#b0a898", display: "flex", alignItems: "center", justifyContent: "center" }}>{i % 2 === 1 ? l : ""}</div>
          ))}
        </div>
        {weeks.map((week, wi) => (
          <div key={wi} style={{ display: "flex", flexDirection: "column", gap: 1 }}>
            {Array.from({ length: 7 }, (_, di) => {
              const cell = week[di];
              if (!cell) return <div key={di} style={{ width: 13, height: 13, borderRadius: 2, backgroundColor: "#ede8e0" }} />;
              return (
                <div key={di} title={`${fmtDate(cell.date)}: ${cell.value}`}
                  style={{ width: 13, height: 13, borderRadius: 2, backgroundColor: colors[cell.quality], opacity: 0.85 }} />
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function SparkLine({ data, baseline }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width = canvas.offsetWidth * 2, H = canvas.height = 140 * 2;
    canvas.style.height = "140px"; ctx.scale(2, 2);
    const w = W / 2, h = H / 2, values = data.map(d => d.hr);
    const min = Math.min(...values, baseline) - 3, max = Math.max(...values, baseline) + 3, range = max - min || 1;
    ctx.clearRect(0, 0, w, h); const by = h - 20 - ((baseline - min) / range) * (h - 40);
    ctx.strokeStyle = "#c8bfb0"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(30, by); ctx.lineTo(w - 10, by); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = "#a09888"; ctx.font = "10px 'DM Sans', sans-serif"; ctx.fillText(`${baseline}`, 4, by + 3);
    ctx.strokeStyle = "#5a6a5a"; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.beginPath();
    for (let i = 0; i < values.length; i++) {
      const x = 30 + (i / (values.length - 1)) * (w - 40), y = h - 20 - ((values[i] - min) / range) * (h - 40);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    } ctx.stroke();
    for (let i = 0; i < values.length; i++) {
      const x = 30 + (i / (values.length - 1)) * (w - 40), y = h - 20 - ((values[i] - min) / range) * (h - 40);
      ctx.fillStyle = values[i] > baseline + 2 ? "#c45a3a" : "#5a8a64"; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    }
  }, [data, baseline]);
  return <canvas ref={canvasRef} style={{ width: "100%", height: 140, display: "block" }} />;
}

// ─── Main App ──────────────────────────────────────────────────────────────

function HRCoach() {
  const [rawInput, setRawInput] = useState("");
  const [result, setResult] = useState(null);
  const [selectedMonth, setSelectedMonth] = useState(null);
  const [currentView, setCurrentView] = useState("import");
  const [copied, setCopied] = useState(false);
  const [loading, setLoading] = useState(false);
  const [age, setAge] = useState("");
  const [importPreview, setImportPreview] = useState(null);
  const [pendingText, setPendingText] = useState("");
  const [importError, setImportError] = useState("");

  const runAnalysis = useCallback((text) => {
    try {
      const raw = parseZeppData(text);
      if (raw.length < 100) {
        setImportError(`Need at least 100 valid readings. Parsed ${raw.length}.`);
        setLoading(false); return;
      }
      const cleaned = cleanData(raw);
      const days = groupByDate(cleaned);
      const baseline = computeBaseline(days);
      const dataQuality = computeDataQuality(days);

      const allBpms = cleaned.map(r => r.bpm).sort((a, b) => a - b);
      const p99 = allBpms[Math.floor(allBpms.length * 0.99)] || 175;
      const ageNum = parseInt(age, 10);
      const maxHR = (!isNaN(ageNum) && ageNum > 10 && ageNum < 110)
        ? Math.round(208 - 0.7 * ageNum)
        : p99;

      const dailySignals = computeDailySignals(days, baseline, maxHR);
      const patterns = findPatterns(dailySignals, baseline);
      const recovery = detectWorkoutRecovery(dailySignals, baseline);

      const months = {};
      for (const d of dailySignals) {
        const mk = getMonthKey(d.date);
        if (!months[mk]) months[mk] = [];
        months[mk].push(d);
      }
      const monthKeys = Object.keys(months).sort();
      const monthReports = {};
      for (const mk of monthKeys) {
        const v = months[mk].filter(d => !d.incomplete);
        monthReports[mk] = { avgRecovery: meanArr(v.map(d => d.recoveryQuality)), avgStress: meanArr(v.map(d => d.stressSignature)) };
      }
      for (const mk of monthKeys) {
        monthReports[mk] = generateMonthCoachNotes(months[mk], baseline, dailySignals, monthReports, mk);
      }

      const exportText = generateExportSummary(baseline, dailySignals, patterns, recovery, dataQuality);

      setResult({ baseline, dataQuality, dailySignals, patterns, recovery, months, monthKeys, monthReports, exportText, maxHR });
      setSelectedMonth(monthKeys[monthKeys.length - 1]);
      setCurrentView("overview");
      setLoading(false);
    } catch(e) {
      setImportError("Analysis error: " + e.message);
      setLoading(false);
    }
  }, [age]);

  const handleFile = useCallback((e) => {
    const file = e.target.files[0]; if (!file) return;
    setLoading(true);
    const reader = new FileReader();
    reader.onload = (ev) => {
      setRawInput(ev.target.result);
      setTimeout(() => runAnalysis(ev.target.result), 50);
    };
    reader.readAsText(file);
  }, [runAnalysis]);

  const handleCopySummary = useCallback(() => {
    if (!result) return;
    navigator.clipboard.writeText(result.exportText).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }).catch(() => {});
  }, [result]);

  const loadDemo = () => {
    setLoading(true);
    setTimeout(() => {
      const mock = generateMockZepp(4);
      setRawInput(mock);
      const pv = previewZeppData(mock);
      setImportPreview(pv);
      setPendingText(mock);
      setLoading(false);
    }, 100);
  };

  if (currentView === "import") {
    return (
      <div style={S.shell}>
        <div style={S.importWrap}>
          <div style={S.importInner}>
            <div style={S.eyebrow}>Heart Rate Coach</div>
            <h1 style={S.importTitle}>What your heart rate<br />has been telling you</h1>
            <p style={S.importSub}>Everything runs in-browser — nothing leaves your device.</p>

            {loading && <div style={{ padding: 32, textAlign: "center", color: "#5a8a64", fontSize: 15, fontWeight: 500 }}>Analysing your data…</div>}

            {!loading && (
              <>
                {importError && <div style={{ padding: "12px 14px", borderRadius: 8, backgroundColor: "#f8f0ec", border: "1px solid #e7c4b0", color: "#8a4a2a", fontSize: 13, marginBottom: 16 }}>{importError}</div>}
                {importPreview && (
                  <div style={{ padding: "16px 14px", borderRadius: 10, backgroundColor: "#f4f7f2", border: "1px solid #c8d8c4", marginBottom: 18 }}>
                    <div style={{ fontSize: 11, color: "#5a7a5a", textTransform: "uppercase", fontWeight: 600, marginBottom: 8 }}>Import summary</div>
                    <div style={{ fontSize: 13, color: "#3a5a3a", lineHeight: 1.6 }}>
                      <div>Parsed {importPreview.parsed} readings. {importPreview.totalDays} days.</div>
                    </div>
                    <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                      <button style={{ ...S.btnPrimary, padding: "10px 18px" }} onClick={() => { setImportError(""); setLoading(true); setTimeout(() => runAnalysis(pendingText || rawInput), 50); }}>Run analysis</button>
                      <button style={S.btnGhost} onClick={() => { setImportPreview(null); setPendingText(""); }}>Clear</button>
                    </div>
                  </div>
                )}
                <div style={{ padding: "28px 20px", borderRadius: 10, border: "2px dashed #c8c0b4", backgroundColor: "#fff", textAlign: "center", marginBottom: 24, position: "relative" }}>
                  <div style={{ fontSize: 28, marginBottom: 8 }}>📂</div>
                  <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>Tap to select your Zepp export</div>
                  <div style={{ fontSize: 13, color: "#8a8070" }}>.txt, .csv, or .tsv file</div>
                  <input type="file" accept=".txt,.csv,.tsv" onChange={handleFile} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", opacity: 0, cursor: "pointer" }} />
                </div>
                <div style={{ display: "flex", gap: 10, marginBottom: 24 }}>
                  <button style={{ ...S.btnGhost, flex: 1, padding: "12px" }} onClick={loadDemo}>Load demo data</button>
                </div>
                <details style={{ marginBottom: 16 }}>
                  <summary style={{ fontSize: 13, color: "#8a8070", cursor: "pointer" }}>Or paste data manually</summary>
                  <textarea value={rawInput} onChange={(e) => setRawInput(e.target.value)} placeholder="Paste data here…" style={{ ...S.textarea, minHeight: 120, marginTop: 8 }} spellCheck={false} />
                  {rawInput.length > 0 && <button style={{ ...S.btnPrimary, marginTop: 10, width: "100%" }} onClick={() => { setImportError(""); const pv = previewZeppData(rawInput); setImportPreview(pv); setPendingText(rawInput); }}>Analyse ({(rawInput.length / 1024).toFixed(0)} KB)</button>}
                </details>
                <div style={{ marginTop: 20, display: "flex", alignItems: "center", gap: 12 }}>
                  <label style={{ fontSize: 13, color: "#6a6055" }}>Your age</label>
                  <input type="number" min="10" max="100" value={age} onChange={e => setAge(e.target.value)} placeholder="e.g. 35" style={{ width: 80, padding: "6px 10px", fontSize: 14, border: "1px solid #d0c8b8", borderRadius: 6 }} />
                </div>
              </>
            )}
          </div>
        </div>
      </div>
    );
  }

  if (!result) return null;
  const { baseline, dailySignals, patterns, recovery, monthKeys, monthReports, months, dataQuality } = result;
  const validDays = dailySignals.filter(d => !d.incomplete), lastValid = validDays[validDays.length - 1];
  const dateRange = `${fmtDate(dailySignals[0].date)} – ${fmtDate(dailySignals[dailySignals.length - 1].date)}`;

  if (currentView === "overview") {
    return (
      <div style={S.shell}>
        <div style={S.report}>
          <div style={S.header}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
              <div><div style={S.eyebrow}>Heart Rate Coach</div><h1 style={S.title}>Your health profile</h1><div style={S.meta}>{dataQuality.totalDays} days · {dataQuality.validDays} valid</div></div>
              <div style={{ display: "flex", gap: 8 }}><button style={S.btnGhost} onClick={handleCopySummary}>{copied ? "✓ Copied" : "Copy summary"}</button><button style={S.btnGhost} onClick={() => setCurrentView("import")}>← New data</button></div>
            </div>
          </div>
          <div style={S.card}><div style={S.cardLabel}>Personal baseline</div><div style={S.baseGrid}>
            <div style={S.baseStat}><div style={S.bigNum}>{baseline.restingHR}</div><div style={S.statLabel}>Resting HR</div></div>
            {lastValid && <div style={S.baseStat}><div style={{ ...S.bigNum, color: lastValid.dynamicBaseline > baseline.restingHR + 2 ? "#c45a3a" : "#1a1510" }}>{lastValid.dynamicBaseline}</div><div style={S.statLabel}>Adaptive</div></div>}
            <div style={S.baseStat}><div style={S.bigNum}>±{baseline.std}</div><div style={S.statLabel}>Variability</div></div>
          </div></div>
          <div style={S.card}><div style={S.cardLabel}>Signal overview</div>
            <FullGridHeatmap signals={validDays} field="recoveryQuality" label="Recovery Quality" isInverse={false} />
            <FullGridHeatmap signals={validDays} field="stressSignature" label="Stress Signature" isInverse={true} />
            <FullGridHeatmap signals={validDays} field="cardioEfficiency" label="Efficiency" isInverse={false} />
          </div>
          {patterns.length > 0 && (
            <div style={S.card}>
              <div style={S.cardLabel}>Insights</div>
              {patterns.map((p, i) => (
                <div key={i} style={{ ...S.insight, borderLeftColor: p.severity === "warning" ? "#c47a3a" : "#5a8a64" }}>
                  <div style={S.insightTitle}>{p.title}</div>
                  <div style={S.insightBody}>{p.detail}</div>
                </div>
              ))}
            </div>
          )}
          <div style={S.card}><div style={S.cardLabel}>Month-by-month</div><div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>{monthKeys.map(mk => <button key={mk} onClick={() => { setSelectedMonth(mk); setCurrentView("month"); }} style={S.monthBtn}>{fmtMonth(mk)}</button>)}</div></div>
        </div>
      </div>
    );
  }

  if (currentView === "month" && selectedMonth) {
    const monthData = months[selectedMonth] || [], report = monthReports[selectedMonth], valid = monthData.filter(d => !d.incomplete), nightTrend = valid.filter(d => d.nightMeanHR !== null).map(d => ({ date: d.date, hr: d.nightMeanHR }));
    return (
      <div style={S.shell}><div style={S.report}><div style={S.header}><button style={S.btnGhost} onClick={() => setCurrentView("overview")}>← Overview</button><h1 style={S.title}>{fmtMonth(selectedMonth)}</h1><div style={S.meta}>{valid.length} days</div></div>
        <div style={S.card}><div style={S.cardLabel}>Summary</div><p style={S.coachText}>{report.summary}</p></div>
        {report.monthComparison && <div style={S.card}><div style={S.cardLabel}>vs {report.monthComparison.prevMonth}</div><div style={{ display: "flex", justifyContent: "space-around" }}><div style={{ textAlign: "center" }}><div style={{ fontSize: 24, fontFamily: "'Instrument Serif', serif", color: report.monthComparison.recDiff > 0 ? "#5a8a64" : "#c45a3a" }}>{report.monthComparison.recDiff > 0 ? "+" : ""}{report.monthComparison.recDiff}</div><div style={S.statLabel}>Recovery</div></div><div style={{ textAlign: "center" }}><div style={{ fontSize: 24, fontFamily: "'Instrument Serif', serif", color: report.monthComparison.stressDiff < 0 ? "#5a8a64" : "#c45a3a" }}>{report.monthComparison.stressDiff > 0 ? "+" : ""}{report.monthComparison.stressDiff}</div><div style={S.statLabel}>Stress</div></div></div></div>}
        <div style={S.card}><div style={S.cardLabel}>Monthly signals</div>
          <GridHeatmap signals={valid} field="recoveryQuality" label="Recovery" isInverse={false} />
          <GridHeatmap signals={valid} field="stressSignature" label="Stress" isInverse={true} />
          <GridHeatmap signals={valid} field="recoveryDebt" label="Debt" isInverse={true} />
        </div>
        {report.notes.length > 0 && <div style={S.card}><div style={S.cardLabel}>Observations</div>{report.notes.map((n, i) => <div key={i} style={S.coachNote}><span style={S.coachIcon}>{n.icon}</span><span style={S.coachNoteText}>{n.text}</span></div>)}</div>}
        {nightTrend.length > 5 && <div style={S.card}>
          <div style={S.cardLabel}>Overnight HR trend</div><SparkLine data={nightTrend} baseline={baseline.restingHR} />
        </div>}
        <div style={S.card}><div style={S.cardLabel}>Daily log</div><div style={S.dayGrid}><div style={S.dayGridH}><span>Date</span><span>HR</span><span>Rec</span><span>Str</span><span>Notes</span></div>{valid.map((d, i) => <div key={i} style={S.dayRow}><span>{fmtDate(d.date)}</span><span style={{ textAlign: "center" }}>{d.nightMeanHR}</span><span style={{ textAlign: "center", color: d.recoveryQuality > 60 ? "#5a8a64" : d.recoveryQuality < 40 ? "#c45a3a" : "#a09060" }}>●</span><span style={{ textAlign: "center", color: d.stressSignature > 60 ? "#c45a3a" : d.stressSignature < 35 ? "#5a8a64" : "#a09060" }}>●</span><span style={{ fontSize: 11, fontStyle: "italic" }}>{d.activityLevel}</span></div>)}</div></div>
      </div></div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<HRCoach />);
</script>
