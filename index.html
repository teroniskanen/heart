  const topDisruptors = disruptorKeys
    .map(k => [k, driverCounts[k] || 0])
    .filter(x => x[1] > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);
  if (topDisruptors.length > 0) {
    const parts = topDisruptors.map(([k, v]) => `${labelMap[k] || k} (${v} day${v !== 1 ? "s" : ""})`);
    notes.push({ icon: "◎", text: `Most common disruptors this month: ${parts.join(", ")}.` });
  }

  const topWins = winKeys
    .map(k => [k, driverCounts[k] || 0])
    .filter(x => x[1] > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);
  if (topWins.length > 0) {
    const parts = topWins.map(([k, v]) => `${labelMap[k] || k} (${v} day${v !== 1 ? "s" : ""})`);
    notes.push({ icon: "✦", text: `What went well: ${parts.join(", ")}.` });
  }

  // Change vs previous month (if available)
  if (allSignals && allMonthReports) {
    const sortedKeys = Object.keys(allMonthReports).sort();
    const idx = sortedKeys.indexOf(currentMonthKey);
    if (idx > 0) {
      const prevKey = sortedKeys[idx - 1];
      const prevValid = allSignals.filter(d => getMonthKey(d.date) === prevKey && !d.incomplete && d.confidence !== "low");
      const prevCounts = {};
      for (const d of prevValid) {
        if (!d.drivers) continue;
        for (const k of d.drivers) prevCounts[k] = (prevCounts[k] || 0) + 1;
      }
      const diffs = disruptorKeys
        .map(k => ({ k, delta: (driverCounts[k] || 0) - (prevCounts[k] || 0) }))
        .filter(x => Math.abs(x.delta) >= 3)
        .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))
        .slice(0, 3);
      if (diffs.length > 0) {
        const parts = diffs.map(d => `${labelMap[d.k] || d.k} ${d.delta > 0 ? "↑" : "↓"} ${Math.abs(d.delta)}`);
        notes.push({ icon: "⇄", text: `Compared with last month: ${parts.join(", ")}.` });
      }
    }
  }

// ── Intra-month trend ──
  if (valid.length >= 14) {
    const firstHalf = valid.slice(0, Math.floor(valid.length / 2));
    const secondHalf = valid.slice(Math.floor(valid.length / 2));
    const firstRec = meanArr(firstHalf.map(d => d.recoveryQuality));
    const secondRec = meanArr(secondHalf.map(d => d.recoveryQuality));
    const firstStress = meanArr(firstHalf.map(d => d.stressSignature));
    const secondStress = meanArr(secondHalf.map(d => d.stressSignature));

    if (secondRec - firstRec > 6) {
      notes.push({ icon: "↗", text: `The month got better. Recovery improved from ~${Math.round(firstRec)} in the first half to ~${Math.round(secondRec)} in the second.` });
    } else if (firstRec - secondRec > 6) {
      notes.push({ icon: "↘", text: `The month declined. Recovery dropped from ~${Math.round(firstRec)} early to ~${Math.round(secondRec)} later.` });
      guidance.push("When signals deteriorate through a month, it usually means load accumulated faster than recovery. Consider front-loading your harder activities earlier in the month and tapering intensity in the final week.");
    }
    if (secondStress - firstStress > 6) {
      notes.push({ icon: "↗", text: `Stress rose through the month (${Math.round(firstStress)} → ${Math.round(secondStress)}).` });
    }
  }

  // ── Day callouts — best and worst ──
  if (valid.length >= 7) {
    const eligible = valid.filter(d => d.confidence !== "low");
    const sorted = [...(eligible.length ? eligible : valid)].sort((a, b) => b.recoveryQuality - a.recoveryQuality);
    const best = sorted[0];
    const worst = sorted[sorted.length - 1];
    if (best.recoveryQuality - worst.recoveryQuality > 15) {
      const bestDay = new Date(best.date).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
      const worstDay = new Date(worst.date).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
      callouts.push({ best: { date: bestDay, recovery: best.recoveryQuality, stress: best.stressSignature }, worst: { date: worstDay, recovery: worst.recoveryQuality, stress: worst.stressSignature } });
    }
  }

  // ── Month-over-month comparison (full card data) ──
  let monthComparison = null;
  if (allMonthReports && allSignals) {
    const sortedKeys = Object.keys(allMonthReports).sort();
    const currentIdx = sortedKeys.indexOf(currentMonthKey);
    if (currentIdx > 0) {
      const prevKey = sortedKeys[currentIdx - 1];
      const prevValid = allSignals.filter(d => getMonthKey(d.date) === prevKey && !d.incomplete);
      const prevReport = allMonthReports[prevKey];
      if (prevReport && prevReport.avgRecovery !== undefined && prevValid.length >= 5) {
        const prevAvgDebt = meanArr(prevValid.map(d => d.recoveryDebt));
        const prevAvgLoad = prevReport.avgLoad !== undefined ? prevReport.avgLoad : null;
        const prevAvgEff  = prevReport.avgEfficiency !== undefined ? prevReport.avgEfficiency : null;
        const recDiff     = avgRecovery - prevReport.avgRecovery;
        const stressDiff  = avgStress   - prevReport.avgStress;
        const debtDiff    = avgDebt     - prevAvgDebt;
        const loadDiff    = prevAvgLoad !== null ? avgLoad - prevAvgLoad : null;
        // Driver deltas
        const prevCounts = {};
        for (const d of prevValid) { if (d.drivers) for (const k of d.drivers) prevCounts[k] = (prevCounts[k] || 0) + 1; }
        const allDriverKeys = ["elevated_night_hr","late_nadir","flat_evening","high_night_volatility","high_wake_spike","high_idle_stress","low_pulse_stability","good_nadir","good_evening_drop","stable_pulse","smooth_wake","calm_day"];
        const driverDeltas = allDriverKeys
          .map(k => ({ k, curr: driverCounts[k] || 0, prev: prevCounts[k] || 0, delta: (driverCounts[k] || 0) - (prevCounts[k] || 0) }))
          .filter(x => Math.abs(x.delta) >= 2)
          .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))
          .slice(0, 4);
        monthComparison = {
          prevMonth: fmtMonth(prevKey),
          improving: recDiff > 0 || stressDiff < 0,
          changes: `Recovery ${recDiff > 0 ? "+" : ""}${Math.round(recDiff * 10) / 10}, stress ${stressDiff > 0 ? "+" : ""}${Math.round(stressDiff * 10) / 10}`,
          recDiff: Math.round(recDiff * 10) / 10,
          stressDiff: Math.round(stressDiff * 10) / 10,
          debtDiff: Math.round(debtDiff * 10) / 10,
          loadDiff: loadDiff !== null ? Math.round(loadDiff) : null,
          driverDeltas,
        };
      }
    }
  }

  // ── Weekly summaries + forward focus ──
  const weeklySummaries = [];
  if (valid.length >= 7) {
    // Group by Mon-Sun calendar weeks
    const weekMap = {};
    for (const d of valid) {
      const dt = new Date(d.date);
      const day = dt.getDay(); // 0=Sun
      const mondayOffset = (day === 0 ? -6 : 1 - day);
      const monday = new Date(dt);
      monday.setDate(dt.getDate() + mondayOffset);
      const wk = monday.toISOString().slice(0, 10);
      if (!weekMap[wk]) weekMap[wk] = [];
      weekMap[wk].push(d);
    }
    for (const [wk, days] of Object.entries(weekMap).sort()) {
      if (days.length < 3) continue;
      const avgRec  = meanArr(days.map(d => d.recoveryQuality));
      const avgStr  = meanArr(days.map(d => d.stressSignature));
      const avgDebt = meanArr(days.map(d => d.recoveryDebt));
      const workouts = days.filter(d => d.activityLevel === "workout" || d.activityLevel === "moderate").length;
      const topDrivers = {};
      for (const d of days) { if (d.drivers) for (const k of d.drivers) topDrivers[k] = (topDrivers[k] || 0) + 1; }
      const label = new Date(wk).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      weeklySummaries.push({ wk, label, avgRec: Math.round(avgRec), avgStr: Math.round(avgStr), avgDebt: Math.round(avgDebt), workouts, topDrivers, days: days.length });
    }
  }

  let weeklyFocus = null;
  if (weeklySummaries.length >= 2) {
    const scored = weeklySummaries.map(w => ({ ...w, score: w.avgRec - w.avgStr * 0.5 - w.avgDebt * 0.3 }));
    const best  = scored.reduce((a, b) => b.score > a.score ? b : a);
    const tough = scored.reduce((a, b) => b.score < a.score ? b : a);
    // Pick forward focus from dominant monthly disruptors
    const focusMap = [
      { key: "late_nadir",          rec: "Earlier evenings and lighter meals after 8 pm" },
      { key: "high_idle_stress",    rec: "Reduce stimulants after noon and add brief midday movement" },
      { key: "high_wake_spike",     rec: "Hydrate immediately on waking and review pre-sleep habits" },
      { key: "elevated_night_hr",   rec: "Prioritise sleep regularity over duration this week" },
      { key: "flat_evening",        rec: "Wind down earlier — dimmer light and no screens after 9 pm" },
      { key: "high_night_volatility", rec: "Eliminate alcohol and heavy meals in the 3 hours before bed" },
      { key: "low_pulse_stability",   rec: "Space intensity and add one genuine rest day" },
    ];
    let focusRec = null;
    let focusReason = null;
    for (const { key, rec } of focusMap) {
      if ((driverCounts[key] || 0) >= 4) { focusRec = rec; focusReason = labelMap[key] || key; break; }
    }
    if (!focusRec && topDisruptors.length > 0) {
      const top = topDisruptors[0];
      focusRec = "Reduce the most common disruptor from this month";
      focusReason = labelMap[top[0]] || top[0];
    }
    weeklyFocus = { best, tough, focusReason, focusRec };
  }

  // ── Summary ──
  let summary = "";
  if (monthRestingHR !== null) {
    const diff = monthRestingHR - baseline.restingHR;
    if (Math.abs(diff) < 2) summary = `Resting HR: ~${monthRestingHR} bpm — right at your baseline.`;
    else if (diff > 0) summary = `Resting HR: ~${monthRestingHR} bpm — ${Math.round(diff)} bpm above your baseline of ${baseline.restingHR}.`;
    else summary = `Resting HR: ~${monthRestingHR} bpm — ${Math.round(Math.abs(diff))} bpm below baseline (${baseline.restingHR}). Positive sign.`;
  }

  // ── Top priority ──
  let priority = null;
  if (primaryRecommendation) {
    priority = { label: primaryRecommendation.title, text: primaryRecommendation.why, confidence: primaryRecommendation.confidence };
  } else if (avgRecovery < 45) priority = { label: "Sleep & recovery", text: "Your #1 lever this month is sleep. Everything else improves when overnight recovery improves. Start with consistent timing." };
  else if (avgStress > 60 && restHighStressDays.length > activeHighStressDays.length) priority = { label: "Stress management", text: "Your body is running hot in the evenings even on rest days. Focus on winding down earlier — this single change will cascade into better recovery and lower debt." };
  else if (avgDebt > 50) priority = { label: "Load management", text: "You're accumulating more strain than you're clearing. Introduce at least one genuine rest day per week — not active recovery, actual rest." };
  else if (avgEfficiency < 35 && totalActive < valid.length * 0.2) priority = { label: "Movement", text: "Low cardiovascular efficiency combined with few active days. Even light daily movement (walking, stretching) will bring your daytime HR down and improve all other signals." };
  else if (avgEfficiency < 35) priority = { label: "Daytime HR", text: "Your heart is working harder than it needs to during the day. Check hydration, caffeine timing, and consider adding low-intensity movement." };

  return {
    summary,
    notes,
    guidance,
    callouts,
    monthComparison,
    weeklyFocus,
    weeklySummaries,
    priority,
    recommendations: rangeRecommendations,
    primaryRecommendation,
    avgRecovery,
    avgStress,
    avgLoad,
    avgEfficiency,
    avgDebt,
    workoutCount: workoutDays.length,
    dataQualitySummary,
  };
}


// ─── UI Components ───────────────────────────────────────────────────────

function GridHeatmap({ signals, field, label, isInverse }) {
  const T = useContext(ThemeContext);
  const valid = signals.filter(d => !d.incomplete);
  if (valid.length === 0) return null;
  const values = valid.map(d => d[field]);
  const sorted = [...values].sort((a, b) => a - b);
  let lo = sorted[Math.floor(sorted.length * 0.25)];
  let hi = sorted[Math.floor(sorted.length * 0.75)];
  if (hi - lo < 5) {
    const mid = (lo + hi) / 2;
    lo = mid - 3;
    hi = mid + 3;
  }

  // Build a calendar-aligned grid for the month
  const lookup = {};
  valid.forEach((d, i) => { lookup[d.date] = values[i]; });

  const firstDate = new Date(valid[0].date);
  const lastDate = new Date(valid[valid.length - 1].date);
  const year = firstDate.getFullYear();
  const month = firstDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Mon=0

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) {
    const dk = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    if (lookup[dk] !== undefined) {
      const v = lookup[dk];
      let quality;
      if (isInverse) quality = v < lo ? 2 : v > hi ? 0 : 1;
      else quality = v > hi ? 2 : v < lo ? 0 : 1;
      cells.push({ quality, value: v, date: dk, day });
    } else {
      cells.push({ empty: true, day });
    }
  }

  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) {
    weeks.push(cells.slice(i, i + 7));
  }
  const colors = [T.warm, T.gold, T.calm];
  const dowLabels = ["M", "T", "W", "T", "F", "S", "S"];

  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 11, color: T.soft, marginBottom: 6, fontFamily: "'DM Sans', sans-serif", letterSpacing: "0.05em", textTransform: "uppercase" }}>{label}</div>
      <div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 22px)", gap: 2, marginBottom: 2 }}>
          {dowLabels.map((l, i) => (
            <div key={i} style={{ fontSize: 9, color: T.faint, textAlign: "center" }}>{l}</div>
          ))}
        </div>
        {weeks.map((week, wi) => (
          <div key={wi} style={{ display: "grid", gridTemplateColumns: "repeat(7, 22px)", gap: 2, marginBottom: 2 }}>
            {Array.from({ length: 7 }, (_, di) => {
              const cell = week[di];
              if (!cell) return <div key={di} style={{ width: 22, height: 18, borderRadius: 3 }} />;
              if (cell.empty) return <div key={di} style={{ width: 22, height: 18, borderRadius: 3, backgroundColor: T.paper }} />;
              return (
                <div key={di} title={`${cell.day}: ${cell.value}`}
                  style={{ width: 22, height: 18, borderRadius: 3, backgroundColor: colors[cell.quality], opacity: 0.88 }} />
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function FullGridHeatmap({ signals, field, label, isInverse }) {
  const T = useContext(ThemeContext);
  const valid = signals.filter(d => !d.incomplete);
  if (valid.length === 0) return null;
  const values = valid.map(d => d[field]);
  const sorted = [...values].sort((a, b) => a - b);
  let lo = sorted[Math.floor(sorted.length * 0.25)];
  let hi = sorted[Math.floor(sorted.length * 0.75)];
  if (hi - lo < 5) {
    const mid = (lo + hi) / 2;
    lo = mid - 3;
    hi = mid + 3;
  }

  const firstDate = new Date(valid[0].date);
  const startDow = (firstDate.getDay() + 6) % 7; // Mon=0
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (const d of valid) {
    const v = d[field];
    let quality;
    if (isInverse) quality = v < lo ? 2 : v > hi ? 0 : 1;
    else quality = v > hi ? 2 : v < lo ? 0 : 1;
    cells.push({ quality, value: v, date: d.date });
  }
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) {
    weeks.push(cells.slice(i, i + 7));
  }
  const colors = [T.warm, T.gold, T.calm];
  const dowLabels = ["M", "T", "W", "T", "F", "S", "S"];

  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 11, color: T.soft, marginBottom: 6, fontFamily: "'DM Sans', sans-serif", letterSpacing: "0.05em", textTransform: "uppercase" }}>{label}</div>
      <div style={{ display: "flex", gap: 1, overflowX: "auto", WebkitOverflowScrolling: "touch", paddingBottom: 4 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 1, marginRight: 4 }}>
          {dowLabels.map((l, i) => (
            <div key={i} style={{ width: 12, height: 13, fontSize: 9, color: T.faint, display: "flex", alignItems: "center", justifyContent: "center" }}>{i % 2 === 1 ? l : ""}</div>
          ))}
        </div>
        {weeks.map((week, wi) => (
          <div key={wi} style={{ display: "flex", flexDirection: "column", gap: 1 }}>
            {Array.from({ length: 7 }, (_, di) => {
              const cell = week[di];
              if (!cell) return <div key={di} style={{ width: 13, height: 13, borderRadius: 2, backgroundColor: T.paper }} />;
              return (
                <div key={di} title={`${fmtDate(cell.date)}: ${cell.value}`}
                  style={{ width: 13, height: 13, borderRadius: 2, backgroundColor: colors[cell.quality], opacity: 0.85, cursor: "default" }} />
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function SparkLine({ data, baseline }) {
  const T = useContext(ThemeContext);
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = 140 * 2;
    canvas.style.height = "140px";
    ctx.scale(2, 2);
    const w = W / 2, h = H / 2;
    const values = data.map(d => d.hr);
    const min = Math.min(...values, baseline) - 3;
    const max = Math.max(...values, baseline) + 3;
    const range = max - min || 1;
    ctx.clearRect(0, 0, w, h);
    const by = h - 20 - ((baseline - min) / range) * (h - 40);
    ctx.strokeStyle = T.hair;
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(30, by);
    ctx.lineTo(w - 10, by);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = T.faint;
    ctx.font = "10px 'DM Sans', sans-serif";
    ctx.fillText(`${baseline}`, 4, by + 3);
    ctx.strokeStyle = T.calm;
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i < values.length; i++) {
      const x = 30 + (i / (values.length - 1)) * (w - 40);
      const y = h - 20 - ((values[i] - min) / range) * (h - 40);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    for (let i = 0; i < values.length; i++) {
      const x = 30 + (i / (values.length - 1)) * (w - 40);
      const y = h - 20 - ((values[i] - min) / range) * (h - 40);
      ctx.fillStyle = values[i] > baseline + 2 ? T.warm : T.calm;
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }, [data, baseline, T]);
  return <canvas ref={canvasRef} style={{ width: "100%", height: 140, display: "block" }} />;
}

function buildHourlySeries(readings) {
  const buckets = {};
  for (const r of readings || []) {
    const key = `${String(r.hour).padStart(2, "0")}:00`;
    if (!buckets[key]) buckets[key] = [];
    buckets[key].push(r.bpm);
  }
  return Object.entries(buckets)
    .map(([hour, values]) => ({ hour, bpm: Math.round(meanArr(values)) }))
    .sort((a, b) => a.hour.localeCompare(b.hour));
}

  useEffect(() => {
    if (result && !selectedMonth && result.monthKeys && result.monthKeys.length > 0) {
      setSelectedMonth(result.monthKeys[result.monthKeys.length - 1]);
    }
  }, [result, selectedMonth]);
  useEffect(() => {
    if (!result && currentView !== "import") setCurrentView("import");
  }, [result, currentView]);

  const doPreview = useCallback((text, name = "") => {
    setImportError("");
    setRawInput(text);
    setPendingText(text);
    setFileName(name);
    setImportPreview(previewZeppData(text));
  }, []);

  const resetAnalysis = useCallback(() => {
    setResult(null);
    setSelectedMonth(null);
    setCurrentView("import");
    setImportPreview(null);

    setRawInput("");
    setFileName("");
    setPersistWarning("");
    removeStorageKeys([STORAGE_KEYS.analysis, STORAGE_KEYS.raw, STORAGE_KEYS.month, STORAGE_KEYS.view, STORAGE_KEYS.fileName]);
  }, []);

  const runAnalysis = useCallback((text) => {
    try {
      const raw = parseZeppData(text);
      if (raw.length < 100) {
        alert(`Parsed ${raw.length} valid readings from ${text.length} bytes. Need at least 100.\n\nLine 1: ${text.split("\n")[0].substring(0, 80)}\nLine 2: ${(text.split("\n")[1]||"").substring(0, 80)}\n\nExpected: DD/MM/YYYY, HH:MM, BPM (comma or tab separated).`);
        setLoading(false);
        return;
      }
      const cleaned = cleanData(raw);
      const days = groupByDate(cleaned);
      const baseline = computeBaseline(days);
      const dataQuality = computeDataQuality(days);

      const allBpms = cleaned.map(r => r.bpm).sort((a, b) => a - b);
      const p99 = allBpms[Math.floor(allBpms.length * 0.99)] || 175;
      const ageNum = parseInt(age, 10);
      const maxHR = (!isNaN(ageNum) && ageNum > 10 && ageNum < 110)
        ? Math.round(208 - 0.7 * ageNum)
        : p99;

      const dailySignals = computeDailySignals(days, baseline, maxHR);
      const patterns = findPatterns(dailySignals, baseline);
      const recovery = detectWorkoutRecovery(dailySignals, baseline);

      const months = {};
      for (const d of dailySignals) {
        const mk = getMonthKey(d.date);
        if (!months[mk]) months[mk] = [];
        months[mk].push(d);
      }
      const monthKeys = Object.keys(months).sort();
      const monthReports = {};
      for (const mk of monthKeys) {

      for (const mk of monthKeys) {
        monthReports[mk] = generateMonthCoachNotes(months[mk], baseline, dailySignals, monthReports, mk);
      }

      const exportText = generateExportSummary(baseline, dailySignals, patterns, recovery, dataQuality);
      const analysis = { baseline, dataQuality, dailySignals, patterns, recovery, months, monthKeys, monthReports, exportText, maxHR, rawReadingsByDate: days };

      setResult(analysis);
      if (text.length <= RAW_PERSIST_LIMIT) {
        writeStorage(STORAGE_KEYS.raw, text);
        setPersistWarning("");
      } else {
        writeStorage(STORAGE_KEYS.raw, "");

      }
      setSelectedMonth(monthKeys[monthKeys.length - 1] || null);
      setCurrentView("overview");

    const overallStress = overallSummary.avgStress;

    const overallPrimary = pickPrimaryRecommendation(overallRecommendations);

    return (
      <ThemeContext.Provider value={activeTheme}>
      <div style={S.shell}>
        <div style={S.report}>
          <div style={S.header}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
              <div>
                <div style={S.eyebrow}>Heart Rate Coach</div>
                <h1 style={S.title}>Your health profile</h1>
                <div style={S.meta}>{dataQuality.totalDays} days · {dateRange} · {dataQuality.validDays} with good coverage</div>
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button style={S.btnGhost} onClick={handleCopySummary}>{copied ? "✓ Copied" : "Copy summary"}</button>
                <button style={S.btnGhost} onClick={resetAnalysis}>← New data</button>
              </div>
            </div>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Data quality</div>
            <p style={S.cardSub}>
              Average daily coverage: {dataQuality.avgCoverage}%.
              {dataQuality.incompleteDays > 0
                ? ` ${dataQuality.incompleteDays} day${dataQuality.incompleteDays > 1 ? "s" : ""} had less than 80% coverage and ${dataQuality.incompleteDays > 1 ? "are" : "is"} excluded from signal analysis.`
                : " All days had sufficient coverage for analysis."
              }
            </p>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Your personal baseline</div>
            <div style={S.baseGrid}>
              <div style={S.baseStat}>
                <div style={S.bigNum}>{baseline.restingHR}</div>
                <div style={S.statLabel}>Initial resting HR</div>
              </div>
              {lastValid && lastValid.dynamicBaseline !== undefined && (
                <div style={S.baseStat}>
                  <div style={{ ...S.bigNum, color: lastValid.dynamicBaseline < baseline.restingHR ? "#5a8a64" : lastValid.dynamicBaseline > baseline.restingHR + 2 ? "#c45a3a" : "#1a1510" }}>
                    {lastValid.dynamicBaseline}
                  </div>
                  <div style={S.statLabel}>Current (adaptive)</div>
                </div>
              )}
              <div style={S.baseStat}>
                <div style={S.bigNum}>±{baseline.std}</div>
                <div style={S.statLabel}>Overnight variability</div>
              </div>
              <div style={S.baseStat}>
                <div style={S.bigNum}>{maxHR}</div>
                <div style={S.statLabel}>Max HR {age ? "(Tanaka)" : "(observed)"}</div>
              </div>
              {recovery && (
                <div style={S.baseStat}>
                  <div style={S.bigNum}>{recovery.avg.toFixed(1)}</div>
                  <div style={S.statLabel}>Days to recover (avg)</div>
                </div>
              )}
            </div>
            <p style={S.baseNote}>Initial baseline from first 2 weeks. Adaptive baseline uses 21-day EWMA so fitness changes are tracked over time.</p>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Signal overview · full period</div>
            <p style={S.cardSub}>Weeks as columns, days as rows. Thresholds from your own data (25th / 75th percentile).</p>
            <div style={{ display: "flex", gap: 6, marginBottom: 12, fontSize: 11, color: "#8a8478" }}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}><span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: "hsl(145, 38%, 42%)", display: "inline-block" }} /> good for you</span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}><span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: "hsl(38, 40%, 58%)", display: "inline-block" }} /> typical</span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}><span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: "hsl(4, 60%, 50%)", display: "inline-block" }} /> attention</span>
            </div>
            <FullGridHeatmap signals={validDays} field="recoveryQuality" label="Recovery Quality" isInverse={false} />
            <FullGridHeatmap signals={validDays} field="autonomicLoad" label="Autonomic Load" isInverse={true} />
            <FullGridHeatmap signals={validDays} field="pulseStability" label="Pulse Stability (overnight rhythm)" isInverse={false} />
            <div style={{ fontSize: 12, color: activeTheme.faint, marginTop: -4, marginBottom: 10 }}>
              Based on HR reading variation, not inter-beat HRV. Use as a trend indicator only.
            </div>
            <FullGridHeatmap signals={validDays} field="cardioEfficiency" label="Cardiovascular Efficiency" isInverse={false} />
            <FullGridHeatmap signals={validDays} field="stressSignature" label="Stress Signature" isInverse={true} />
            <FullGridHeatmap signals={validDays} field="recoveryDebt" label="Recovery Debt" isInverse={true} />
            {validDays.some(d => d.acwr !== null) && (
              <FullGridHeatmap signals={validDays.map(d => ({ ...d, acwrDisplay: d.acwr !== null ? Math.round(d.acwr * 100) : null }))} field="acwrDisplay" label="Workload Ratio (ACWR ×100, sweet spot 80–130)" isInverse={false} />
            )}
          </div>

          {patterns.length > 0 && (
            <div style={S.card}>
              <div style={S.cardLabel}>What the data tells me</div>
              <p style={S.cardSub}>Patterns found across your full recording period.</p>
              {patterns.map((p, i) => (
                <div key={i} style={{ ...S.insight, borderLeftColor: p.severity === "positive" ? "#5a8a64" : p.severity === "warning" ? "#c47a3a" : "#7a8a9a" }}>
                  <div style={S.insightTitle}>{p.title}</div>
                  <div style={S.insightBody}>{p.detail}</div>
                  {p.guidance && <div style={{ fontSize: 13, color: "#5a6a5a", lineHeight: 1.65, marginTop: 10, padding: "10px 14px", backgroundColor: "#f4f7f2", borderRadius: 6, fontStyle: "italic" }}>💡 {p.guidance}</div>}
                </div>
              ))}
            </div>
          )}

          <div style={S.card}>
            <div style={S.cardLabel}>Month-by-month review</div>
            <p style={S.cardSub}>Tap a month for detailed coach notes.</p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
              {monthKeys.map(mk => {
                const r = monthReports[mk];
                const health = (r.avgRecovery || 50) - (r.avgStress || 50) * 0.4;
                const bg = health > 30 ? "#e8f0e4" : health > 10 ? "#f5f0e6" : "#f5e6e4";
                const border = health > 30 ? "#5a8a64" : health > 10 ? "#c4a43a" : "#c47a3a";
                return (
                  <button key={mk} onClick={() => { setSelectedMonth(mk); setCurrentView("month"); }}
                    style={{ ...S.monthBtn, backgroundColor: bg, borderColor: border }}>
                    {fmtMonth(mk)}
                  </button>
                );
              })}
            </div>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Coach's overall impression</div>
            <p style={S.coachText}>
              {(() => {
                const avgDebt = meanArr(validDays.map(d => d.recoveryDebt));
                const avgLoad = meanArr(validDays.map(d => d.autonomicLoad));
                const avgEff = meanArr(validDays.map(d => d.cardioEfficiency));
                const workouts = validDays.filter(d => d.activityLevel === "workout").length;
                const moderates = validDays.filter(d => d.activityLevel === "moderate").length;
                const lights = validDays.filter(d => d.activityLevel === "light").length;
                const totalActiveDays = workouts + moderates + lights;
                const restRatio = (validDays.length - totalActiveDays) / validDays.length;
                const parts = [];

                // Recovery assessment
                if (overallRecovery > 60) parts.push("Your overnight recovery has been solid — your body resets well most nights.");
                else if (overallRecovery > 45) parts.push("Recovery is adequate but not exceptional. You're getting by, but there's room to improve how well your body resets overnight.");
                else parts.push("Recovery has been under sustained pressure. Your overnight HR isn't dropping as low as your body is capable of, which limits everything else.");

                // Stress assessment
                if (overallStress > 55) parts.push(`Your stress signature has been elevated (avg ${Math.round(overallStress)}), meaning your evenings aren't calming down enough. This is often the easiest signal to improve — even small wind-down routine changes can shift it within days.`);
                else if (overallStress < 35) parts.push("Your stress markers are consistently low, which is a strong foundation.");

                // Activity picture
                if (totalActiveDays > 0) {
                  const actParts = [];
                  if (workouts > 0) actParts.push(`${workouts} workout${workouts > 1 ? 's' : ''}`);
                  if (moderates > 0) actParts.push(`${moderates} moderate`);
                  if (lights > 0) actParts.push(`${lights} light`);
                  parts.push(`Across the period: ${actParts.join(', ')} active day${totalActiveDays > 1 ? 's' : ''} detected, with ${Math.round(restRatio * 100)}% of days at rest.`);
                }

                // Efficiency
                if (avgEff < 40) parts.push(`Cardiovascular efficiency is on the low side (${Math.round(avgEff)}%). Your heart is working harder than it needs to during the day — hydration, caffeine timing, and regular low-intensity movement are the first things to check.`);

                // Top recommendation
                if (overallPrimary) parts.push(`Top priority: ${overallPrimary.why}`);
                else if (overallRecovery < 50) parts.push("Top priority: focus on sleep consistency. Go to bed within a 30-minute window every night for two weeks and watch whether your overnight HR responds.");
                else if (overallStress > 55) parts.push("Top priority: build an evening wind-down. Dim lights, no work email, light activity — give your nervous system a clear signal the day is ending.");
                else if (avgDebt > 45) parts.push("Top priority: make sure you have at least one genuine low-load day per week. Not active recovery — actual rest.");
                else parts.push("Your data looks healthy. The main opportunity is consistency — protect the habits that are working and look for small optimisations rather than big changes.");

                return parts.join(" ");
              })()}
            </p>
          </div>
        </div>
      </div>
      </ThemeContext.Provider>
    );
  }

  // ─── MONTH DETAIL SCREEN ────────────────────────────────────────────────

  if (currentView === "month" && selectedMonth) {
    const monthData = months[selectedMonth] || [];
    const report = monthReports[selectedMonth];
    const valid = monthData.filter(d => !d.incomplete);
    const nightTrend = valid.filter(d => d.nightMeanHR !== null).map(d => ({ date: d.date, hr: d.nightMeanHR }));
    const lowConfidenceDays = valid.filter(d => d.confidence === "low").length;
    const selectedDayRecord = selectedDay ? valid.find(d => d.date === selectedDay) : null;

    return (
      <ThemeContext.Provider value={activeTheme}>
      <div style={S.shell}>
        <div style={S.report}>
          <div style={S.header}>
            <button style={S.btnGhost} onClick={() => setCurrentView("overview")}>← Overview</button>
            <h1 style={S.title}>{fmtMonth(selectedMonth)}</h1>
            <div style={S.meta}>{valid.length} days of data · Data quality: {report.dataQualitySummary?.label || "n/a"} ({report.dataQualitySummary?.sufficientNightPct ?? 0}% sufficient nights)</div>
          </div>

          <div style={S.card}>
            <div style={S.cardLabel}>Monthly resting HR</div>
            <p style={S.coachText}>{report.summary}</p>
            {report.monthComparison && (
              <p style={{ fontSize: 13, color: report.monthComparison.improving ? "#5a8a64" : "#b07040", marginTop: 8, fontStyle: "italic" }}>
                vs {report.monthComparison.prevMonth}: {report.monthComparison.changes}
              </p>
            )}
          </div>

          {/* Monthly comparison card */}
          {report.monthComparison && (() => {
            const mc = report.monthComparison;
            const dl = labelMap => ({
              elevated_night_hr: "Elevated overnight HR",
              late_nadir: "Late HR nadir",
              flat_evening: "Flat evening wind-down",
              high_night_volatility: "Chaotic overnight rhythm",
              low_pulse_stability: "Low pulse stability",
              high_wake_spike: "High wake-up spike",
              high_idle_stress: "High idle stress",
              good_nadir: "Optimal nadir timing",
              good_evening_drop: "Strong evening wind-down",
              stable_pulse: "Stable overnight rhythm",
              smooth_wake: "Smooth wake response",
              calm_day: "Calm daytime HR",
            })[labelMap] || labelMap;
            const fmt = (v, inverse) => {
              if (v === null || v === undefined) return null;
              const sign = v > 0 ? "+" : "";
              const good = inverse ? v < 0 : v > 0;
              return { text: `${sign}${Math.round(v)}`, color: Math.abs(v) < 2 ? "#8a8070" : good ? "#5a8a64" : "#c45a3a" };
            };
            const metrics = [
              { label: "Recovery", val: fmt(mc.recDiff, false) },
              { label: "Stress", val: fmt(mc.stressDiff, true) },
              { label: "Debt", val: fmt(mc.debtDiff, true) },
              { label: "TRIMP", val: mc.loadDiff !== null ? fmt(mc.loadDiff, false) : null },
            ].filter(m => m.val !== null);
            return (
              <div style={S.card}>
                <div style={S.cardLabel}>vs {mc.prevMonth}</div>
                <div style={{ display: "grid", gridTemplateColumns: `repeat(${metrics.length}, 1fr)`, gap: 12, marginBottom: mc.driverDeltas.length > 0 ? 16 : 0 }}>
                  {metrics.map((m, i) => (
                    <div key={i} style={{ textAlign: "center" }}>
                      <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 24, color: m.val.color, lineHeight: 1 }}>{m.val.text}</div>
                      <div style={{ fontSize: 11, color: "#a09888", marginTop: 4, textTransform: "uppercase", letterSpacing: "0.08em" }}>{m.label}</div>
                    </div>
                  ))}
                </div>
                {mc.driverDeltas.length > 0 && (
                  <div style={{ borderTop: "1px solid #f0ece4", paddingTop: 12 }}>
                    {mc.driverDeltas.map((d, i) => (
                      <div key={i} style={{ fontSize: 13, color: "#4a4540", display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: i < mc.driverDeltas.length - 1 ? "1px solid #f8f4ee" : "none" }}>
                        <span>{dl(d.k)}</span>
                        <span style={{ fontWeight: 600, color: d.delta > 0 ? "#c45a3a" : "#5a8a64" }}>{d.delta > 0 ? "↑" : "↓"} {Math.abs(d.delta)} days</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })()}

          {/* Weekly focus card */}
          {report.weeklyFocus && (() => {
            const wf = report.weeklyFocus;
            return (
              <div style={S.card}>
                <div style={S.cardLabel}>Weekly breakdown</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                  <div style={{ padding: "12px 14px", backgroundColor: "#f0f6ee", borderRadius: 8, borderLeft: "3px solid #5a8a64" }}>
                    <div style={{ fontSize: 10, color: "#5a8a64", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 600, marginBottom: 4 }}>Best week</div>
                    <div style={{ fontSize: 12, color: "#3a5a3a", fontWeight: 500, marginBottom: 4 }}>w/c {wf.best.label}</div>
                    <div style={{ fontSize: 12, color: "#6a8a6a" }}>Rec {wf.best.avgRec} · Stress {wf.best.avgStr}</div>
                    {wf.best.workouts > 0 && <div style={{ fontSize: 11, color: "#7a9a8a", marginTop: 2 }}>{wf.best.workouts} workout{wf.best.workouts > 1 ? "s" : ""}</div>}
                  </div>
                  <div style={{ padding: "12px 14px", backgroundColor: "#f8f0ec", borderRadius: 8, borderLeft: "3px solid #c47a3a" }}>
                    <div style={{ fontSize: 10, color: "#c47a3a", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 600, marginBottom: 4 }}>Toughest week</div>
                    <div style={{ fontSize: 12, color: "#8a4a2a", fontWeight: 500, marginBottom: 4 }}>w/c {wf.tough.label}</div>
                    <div style={{ fontSize: 12, color: "#aa7a5a" }}>Rec {wf.tough.avgRec} · Stress {wf.tough.avgStr}</div>
                    {wf.tough.workouts > 0 && <div style={{ fontSize: 11, color: "#c49a7a", marginTop: 2 }}>{wf.tough.workouts} workout{wf.tough.workouts > 1 ? "s" : ""}</div>}
                  </div>
                </div>
                {wf.focusRec && (
                  <div style={{ padding: "12px 14px", backgroundColor: "#f5f2ec", borderRadius: 8, borderLeft: "3px solid #a09060" }}>
                    <div style={{ fontSize: 10, color: "#8a7040", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 600, marginBottom: 6 }}>Consider focusing on next week</div>
                    <div style={{ fontSize: 14, color: "#3a3228", lineHeight: 1.55 }}>{wf.focusRec}</div>
                    <div style={{ fontSize: 11, color: "#a09070", marginTop: 4, fontStyle: "italic" }}>Based on: {wf.focusReason}</div>
                  </div>
                )}
              </div>
            );
          })()}

          <div style={S.card}>
              <div style={S.cardLabel}>Month themes</div>
              <p style={S.cardSub}>Your month, summarised into key disruptors, wins, and changes.</p>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {report.notes.filter(n => n.icon === "◎" || n.icon === "✦" || n.icon === "⇄" || n.icon === "▦").slice(0, 4).map((n, i) => (
                  <div key={i} style={{ fontSize: 14, color: "#4a4540", lineHeight: 1.6, padding: "10px 12px", backgroundColor: "#fbfaf7", borderRadius: 8, border: "1px solid #eee8dc" }}>
                    <span style={{ marginRight: 10, color: "#8a7a60" }}>{n.icon}</span>
                    {n.text}
                  </div>
                ))}
              </div>
            </div>

            {/* Priority recommendation */}
          {report.priority && (
            <div style={{ ...S.card, backgroundColor: "#f4f7f2", borderColor: "#c8d8c4" }}>
              <div style={{ ...S.cardLabel, color: "#5a7a5a" }}>This month's priority: {report.priority.label}{report.priority.confidence ? ` · ${report.priority.confidence} confidence` : ""}</div>
              <p style={{ ...S.coachText, color: "#3a5a3a" }}>{report.priority.text}</p>
            </div>
          )}

          {report.primaryRecommendation && (
            <div style={S.card}>
              <div style={S.cardLabel}>Why this is showing up</div>
              {report.primaryRecommendation.evidence.map((item, i) => (
                <div key={i} style={{ fontSize: 13, color: activeTheme.soft, lineHeight: 1.6, marginBottom: 6 }}>{item}</div>
              ))}
            </div>
          )}

          <div style={S.card}>
            <div style={S.cardLabel}>This month's signals</div>
            <GridHeatmap signals={valid} field="recoveryQuality" label="Recovery Quality" isInverse={false} />
            <GridHeatmap signals={valid} field="stressSignature" label="Stress Signature" isInverse={true} />
            <GridHeatmap signals={valid} field="recoveryDebt" label="Recovery Debt" isInverse={true} />
            <GridHeatmap signals={valid} field="cardioEfficiency" label="Cardiovascular Efficiency" isInverse={false} />
            <GridHeatmap signals={valid} field="autonomicLoad" label="Autonomic Load" isInverse={true} />
            <GridHeatmap signals={valid} field="pulseStability" label="Pulse Stability (overnight rhythm)" isInverse={false} />
            <div style={{ fontSize: 12, color: activeTheme.faint, marginTop: -4 }}>
              Based on HR reading variation, not inter-beat HRV. Use as a trend indicator only.
            </div>
            {valid.some(d => d.acwr !== null) && (
              <GridHeatmap signals={valid.map(d => ({ ...d, acwrDisplay: d.acwr !== null ? Math.round(d.acwr * 100) : null }))} field="acwrDisplay" label="Workload Ratio (ACWR ×100)" isInverse={false} />
            )}
          </div>
          {valid.length > 0 && lowConfidenceDays / valid.length > 0.3 && (
            <div style={{ ...S.card, backgroundColor: activeTheme.paper }}>
              <div style={S.cardLabel}>Confidence note</div>
              <p style={S.cardSub}>{lowConfidenceDays} of {valid.length} days this month had low night-data confidence. Treat month-level conclusions as directional.</p>
            </div>
          )}

          {report.notes.length > 0 && (
            <div style={S.card}>
              <div style={S.cardLabel}>Observations</div>
              {report.notes.map((n, i) => (
                <div key={i} style={S.coachNote}>
                  <span style={S.coachIcon}>{n.icon}</span>
                  <span style={S.coachNoteText}>{n.text}</span>
                </div>
              ))}
            </div>
          )}

          {/* Actionable guidance */}
          {report.guidance && report.guidance.length > 0 && (
            <div style={S.card}>
              <div style={S.cardLabel}>What to try</div>
              {report.guidance.map((g, i) => (
                <div key={i} style={{ fontSize: 14, color: "#4a5a4a", lineHeight: 1.65, padding: "10px 14px", backgroundColor: "#f4f7f2", borderRadius: 6, marginBottom: 8, borderLeft: "3px solid #8aaa7a" }}>
                  {g}
                </div>
              ))}
            </div>
          )}

          {/* Best/worst day callouts */}
          {report.callouts && report.callouts.length > 0 && (
            <div style={S.card}>
              <div style={S.cardLabel}>Day highlights</div>
              {report.callouts.map((c, i) => (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 8 }}>
                  <div style={{ padding: "12px 14px", backgroundColor: "#f0f6ee", borderRadius: 8, borderLeft: "3px solid #5a8a64" }}>
                    <div style={{ fontSize: 11, color: "#5a8a64", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 600, marginBottom: 4 }}>Best day</div>
                    <div style={{ fontSize: 13, color: "#3a5a3a", fontWeight: 500 }}>{c.best.date}</div>
                    <div style={{ fontSize: 12, color: "#6a8a6a" }}>Recovery {c.best.recovery} · Stress {c.best.stress}</div>
                  </div>
                  <div style={{ padding: "12px 14px", backgroundColor: "#f8f0ec", borderRadius: 8, borderLeft: "3px solid #c47a3a" }}>
                    <div style={{ fontSize: 11, color: "#c47a3a", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 600, marginBottom: 4 }}>Hardest day</div>
                    <div style={{ fontSize: 13, color: "#8a4a2a", fontWeight: 500 }}>{c.worst.date}</div>
                    <div style={{ fontSize: 12, color: "#aa7a5a" }}>Recovery {c.worst.recovery} · Stress {c.worst.stress}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {nightTrend.length > 5 && (
            <div style={S.card}>
              <div style={S.cardLabel}>Overnight HR through the month</div>
              <p style={S.cardSub}>Average HR during {NIGHT_LABEL}. Dashed line = your baseline ({baseline.restingHR} bpm).</p>
              <SparkLine data={nightTrend} baseline={baseline.restingHR} />
            </div>
          )}
          <details style={S.card}>
            <summary style={{ cursor: "pointer", color: activeTheme.soft, fontSize: 13 }}>How scores are calculated</summary>
            <div style={{ marginTop: 12, fontSize: 13, color: activeTheme.soft, lineHeight: 1.6 }}>
              <div>Recovery combines your night HR vs your personal baseline and night HR stability.</div>
              <div>Stress reflects how elevated your night HR is relative to baseline.</div>
              <div>These are experimental trend indicators, not clinical measurements.</div>
            </div>
          </details>

          <div style={S.card}>
            <div style={S.cardLabel}>Daily log</div>
            <div style={S.dayGrid}>
              <div style={S.dayGridH}>
                <span>Date</span><span>HR</span><span>Rec</span><span>Str</span><span>Notes</span>
              </div>
              {valid.map((d, i) => {
                const dayLabel = new Date(d.date).toLocaleDateString("en-GB", { weekday: "short", day: "numeric" });
                const recColor = d.recoveryQuality > 60 ? "#5a8a64" : d.recoveryQuality < 40 ? "#c45a3a" : "#a09060";
                const stressColor = d.stressSignature > 60 ? "#c45a3a" : d.stressSignature < 35 ? "#5a8a64" : "#a09060";
                const actLabel = d.activityLevel === "workout" ? "workout" : d.activityLevel === "moderate" ? "moderate" : d.activityLevel === "light" ? "light" : "";
                const actColor = d.activityLevel === "workout" ? "#7a5aaa" : d.activityLevel === "moderate" ? "#5a7aaa" : d.activityLevel === "light" ? "#7a9a8a" : "#a09888";
                return (
                  <div key={i} style={{ ...S.dayRow, cursor: "pointer" }} onClick={() => setSelectedDay(d.date)}>
                    <span style={{ color: "#4a4540" }}>{dayLabel}</span>
                    <span style={{ color: "#6a6055", textAlign: "center" }}>{d.dayMeanHR}</span>
                    <span style={{ fontSize: 14, textAlign: "center", color: recColor }}>●</span>
                    <span style={{ fontSize: 14, textAlign: "center", color: stressColor }}>●</span>
                    <span style={{ fontSize: 12, color: actColor, fontStyle: "italic" }}>
                      {(() => {
        const driverTags = [];
        const drv = d.drivers || [];
        if (drv.includes("late_nadir")) driverTags.push("🌙 late nadir");
        if (drv.includes("elevated_night_hr")) driverTags.push("↑ night HR");
        if (drv.includes("high_wake_spike")) driverTags.push("⚡ wake spike");
        if (drv.includes("high_idle_stress")) driverTags.push("🔥 idle stress");
        if (drv.includes("flat_evening")) driverTags.push("↔ evening");
        if (drv.includes("high_night_volatility") || drv.includes("low_pulse_stability")) driverTags.push("~ Pulse");
        if (drv.includes("good_nadir")) driverTags.push("✦ good nadir");
        const base = [actLabel, d.activeMinutes > 0 && actLabel && `${d.activeMinutes}m`, d.trimp > 0 && `TRIMP ${d.trimp}`, d.acwr !== null && (d.acwr > 1.5 ? `⚠ ACWR ${d.acwr}` : d.acwr < 0.8 ? `↓ ACWR ${d.acwr}` : null), d.coverage < 80 && `${d.coverage}%`, d.coverageNight < 50 && `${d.coverageNight}% night`, d.confidence !== "high" && `⚠ ${confidenceLabel(d.confidence)}`, ...driverTags];
        return base.filter(Boolean).join(" · ");
      })()}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 16 }}>
            {monthKeys.map(mk => (
              <button key={mk} onClick={() => setSelectedMonth(mk)}
                style={{ ...S.monthBtn, backgroundColor: mk === selectedMonth ? "#3a3228" : "#f5f0e8", color: mk === selectedMonth ? "#f5f0e8" : "#3a3228", borderColor: mk === selectedMonth ? "#3a3228" : "#d0c8b8" }}>
                {fmtMonth(mk)}
              </button>
            ))}
          </div>
        </div>
        <DayDetailModal
          day={selectedDayRecord}
          baseline={baseline}
          readings={selectedDayRecord ? rawReadingsByDate[selectedDayRecord.date] || [] : []}
          onClose={() => setSelectedDay(null)}
          theme={activeTheme}
        />
      </div>
      </ThemeContext.Provider>
    );
  }

  return null;
}
